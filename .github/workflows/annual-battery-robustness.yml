name: Annual battery supply VOLL terminal SOC robustness
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/annual-battery-robustness.yml'
      - 'src/energy_transition/annual_battery_robustness.py'
      - 'tests/test_annual_battery_robustness.py'
jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]'
      - run: python -m pytest -q tests/test_annual_battery_robustness.py
      - uses: actions/download-artifact@v4
        with:
          name: eia930-west-2024
          run-id: 40935909190
          github-token: ${{ github.token }}
          path: inputs/demand
      - uses: actions/download-artifact@v4
        with:
          name: renewable-gap-sensitivity-2024
          run-id: 41079435449
          github-token: ${{ github.token }}
          path: inputs/scenarios
      - name: Optimize yearly supply adequacy VOLL and cyclic SOC scenarios
        run: |
          python -m energy_transition.annual_battery_robustness \
            --demand inputs/demand/eia930_demand_2024.csv \
            --scenarios inputs/scenarios/renewable_missing_scenarios.csv \
            --output outputs/annual_robustness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annual-battery-robustness-2024
          path: outputs/annual_robustness/
          retention-days: 60
