name: PyPSA-USA real Western base network build
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pypsa-usa-real-western-base-network.yml
      - src/energy_transition/pypsa_base_network_validate.py
      - src/energy_transition/pypsa_base_geography_inventory.py
      - src/energy_transition/pypsa_real_bus_zone_crosswalk.py
      - src/energy_transition/pypsa_real_laf_state_audit.py
permissions:
  contents: read
jobs:
  real-base-network:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout immutable upstream source and initialize
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/PyPSA/pypsa-usa.git /tmp/pypsa-usa
          git -C /tmp/pypsa-usa checkout 338af9912addbaf038c6098fe27e1e6ef099d8aa
          (cd /tmp/pypsa-usa && bash init_pypsa_usa.sh)
      - name: Install pinned upstream runtime
        run: |
          python -m pip install -e /tmp/pypsa-usa
          python -m pip install 'pulp==2.7.0'
      - name: Run actual base-network target and record logs
        id: build
        continue-on-error: true
        working-directory: /tmp/pypsa-usa/workflow
        run: |
          set -o pipefail
          snakemake -j1 resources/Default/western/elec_base_network.nc --configfile config/config.default.yaml 2>&1 | tee "$GITHUB_WORKSPACE/real-base-network-build.log"
      - name: Record actual network metadata only on successful build
        if: steps.build.outcome == 'success'
        working-directory: /tmp/pypsa-usa/workflow
        run: |
          python - <<'PY' > "$GITHUB_WORKSPACE/real-base-network-evidence.json"
          import json,hashlib,pathlib
          import pypsa
          p=pathlib.Path('resources/Default/western/elec_base_network.nc')
          if not p.is_file(): raise FileNotFoundError(str(p))
          n=pypsa.Network(str(p))
          with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          print(json.dumps({'path':str(p),'sha256':digest,'bytes':p.stat().st_size,
             'buses':len(n.buses),'lines':len(n.lines),'links':len(n.links),
             'snapshots':len(n.snapshots),'base_network_built':True,
             'full_electricity_model_built':False,'laf_verified':False},indent=2))
          PY
          cat "$GITHUB_WORKSPACE/real-base-network-evidence.json"
          size=$(stat -c %s resources/Default/western/elec_base_network.nc)
          if [ "$size" -le 200000000 ]; then
            cp resources/Default/western/elec_base_network.nc "$GITHUB_WORKSPACE/real-western-base-network.nc"
            echo "Base network included in downloadable CI artifact" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Base network exceeds 200 MB; metadata only, no full NetCDF artifact" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate real base topology endpoints and emit structural audit
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.pypsa_base_network_validate \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --out "$GITHUB_WORKSPACE/real-base-network-structure.json"
      - name: Inventory real network bus geography labels
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.pypsa_base_geography_inventory \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --out "$GITHUB_WORKSPACE/real-base-network-geography.json"
      - name: Export actual bus-to-state/ReEDS crosswalk
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.pypsa_real_bus_zone_crosswalk \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --csv "$GITHUB_WORKSPACE/real-western-bus-reeds-crosswalk.csv" \
            --report "$GITHUB_WORKSPACE/real-western-bus-reeds-crosswalk.json"
      - name: Audit actual upstream LAF_state embedded in network
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.pypsa_real_laf_state_audit \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --out "$GITHUB_WORKSPACE/real-western-laf-state.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-western-base-network-attempt
          path: |
            real-base-network-build.log
            real-base-network-evidence.json
            real-base-network-structure.json
            real-base-network-geography.json
            real-western-bus-reeds-crosswalk.csv
            real-western-bus-reeds-crosswalk.json
            real-western-laf-state.json
            real-western-base-network.nc
      - name: Report actual build failure
        if: steps.build.outcome != 'success'
        run: exit 1
