name: PyPSA-USA real Western base network build
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pypsa-usa-real-western-base-network.yml
      - src/energy_transition/pypsa_base_network_validate.py
      - src/energy_transition/pypsa_base_geography_inventory.py
      - src/energy_transition/pypsa_real_bus_zone_crosswalk.py
      - src/energy_transition/pypsa_real_laf_state_audit.py
      - src/energy_transition/efs_real_laf_zonal_pilot.py
      - src/energy_transition/efs_real_laf_hourly_conservation.py
      - src/energy_transition/efs_real_load_attachment_pilot.py
      - src/energy_transition/efs_real_load_roundtrip_validate.py
      - src/energy_transition/real_western_topology_connectivity.py
      - src/energy_transition/real_western_load_connectivity_gate.py
      - src/energy_transition/real_line_near_efs_load.py
permissions:
  contents: read
  actions: read
jobs:
  real-base-network:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout immutable upstream source and initialize
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/PyPSA/pypsa-usa.git /tmp/pypsa-usa
          git -C /tmp/pypsa-usa checkout 338af9912addbaf038c6098fe27e1e6ef099d8aa
          (cd /tmp/pypsa-usa && bash init_pypsa_usa.sh)
      - name: Install pinned upstream runtime
        run: |
          python -m pip install -e /tmp/pypsa-usa
          python -m pip install 'pulp==2.7.0'
      - name: Run actual base-network target and record logs
        id: build
        continue-on-error: true
        working-directory: /tmp/pypsa-usa/workflow
        run: |
          set -o pipefail
          snakemake -j1 resources/Default/western/elec_base_network.nc --configfile config/config.default.yaml 2>&1 | tee "$GITHUB_WORKSPACE/real-base-network-build.log"
      - name: Record actual network metadata only on successful build
        if: steps.build.outcome == 'success'
        working-directory: /tmp/pypsa-usa/workflow
        run: |
          python - <<'PY' > "$GITHUB_WORKSPACE/real-base-network-evidence.json"
          import json,hashlib,pathlib
          import pypsa
          p=pathlib.Path('resources/Default/western/elec_base_network.nc')
          if not p.is_file(): raise FileNotFoundError(str(p))
          n=pypsa.Network(str(p))
          with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          print(json.dumps({'path':str(p),'sha256':digest,'bytes':p.stat().st_size,
             'buses':len(n.buses),'lines':len(n.lines),'links':len(n.links),
             'snapshots':len(n.snapshots),'base_network_built':True,
             'full_electricity_model_built':False,'laf_verified':False},indent=2))
          PY
          cat "$GITHUB_WORKSPACE/real-base-network-evidence.json"
          size=$(stat -c %s resources/Default/western/elec_base_network.nc)
          if [ "$size" -le 200000000 ]; then
            cp resources/Default/western/elec_base_network.nc "$GITHUB_WORKSPACE/real-western-base-network.nc"
            echo "Base network included in downloadable CI artifact" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Base network exceeds 200 MB; metadata only, no full NetCDF artifact" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate real base topology endpoints and emit structural audit
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.pypsa_base_network_validate \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --out "$GITHUB_WORKSPACE/real-base-network-structure.json"
      - name: Inventory real network bus geography labels
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.pypsa_base_geography_inventory \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --out "$GITHUB_WORKSPACE/real-base-network-geography.json"
      - name: Export actual bus-to-state/ReEDS crosswalk
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.pypsa_real_bus_zone_crosswalk \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --csv "$GITHUB_WORKSPACE/real-western-bus-reeds-crosswalk.csv" \
            --report "$GITHUB_WORKSPACE/real-western-bus-reeds-crosswalk.json"
      - name: Audit actual upstream LAF_state embedded in network
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.pypsa_real_laf_state_audit \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --out "$GITHUB_WORKSPACE/real-western-laf-state.json"
      - name: Use independently verified real EFS hourly artifact for zonal LAF pilot
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41265678862 -R "${{ github.repository }}" -n pypsa-usa-efs-source-evidence -D /tmp/verified-efs
          test -s /tmp/verified-efs/outputs/efs-core-west-2030-2040-2050-hourly.csv.gz
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.efs_real_laf_zonal_pilot \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --efs /tmp/verified-efs/outputs/efs-core-west-2030-2040-2050-hourly.csv.gz \
            --out "$GITHUB_WORKSPACE/efs-real-laf-zonal-pilot.json"
      - name: Independently verify all EFS-to-LAF hourly energy mass
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.efs_real_laf_hourly_conservation \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --source /tmp/verified-efs/outputs/efs-core-west-2030-2040-2050-hourly.csv.gz \
            --zonal "$GITHUB_WORKSPACE/efs-real-laf-zonal-pilot.csv.gz" \
            --out "$GITHUB_WORKSPACE/efs-real-laf-hourly-conservation.json"
      - name: Attach and verify real EFS zonal loads for 2030, 2040 and 2050
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          for year in 2030 2040 2050; do
            PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.efs_real_load_attachment_pilot \
              --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
              --zonal "$GITHUB_WORKSPACE/efs-real-laf-zonal-pilot.csv.gz" \
              --year "$year" \
              --out "$GITHUB_WORKSPACE/efs-real-${year}-local-hour-load-only.nc"
            PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.efs_real_load_roundtrip_validate \
              --network "$GITHUB_WORKSPACE/efs-real-${year}-local-hour-load-only.nc" \
              --zonal "$GITHUB_WORKSPACE/efs-real-laf-zonal-pilot.csv.gz" \
              --year "$year" \
              --out "$GITHUB_WORKSPACE/efs-real-${year}-load-roundtrip-audit.json"
          done
      - name: Check actual Western network connected components
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.real_western_topology_connectivity \
            --network /tmp/pypsa-usa/workflow/resources/Default/western/elec_base_network.nc \
            --out "$GITHUB_WORKSPACE/real-western-topology-connectivity.json"
      - name: Check actual EFS loads outside primary connected grid
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          for year in 2030 2040 2050; do
            PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.real_western_load_connectivity_gate \
              --network "$GITHUB_WORKSPACE/efs-real-${year}-local-hour-load-only.nc" \
              --out "$GITHUB_WORKSPACE/efs-real-${year}-load-connectivity.json"
          done
      - name: Inspect actual rated AC lines adjacent to admitted EFS loads
        if: steps.build.outcome == 'success'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.real_line_near_efs_load \
            --network "$GITHUB_WORKSPACE/efs-real-2030-local-hour-load-only.nc" \
            --out "$GITHUB_WORKSPACE/real-rated-lines-near-efs-load.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-western-base-network-attempt
          path: |
            real-base-network-build.log
            real-base-network-evidence.json
            real-base-network-structure.json
            real-western-topology-connectivity.json
            real-rated-lines-near-efs-load.json
            efs-real-2030-load-connectivity.json
            efs-real-2040-load-connectivity.json
            efs-real-2050-load-connectivity.json
            real-base-network-geography.json
            real-western-bus-reeds-crosswalk.csv
            real-western-bus-reeds-crosswalk.json
            real-western-laf-state.json
            efs-real-laf-zonal-pilot.json
            efs-real-laf-zonal-pilot.csv.gz
            efs-real-laf-hourly-conservation.json
            efs-real-2030-local-hour-load-only.nc
            efs-real-2030-load-roundtrip-audit.json
            efs-real-2040-local-hour-load-only.nc
            efs-real-2040-load-roundtrip-audit.json
            efs-real-2050-local-hour-load-only.nc
            efs-real-2050-load-roundtrip-audit.json
            real-western-base-network.nc
      - name: Report actual build failure
        if: steps.build.outcome != 'success'
        run: exit 1
