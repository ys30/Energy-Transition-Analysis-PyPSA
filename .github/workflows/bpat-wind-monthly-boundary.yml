name: BPAT wind EIA923 EIA930 monthly source boundary audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bpat-wind-monthly-boundary.yml'
      - 'src/energy_transition/bpat_wind_monthly_boundary.py'
      - 'tests/test_bpat_wind_monthly_boundary.py'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_bpat_wind_monthly_boundary.py
      - uses: actions/download-artifact@v4
        with:
          name: eia923-ba-fuel-generation-2024
          run-id: 40937912804
          github-token: ${{ github.token }}
          path: inputs/eia923
      - uses: actions/download-artifact@v4
        with:
          name: eia930-hourly-solar-wind-2024
          run-id: 41003777337
          github-token: ${{ github.token }}
          path: inputs/eia930
      - run: |
          python -m energy_transition.bpat_wind_monthly_boundary \
            --eia923-monthly inputs/eia923/ba_fuel_monthly_observed.csv \
            --eia930-hourly inputs/eia930/renewable_hourly_observed.csv \
            --output outputs/bpat_wind_monthly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpat-wind-monthly-boundary-2024
          path: outputs/bpat_wind_monthly/
