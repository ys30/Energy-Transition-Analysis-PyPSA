name: Paper S archived 540-case marginal duration audit
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_marginal_duration.py'
      - 'tests/test_paper_s_marginal_duration.py'
      - '.github/workflows/paper-s-marginal-duration.yml'
permissions:
  contents: read
  actions: read
jobs:
  archive-derived-marginal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and regression tests
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_marginal_duration.py tests/test_paper_s_lp_objective_certification.py
      - name: Restore original accepted 540-case CSV, not rounded report values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source
          gh run download 42107237659 -R "${{ github.repository }}" \
            -n efs-cyclic-full-year-all-20-zones-validated -D /tmp/source
          test -s /tmp/source/all_20zone_cyclic_8760h_results.csv
      - name: Re-audit all LPs and derive exact nine marginal comparisons
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_marginal_duration \
            --cases /tmp/source/all_20zone_cyclic_8760h_results.csv \
            --out-csv outputs/paper_s_marginal_duration_all_shapes.csv \
            --out-json outputs/paper_s_marginal_duration_certificate.json
          python - <<'PY'
          import pandas as pd
          a=pd.read_csv('outputs/paper_s_marginal_duration_all_shapes.csv')
          assert len(a)==9
          assert set(a.planning_year)=={2030,2040,2050}
          assert a.synthetic_supply_shape.nunique()==3
          assert (a.zones==20).all()
          print("ARCHIVED_SOURCE_MARGINAL_DURATION_GATE_PASSED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-source-derived-marginal-duration
          path: outputs/
          if-no-files-found: error
