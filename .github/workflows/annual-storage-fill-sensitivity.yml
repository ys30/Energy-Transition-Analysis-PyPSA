name: Annual battery renewable-gap scenario optimization
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/annual-storage-fill-sensitivity.yml'
      - 'src/energy_transition/annual_storage_fill_sensitivity.py'
      - 'src/energy_transition/chronological_storage_pilot.py'
jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]'
      - uses: actions/download-artifact@v4
        with:
          name: eia930-west-2024
          run-id: 40935909190
          github-token: ${{ github.token }}
          path: inputs/demand
      - uses: actions/download-artifact@v4
        with:
          name: renewable-gap-sensitivity-2024
          run-id: 41079435449
          github-token: ${{ github.token }}
          path: inputs/scenarios
      - name: Solve 8784-hour annual storage scenarios and matched controls
        run: |
          python -m energy_transition.annual_storage_fill_sensitivity \
            --demand inputs/demand/eia930_demand_2024.csv \
            --scenarios inputs/scenarios/renewable_missing_scenarios.csv \
            --output outputs/annual_storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annual-storage-gap-sensitivity-2024
          path: outputs/annual_storage/
          retention-days: 60
