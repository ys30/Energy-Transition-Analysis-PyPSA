name: PyPSA-USA EFS source acquisition probe
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pypsa-usa-efs-source-probe.yml
permissions:
  contents: read
jobs:
  efs-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout pinned PyPSA-USA
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/PyPSA/pypsa-usa.git /tmp/pypsa-usa
          git -C /tmp/pypsa-usa checkout 338af9912addbaf038c6098fe27e1e6ef099d8aa
          (cd /tmp/pypsa-usa && bash init_pypsa_usa.sh)
      - name: Install pinned upstream environment
        run: |
          python -m pip install -e /tmp/pypsa-usa
          python -m pip install 'pulp==2.7.0'
      - name: Obtain real NREL EFS source only
        id: efs
        continue-on-error: true
        working-directory: /tmp/pypsa-usa/workflow
        run: |
          set -o pipefail
          snakemake -j1 data/nrel_efs/EFSLoadProfile_Reference_Moderate.csv --configfile config/config.default.yaml 2>&1 | tee "$GITHUB_WORKSPACE/efs-acquisition.log"
      - name: Inventory source files and checksums
        if: steps.efs.outcome == 'success'
        working-directory: /tmp/pypsa-usa/workflow
        run: |
          python - <<'PY' > "$GITHUB_WORKSPACE/efs-source-inventory.json"
          import json, pathlib, hashlib
          paths=list(pathlib.Path("data/nrel_efs").rglob("EFSLoadProfile_*.csv"))
          files=sorted({str(p):p for p in paths if p.is_file()}.values(), key=str)
          print(json.dumps({"files":[{"path":str(p),"bytes":p.stat().st_size,"sha256":hashlib.file_digest(p.open("rb"),"sha256").hexdigest()} for p in files],"network_built":False,"laf_derived":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pypsa-usa-efs-source-evidence
          path: |
            efs-acquisition.log
            efs-source-inventory.json
      - name: Enforce acquisition outcome
        if: steps.efs.outcome != 'success'
        run: exit 1
