name: EIA-930 2024 renewable missing-hour inventory
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia930-renewable-missing.yml'
      - 'src/energy_transition/eia930_renewable_missing_inventory.py'
      - 'tests/test_eia930_renewable_missing_inventory.py'
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_eia930_renewable_missing_inventory.py
      - uses: actions/download-artifact@v4
        with:
          name: eia930-hourly-solar-wind-2024
          run-id: 41003777337
          github-token: ${{ github.token }}
          path: inputs/renewables
      - run: |
          python -m energy_transition.eia930_renewable_missing_inventory \
            --input inputs/renewables/renewable_hourly_observed.csv \
            --output outputs/renewable_missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia930-renewable-missing-inventory-2024
          path: outputs/renewable_missing/
