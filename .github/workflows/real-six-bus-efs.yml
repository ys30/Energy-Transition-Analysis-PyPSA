name: Real Western six-bus constrained EFS pilot
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/real-six-bus-efs.yml
      - src/energy_transition/real_western_six_bus_dispatch.py
      - src/energy_transition/real_six_bus_multiyear_compare.py
permissions:
  contents: read
  actions: read
jobs:
  six-bus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyPSA with HiGHS
        run: python -m pip install 'pypsa==0.31.2' 'highspy>=1.7,<2'
      - name: Download verified real Western EFS load-bearing network
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41281576025 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/network
          for year in 2030 2040 2050; do
            test -s "/tmp/network/efs-real-${year}-local-hour-load-only.nc"
          done
      - name: Solve actual six-bus five-line subnetwork across planning years
        run: |
          set -euo pipefail
          for year in 2030 2040 2050; do
            PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.real_western_six_bus_dispatch \
              --network "/tmp/network/efs-real-${year}-local-hour-load-only.nc" \
              --out "outputs/real-six-bus-constrained-${year}-24h.json"
          done
      - name: Check cross-year comparability and export verified comparison CSV
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.real_six_bus_multiyear_compare \
            --input-dir outputs \
            --out outputs/verified-real-six-bus-2030-2050-comparison.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-six-bus-efs-constrained-solve
          path: |
            outputs/*.json
            outputs/*.csv
