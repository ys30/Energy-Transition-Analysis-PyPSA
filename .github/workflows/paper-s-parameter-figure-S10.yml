name: Paper S archived 294-LP Figure S10 parameter robustness
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_parameter_robustness_figures.py'
      - 'tests/test_paper_s_parameter_robustness_figures.py'
      - '.github/workflows/paper-s-parameter-figure-S10.yml'
permissions:
  contents: read
  actions: read
jobs:
  source-derived-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source identities and plotting
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_parameter_robustness_figures.py
      - name: Restore original-archive-verified full 294 LP output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/accepted
          gh run download 42672106407 -R "${{ github.repository }}" \
            -n paper-s-all-seven-shapes-294-lp-parameter-sensitivity -D /tmp/accepted
          test -s /tmp/accepted/paper_s_2030_147_parameter_comparisons.csv
      - name: Render Figure S10 from all 147 source-checked comparisons
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_parameter_robustness_figures \
            --comparisons /tmp/accepted/paper_s_2030_147_parameter_comparisons.csv \
            --out-dir outputs
          test -s outputs/Figure_S10_2030_parameter_robustness.png
          test -s outputs/Figure_S10_2030_parameter_robustness.svg
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-archive-certified-Figure-S10-294-LPs
          path: outputs/
          if-no-files-found: error
