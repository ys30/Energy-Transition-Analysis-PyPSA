name: Real AC line plus EFS load constrained 24h pilot
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/real-ac-efs-constrained-pilot.yml
      - src/energy_transition/real_ac_line_efs_constrained_pilot.py
permissions:
  contents: read
  actions: read
jobs:
  constrained-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyPSA + HiGHS
        run: python -m pip install 'pypsa==0.31.2' 'highspy>=1.7,<2'
      - name: Retrieve verified real 2030 EFS load network
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41281576025 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/network
          test -s /tmp/network/efs-real-2030-local-hour-load-only.nc
      - name: Solve constrained actual-line 24-hour experiment
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.real_ac_line_efs_constrained_pilot \
            --network /tmp/network/efs-real-2030-local-hour-load-only.nc \
            --hours 24 --out outputs/real-line-synthetic-generation-24h.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-ac-line-efs-synthetic-generation-experiment
          path: outputs/*.json
