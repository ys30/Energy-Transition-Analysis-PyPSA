name: EIA-930 observed BA interchange balance audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia930-balance-audit.yml'
      - 'src/energy_transition/eia930_balance_audit.py'
      - 'src/energy_transition/interchange_calibration_gate.py'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Download and audit 2024 observed BA generation demand and interchange
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          test -n "$EIA_API_KEY"
          python -m energy_transition.eia930_balance_audit --year 2024 --bas CISO BPAT --output outputs/eia930_balance
      - name: Evaluate BA interchange calibration eligibility
        run: |
          python -m energy_transition.interchange_calibration_gate \
            --summary outputs/eia930_balance/ba_balance_summary.csv \
            --monthly outputs/eia930_balance/monthly_balance_audit.csv \
            --output outputs/eia930_balance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia930-ba-interchange-balance-2024
          path: outputs/eia930_balance/
          retention-days: 30
