name: CI
'on':
  push:
  pull_request:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Install PyPSA for real network API integration
        run: python -m pip install 'pypsa>=0.35,<2'
      - name: Run full test suite with failure diagnostics
        run: python -m pytest -ra -vv --tb=long --maxfail=1 --junitxml=pytest-results.xml
      - name: Verify actual PyPSA Load time-series ingestion
        run: python -m pytest -ra -vv --tb=long tests/test_real_pypsa_network_ingest.py
      - name: Upload pytest diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest-results.xml
          if-no-files-found: warn
      - name: Validate historical EIA model module syntax
        run: python -m compileall -q src/energy_transition
      - run: python -m energy_transition --output outputs
      - name: Solve and archive synthetic three-zone dispatch evidence
        run: |
          python -m energy_transition.three_zone_dispatch_report --report outputs/three_zone_dispatch_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("outputs/three_zone_dispatch_report.json").read_text())
          assert report["solver_condition"] == "optimal"
          assert report["historically_calibrated"] is False
          assert len(report["snapshots"]) == 2
          assert all(max(abs(v) for v in s["nodal_residual_mw"].values()) < 1e-5
                     for s in report["snapshots"])
          print("Synthetic three-zone artifact verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-figures
          path: outputs/
