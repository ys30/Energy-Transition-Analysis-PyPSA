name: Paper S 2025 EIA county siting reweighted 2012 source CF and 24 LP
'on':
  pull_request:
    paths:
      - 'src/energy_transition/reeds2022_eia2025_spatial_reweighted_lp.py'
      - 'tests/test_reeds2022_eia2025_spatial_reweighted_lp.py'
      - '.github/workflows/paper-s-reeds2022-eia2025-siting-24-lp.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  eia2025-source-county-class-24-lp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source and LP validation packages
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11' 'h5py>=3.10' 'pytest>=8'
      - name: Unit tests for within-county source technology weighting and paired comparison
        run: PYTHONPATH=src python -m pytest -q tests/test_reeds2022_eia2025_spatial_reweighted_lp.py
      - name: Fetch official wind and PV ReEDS 2012 county-class original HDF5
        run: |
          set -e
          mkdir -p /tmp/reeds/county /tmp/reeds/wind /tmp/reeds/pv /tmp/reeds/fleet /tmp/reeds/base outputs
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 30 --max-time 3600 \
            'https://zenodo.org/records/18422200/files/cf_wind-ons_reference_county.h5?download=1' \
            -o /tmp/reeds/county/wind.h5
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 30 --max-time 3600 \
            'https://zenodo.org/records/18407660/files/cf_upv_reference_county.h5?download=1' \
            -o /tmp/reeds/county/pv.h5
          echo '0670813d0a18b688d698ca24cf67fb92  /tmp/reeds/county/wind.h5' | md5sum --check
          echo 'aba834ea4c592023bca47de2ba79e7ec  /tmp/reeds/county/pv.h5' | md5sum --check
      - name: Reuse independently authenticated ReEDS capacity and exact source state CFs
        run: |
          set -e
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 180 \
            'https://zenodo.org/records/18422200/files/sc_wind-ons_reference_county.csv?download=1' -o /tmp/reeds/county/wind_sc.csv
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 180 \
            'https://zenodo.org/records/18407660/files/sc_upv_reference_county.csv?download=1' -o /tmp/reeds/county/pv_sc.csv
          echo '49ab4e41dc386453b5fd32e5810774d4  /tmp/reeds/county/wind_sc.csv' | md5sum --check
          echo 'e10b1a64f3a67d163e739b735938eb78  /tmp/reeds/county/pv_sc.csv' | md5sum --check
          for tech in wind pv; do
            for n in 1 2 3; do
              gh run download 42962740548 --repo "${{ github.repository }}" \
                --name "paper-s-reeds2022-original-2012-county-${tech}-hdf5-source-audit" \
                --dir "/tmp/reeds/${tech}" && break
              if [ "${n}" -eq 3 ]; then exit 1; fi
              sleep 10
            done
          done
      - name: Retrieve exact EIA 2025 observed county weights and frozen AC LP
        run: |
          for n in 1 2 3; do
            gh run download 43124063185 --repo "${{ github.repository }}" \
              --name paper-s-eia860-2025-observed-fleet-versus-reeds-county-potential-weight-comparison \
              --dir /tmp/reeds/fleet && break
            if [ "${n}" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          for n in 1 2 3; do
            gh run download 43058074434 --repo "${{ github.repository }}" \
              --name paper-s-reeds2022-2030-common-ac-pv-ilr-180-original-source-lps \
              --dir /tmp/reeds/base && break
            if [ "${n}" -eq 3 ]; then exit 1; fi
            sleep 10
          done
      - name: Download authenticated original ReEDS2022 projected 2030 demand
        run: |
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 \
            'https://zenodo.org/records/18461543/files/demand_EFS_REFERENCE.h5?download=1' \
            -o /tmp/reeds/demand_EFS_REFERENCE.h5
          echo '7b2055d43200744a16a8c4fed68b1a17  /tmp/reeds/demand_EFS_REFERENCE.h5' | md5sum --check
      - name: Reweight 2012 original HDF5 by EIA2025 observed county geography and solve 24 LPs
        run: |
          PYTHONPATH=src OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m energy_transition.reeds2022_eia2025_spatial_reweighted_lp \
            --wind-h5 /tmp/reeds/county/wind.h5 \
            --pv-h5 /tmp/reeds/county/pv.h5 \
            --wind-sc /tmp/reeds/county/wind_sc.csv \
            --pv-sc /tmp/reeds/county/pv_sc.csv \
            --county-shares /tmp/reeds/fleet/paper_s_eia860_2025_vs_reeds_county_spatial_weights.csv \
            --wind-ref /tmp/reeds/wind/reeds2022_wind_2012_four_state_instantaneous_cf.csv \
            --pv-ref /tmp/reeds/pv/reeds2022_pv_2012_four_state_instantaneous_cf.csv \
            --demand-h5 /tmp/reeds/demand_EFS_REFERENCE.h5 \
            --base-180 /tmp/reeds/base/paper_s_reeds2022_2030_ac_normalized_180_LP.csv \
            --out outputs
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          o=Path('outputs')
          lp=pd.read_csv(o/'paper_s_2030_EIA2025_county_weight_vs_source_potential_24_LP.csv')
          p=pd.read_csv(o/'paper_s_2030_EIA2025_vs_potential_8_battery_pairs.csv')
          d=pd.read_csv(o/'paper_s_2030_EIA2025_vs_potential_4_state_storage_value_effects.csv')
          m=json.loads((o/'paper_s_EIA2025_siting_2012_weather_2030_demand_24_LP_manifest.json').read_text())
          assert len(lp)==24 and len(p)==8 and len(d)==4
          assert lp.solver_status.eq('optimal').all()
          assert m['frozen_12_original_AC_source_objectives_max_abs_error_usd']<.1
          assert all(x<5e-8 for x in m['wind_max_abs_reconstructed_potential_CF_error'].values())
          assert all(x<5e-8 for x in m['pv_max_abs_reconstructed_potential_CF_error'].values())
          assert m['2025_actual_generator_output_measured'] is False
          assert m['publisher_hourly_integrated_generation_certified'] is False
          print('PAPER_S_2025_EIA_SPATIAL_2012_REEDS_2030_DEMAND_24_LP_AND_RECONSTRUCTION_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-s-reeds2022-eia2025-county-siting-24-LP-comparison
          path: outputs/
          if-no-files-found: warn
