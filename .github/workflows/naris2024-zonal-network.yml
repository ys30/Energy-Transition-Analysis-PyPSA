name: NARIS source-backed zonal PyPSA network
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/energy_transition/naris2024_zonal_network.py
      - src/energy_transition/naris2024_network_roundtrip.py
      - .github/workflows/naris2024-zonal-network.yml
      - src/energy_transition/naris2024_network_acceptance.py
permissions:
  contents: read
jobs:
  build-network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' 'pypsa>=0.35,<2' netcdf4 pypsa netcdf4
      - name: Build source-backed zonal network and export NetCDF
        run: |
          python -m energy_transition.naris2024_zonal_network \
            --network outputs/naris2024_zonal_links.nc \
            --report outputs/naris2024_zonal_network_summary.json
      - name: Verify NetCDF round-trip against actual source capacities
        run: |
          python -m energy_transition.naris2024_network_roundtrip \
            --network outputs/naris2024_zonal_links.nc \
            --output outputs/naris2024_roundtrip_verification.json
      - name: Validate exported zonal bus/link topology
        run: |
          python -m energy_transition.naris2024_network_acceptance \
            --network outputs/naris2024_zonal_links.nc \
            --report outputs/naris2024_network_acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: naris2024-source-backed-zonal-pypsa-network
          path: |
            outputs/naris2024_zonal_links.nc
            outputs/naris2024_zonal_network_summary.json
            outputs/naris2024_network_acceptance.json
            outputs/naris2024_roundtrip_verification.json
