name: EIA-860 official plant BA mapping
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia860-plant-ba.yml'
      - 'src/energy_transition/eia860_capacity.py'
      - 'src/energy_transition/eia860_plant_ba.py'
      - 'src/energy_transition/ba_crosswalk.py'
      - 'src/energy_transition/eia860_generation_readiness.py'
      - 'src/energy_transition/eia860_western_network_coverage.py'
      - 'src/energy_transition/eia860_state_overlap_assert.py'
      - 'src/energy_transition/eia860_plant_coordinates.py'
      - 'src/energy_transition/eia860_plant_bus_candidates.py'
      - 'src/energy_transition/eia860_plant_bus_distance_qc.py'
      - 'src/energy_transition/eia860_plant_bus_topology_qc.py'
      - 'src/energy_transition/eia860_main_component_candidates.py'
      - 'src/energy_transition/eia860_candidate_change_audit.py'
      - 'src/energy_transition/eia860_changed_bus_distance_ties.py'
      - 'src/energy_transition/eia860_material_candidate_review.py'
      - 'src/energy_transition/eia860_material_candidate_evidence.py'
      - 'src/energy_transition/eia860_ba_fuel_geo_inventory.py'
permissions:
  contents: read
  actions: read
jobs:
  inventory-and-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        year: [2023, 2024]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Download and audit EIA-860 generator inventory
        run: python -m energy_transition.eia860_capacity --year ${{ matrix.year }} --output outputs/eia860
      - name: Extract reported plant BA and join operating generator capacities
        run: |
          python -m energy_transition.eia860_plant_ba \
            --year ${{ matrix.year }} \
            --generators outputs/eia860/western_state_generators_${{ matrix.year }}.csv \
            --output outputs/eia860
      - name: Audit verified operating EIA generator fleet for real PyPSA supply mapping
        run: |
          python -m energy_transition.eia860_generation_readiness \
            --audit outputs/eia860/generator_ba_audit_${{ matrix.year }}.csv \
            --year ${{ matrix.year }} \
            --out outputs/eia860/eia860_generation_readiness_${{ matrix.year }}.json
      - name: Download previously verified Western grid network
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41281576025 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/verified-western
          test -s /tmp/verified-western/real-western-base-network.nc
      - name: Install pinned PyPSA reader for actual network NetCDF
        run: python -m pip install 'pypsa==0.31.2'
      - name: Compare EIA fleet geography against actual Western bus states
        run: |
          python -m energy_transition.eia860_western_network_coverage \
            --generators outputs/eia860/generator_ba_audit_${{ matrix.year }}.csv \
            --network /tmp/verified-western/real-western-base-network.nc \
            --out outputs/eia860/eia860_western_network_coverage_${{ matrix.year }}.json
      - name: Enforce genuine generator-bus state coverage
        run: |
          python -m energy_transition.eia860_state_overlap_assert \
            --coverage-json outputs/eia860/eia860_western_network_coverage_${{ matrix.year }}.json \
            --out outputs/eia860/eia860_state_overlap_assert_${{ matrix.year }}.json
      - name: Extract official EIA plant coordinates for future verified network mapping
        run: |
          python -m energy_transition.eia860_plant_coordinates \
            --year ${{ matrix.year }} \
            --out-dir outputs/eia860
      - name: Generate same-state geographic plant-to-bus CANDIDATES
        run: |
          python -m energy_transition.eia860_plant_bus_candidates \
            --plants outputs/eia860/official_eia860_plant_coordinates_${{ matrix.year }}.csv \
            --network /tmp/verified-western/real-western-base-network.nc \
            --out outputs/eia860/eia860_geographic_plant_bus_candidates_${{ matrix.year }}.csv
      - name: Audit spatial candidate distances and export long-distance review list
        run: |
          python -m energy_transition.eia860_plant_bus_distance_qc \
            --candidates outputs/eia860/eia860_geographic_plant_bus_candidates_${{ matrix.year }}.csv \
            --year ${{ matrix.year }} \
            --out-dir outputs/eia860
      - name: Check real grid connectivity and ReEDS labels of plant-bus candidates
        run: |
          python -m energy_transition.eia860_plant_bus_topology_qc \
            --candidates outputs/eia860/eia860_geographic_plant_bus_candidates_${{ matrix.year }}.csv \
            --network /tmp/verified-western/real-western-base-network.nc \
            --year ${{ matrix.year }} --out-dir outputs/eia860
      - name: Screen main-connected-network geographic alternatives without assigning generators
        run: |
          python -m energy_transition.eia860_main_component_candidates \
            --plants outputs/eia860/official_eia860_plant_coordinates_${{ matrix.year }}.csv \
            --network /tmp/verified-western/real-western-base-network.nc \
            --out outputs/eia860/eia860_main_component_candidates_${{ matrix.year }}.csv
      - name: Compare plant candidate buses before and after primary-grid restriction
        run: |
          python -m energy_transition.eia860_candidate_change_audit \
            --original outputs/eia860/eia860_geographic_plant_bus_candidates_${{ matrix.year }}.csv \
            --main outputs/eia860/eia860_main_component_candidates_${{ matrix.year }}.csv \
            --out outputs/eia860/eia860_changed_candidate_buses_${{ matrix.year }}.csv
      - name: Resolve near-tied plant-bus candidate ID changes by distance thresholds
        run: |
          python -m energy_transition.eia860_changed_bus_distance_ties \
            --changed outputs/eia860/eia860_changed_candidate_buses_${{ matrix.year }}.csv \
            --out outputs/eia860/eia860_changed_bus_distance_ties_${{ matrix.year }}.json
      - name: Export exact plant IDs with material candidate bus changes
        run: |
          python -m energy_transition.eia860_material_candidate_review \
            --changed outputs/eia860/eia860_changed_candidate_buses_${{ matrix.year }}.csv \
            --year ${{ matrix.year }} \
            --out-dir outputs/eia860
      - name: Join materially shifted plant IDs to official BA and real bus ReEDS evidence
        run: |
          python -m energy_transition.eia860_material_candidate_evidence \
            --material outputs/eia860/eia860_material_bus_changes_${{ matrix.year }}.csv \
            --plant-ba outputs/eia860/plant_ba_raw_audit_${{ matrix.year }}.csv \
            --network /tmp/verified-western/real-western-base-network.nc \
            --year ${{ matrix.year }} \
            --out outputs/eia860/eia860_material_bus_change_evidence_${{ matrix.year }}.csv
      - name: Publish official BA-fuel generation resource inventory with plant-coordinate coverage
        run: |
          python -m energy_transition.eia860_ba_fuel_geo_inventory \
            --generators outputs/eia860/generator_ba_audit_${{ matrix.year }}.csv \
            --plants outputs/eia860/official_eia860_plant_coordinates_${{ matrix.year }}.csv \
            --year ${{ matrix.year }} \
            --out outputs/eia860/eia860_ba_fuel_geographic_inventory_${{ matrix.year }}.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia860-plant-ba-${{ matrix.year }}
          path: outputs/eia860/
          retention-days: 90
