name: Paper S near-optimal annual discharge throughput envelope
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/efs_cyclic_storage_lp.py'
      - 'src/energy_transition/paper_s_discharge_optimal_envelope.py'
      - 'tests/test_paper_s_discharge_optimal_envelope.py'
      - '.github/workflows/paper-s-discharge-envelope.yml'
permissions:
  contents: read
  actions: read
jobs:
  min-max-discharge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [1, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical tools and verify original LP compatibility
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_discharge_optimal_envelope.py tests/test_paper_s_soc_optimal_envelope.py tests/test_efs_cyclic_storage_lp.py
      - name: Restore archived EFS original hourly demand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/archived
          gh run download 42511072562 -R "${{ github.repository }}" \
            -n paper-s-2030-source-shape-${{ matrix.group }}-hourly -D /tmp/archived
          test -s /tmp/archived/representative_zone_hourly_lp.csv.gz
          test -s /tmp/archived/representative_zone_mechanism_metrics.csv
      - name: Bound annual discharge under original cost sublevel constraint
        run: |
          /usr/bin/time -v env PYTHONPATH=src OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 \
            python -m energy_transition.paper_s_discharge_optimal_envelope \
            --hourly /tmp/archived/representative_zone_hourly_lp.csv.gz \
            --original /tmp/archived/representative_zone_mechanism_metrics.csv \
            --group ${{ matrix.group }} --out-dir outputs
          test -s outputs/paper_s_discharge_envelope_12_solutions.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-cost-capped-discharge-group-${{ matrix.group }}
          path: outputs/
          if-no-files-found: error
  synthesize:
    needs: min-max-discharge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2,<3' 'numpy>=1.24,<3'
      - name: Download both tested source-group results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/results
          gh run download "${{ github.run_id }}" -R "${{ github.repository }}" \
            -p 'paper-s-cost-capped-discharge-group-*' -D /tmp/results
      - name: Validate eight discharge intervals and 24 original-source solutions
        run: |
          mkdir -p outputs
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          frames=[]
          for group in (1,7):
              folder=Path('/tmp/results')/f'paper-s-cost-capped-discharge-group-{group}'
              x=pd.read_csv(folder/'paper_s_discharge_envelope_12_solutions.csv')
              assert len(x)==12 and x.source_shape_group.eq(group).all()
              assert set(x.solution)=={'baseline','min','max'}
              frames.append(x)
          data=pd.concat(frames,ignore_index=True)
          assert len(data)==24
          keys=['source_shape_group','state','reeds_zone','synthetic_supply_shape','battery_power_peak_ratio','battery_energy_peak_hours']
          piv=data.pivot(index=keys,columns='solution',values='annual_discharge_mwh')
          assert len(piv)==8
          assert (piv['min']<=piv['baseline']+.02).all()
          assert (piv['baseline']<=piv['max']+.02).all()
          piv['width_mwh']=piv['max']-piv['min']
          piv.to_csv('outputs/paper_s_eight_cost_capped_discharge_intervals.csv')
          data.to_csv('outputs/paper_s_24_cost_capped_discharge_schedules.csv',index=False)
          print(piv.to_string())
          print('ORIGINAL_SOURCE_24_LP_EIGHT_DISCHARGE_INTERVALS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-eight-certified-cost-capped-discharge-intervals
          path: outputs/
          if-no-files-found: error
