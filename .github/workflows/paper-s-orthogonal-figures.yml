name: Paper S archive-derived orthogonal MW MWh Figures S11 S12
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_orthogonal_figures.py'
      - 'tests/test_paper_s_orthogonal_figures.py'
      - '.github/workflows/paper-s-orthogonal-figures.yml'
permissions:
  contents: read
  actions: read
jobs:
  source-verified-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source-verified plotting
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_orthogonal_figures.py
      - name: Restore accepted independent MW MWh factorial archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source
          gh run download 42674534963 -R "${{ github.repository }}" \
            -n paper-s-orthogonal-189-lp-252-contrasts -D /tmp/source
          test -s /tmp/source/paper_s_189_orthogonal_mw_mwh_lp.csv
          test -s /tmp/source/paper_s_252_orthogonal_single_axis_contrasts.csv
      - name: Reconcile every source LP contrast and render Figures S11 S12
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_orthogonal_figures \
            --cases /tmp/source/paper_s_189_orthogonal_mw_mwh_lp.csv \
            --contrasts /tmp/source/paper_s_252_orthogonal_single_axis_contrasts.csv \
            --out-dir outputs
          test -s outputs/Figure_S11_fixed_MW_increment_MWh.svg
          test -s outputs/Figure_S12_fixed_MWh_increment_MW.svg
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-source-verified-figures-S11-S12
          path: outputs/
          if-no-files-found: error
