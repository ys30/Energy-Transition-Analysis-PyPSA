name: Real EIA-860 capacity and EIA-930 BA dispatch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ba-real-dispatch.yml'
      - 'src/energy_transition/ba_historical_dispatch.py'
jobs:
  ba_dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]' openpyxl xlrd
      - name: Solve 2024 CAISO and BPAT model with EIA inputs
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          test -n "$EIA_API_KEY"
          python -m energy_transition.ba_historical_dispatch --year 2024 --bas CISO BPAT --output outputs/ba_dispatch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-ba-dispatch-2024
          path: outputs/ba_dispatch/
          retention-days: 30
