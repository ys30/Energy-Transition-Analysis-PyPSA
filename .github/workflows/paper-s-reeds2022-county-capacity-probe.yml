name: Paper S ReEDS2022 county renewable capacity schema probe
'on':
  pull_request:
    paths:
      - '.github/workflows/paper-s-reeds2022-county-capacity-probe.yml'
  push:
    branches: [paper-s-reeds2022-hourly-join-gates]
    paths:
      - '.github/workflows/paper-s-reeds2022-county-capacity-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-county-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CSV parser
        run: python -m pip install 'pandas>=2,<3'
      - name: Download small official county capacity tables
        run: |
          mkdir -p /tmp/source outputs
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 180 'https://zenodo.org/records/18422200/files/sc_wind-ons_reference_county.csv?download=1' -o /tmp/source/wind.csv
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 180 'https://zenodo.org/records/18407660/files/sc_upv_reference_county.csv?download=1' -o /tmp/source/pv.csv
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 180 'https://zenodo.org/records/18407660/files/county2zone.csv?download=1' -o /tmp/source/county2zone.csv
          echo '49ab4e41dc386453b5fd32e5810774d4  /tmp/source/wind.csv' | md5sum --check
          echo 'e10b1a64f3a67d163e739b735938eb78  /tmp/source/pv.csv' | md5sum --check
          echo 'f269adef29b6d96317a845f6129b5ad9  /tmp/source/county2zone.csv' | md5sum --check
      - name: Publish source-only schema and cardinality, no redistributed input rows
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          out={}
          for kind in ['wind','pv','county2zone']:
              p=Path('/tmp/source')/(kind+'.csv')
              d=pd.read_csv(p,dtype=str)
              out[kind]={'publisher_md5':hashlib.md5(p.read_bytes()).hexdigest(),
                'row_count':int(len(d)), 'columns':list(d.columns),
                'first_two_rows':d.head(2).fillna('').to_dict('records'),
                'null_counts':{k:int(v) for k,v in d.isna().sum().items()}}
          # Authenticate geographic source rows and derive available-resource MW.
          zones=pd.read_csv('/tmp/source/county2zone.csv',dtype=str)
          assert zones['FIPS'].str.fullmatch(r'\d{5}').all()
          assert not zones['FIPS'].duplicated().any()
          assert set(zones['state'].dropna()).issuperset({'AZ','CO','ID','WY'})
          state_by_fips=zones.set_index('FIPS')['state']
          state_audit={}
          for kind in ['wind','pv']:
              src=pd.read_csv('/tmp/source/'+kind+'.csv',dtype={'class|region':str})
              assert list(src.columns)==['class|region','MW']
              assert src['class|region'].str.fullmatch(r'[^|]+\|p\d{5}').all()
              assert not src['class|region'].duplicated().any()
              src['county_fips']=src['class|region'].str.rsplit('p',n=1).str[-1]
              src['state']=src['county_fips'].map(state_by_fips)
              missing=src.loc[src.state.isna(),'county_fips'].nunique()
              # No silent geographic fallback even for non-target source counties.
              assert missing==0, f'{kind}: unmapped county source FIPS count={missing}'
              mw=pd.to_numeric(src.MW,errors='raise')
              assert mw.notna().all() and (mw>=0).all()
              src['available_mw']=mw
              state_audit[kind]={
                  'source_rows':len(src),
                  'all_counties_mapped':True,
                  'source_unit':'available resource MW; not installed capacity',
                  'source_MW_AC_or_DC_basis':'UNVERIFIED',
                  'four_state':{
                      st:{
                          'resource_class_count':int(src.loc[src.state.eq(st),'class|region'].str.split('|',regex=False).str[0].nunique()),
                          'source_count':int(src.state.eq(st).sum()),
                          'available_mw':float(src.loc[src.state.eq(st),'available_mw'].sum()),
                      } for st in ['AZ','CO','ID','WY']
                  },
              }
          out['four_state_resource_capacity_audit']=state_audit
          Path('outputs/county_source_schema_probe.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-reeds2022-official-county-capacity-csv-schema
          path: outputs/
          if-no-files-found: error
