name: Paper S observed EIA930 pinned 160-hour BA diagnostics
'on':
  pull_request:
    paths:
      - 'src/energy_transition/paper_s_eia930_160h_ba_diagnostics.py'
      - 'tests/test_paper_s_eia930_160h_ba_diagnostics.py'
      - '.github/workflows/paper-s-eia930-160h-BA-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pinned-balance-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and unit test dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'pytest>=8'
      - name: Validate source integrity and fail-closed panel checks
        run: PYTHONPATH=src python -m pytest -q tests/test_paper_s_eia930_160h_ba_diagnostics.py
      - name: Recover verified original GitHub Actions observed EIA930 artifact
        run: |
          set -euo pipefail
          mkdir -p inputs outputs
          gh run download 43682969646 \
            --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-eia930-2023-july-first-week-observed-ba-wind-solar-mw \
            --dir inputs
          printf '%s  %s\n' \
            '0e72513a99c920391c0fc51a1691e84780ca5da81ba0c34b2fe218ed3fbc2f5a' \
            'inputs/paper_s_eia930_2023_07_01_to_07_07_ba_wind_solar_reported_mw.csv' | sha256sum -c -
      - name: Compute real 160-hour observed BA diagnostics
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_eia930_160h_ba_diagnostics \
            --source inputs/paper_s_eia930_2023_07_01_to_07_07_ba_wind_solar_reported_mw.csv \
            --out outputs
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('outputs')
          manifest=json.loads((root/'eia930_2023_july_160h_ba_mw_diagnostics_manifest.json').read_text())
          summary=pd.read_csv(root/'eia930_2023_july_160h_ba_mw_negative_sensitivity.csv')
          correlations=pd.read_csv(root/'eia930_2023_july_160h_cross_ba_rank_correlations.csv')
          assert manifest['rows']==1280
          assert manifest['negative_source_MW_hours']==87
          assert manifest['observed_vs_ReEDS_validation'] is False
          assert len(summary)==8 and len(correlations)==12
          assert set(correlations.paired_hour_count)=={160}
          print('PAPER_S_REAL_BA_160H_DESCRIPTIVE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-s-eia930-2023-160h-observed-BA-diagnostic-summary
          path: outputs/
          if-no-files-found: warn
