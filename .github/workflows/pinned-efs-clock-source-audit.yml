name: Verify pinned PyPSA-USA EFS source clock and Idaho timezone caveat
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pinned-efs-clock-source-audit.yml'
      - 'src/energy_transition/pinned_pypsa_usa_efs_clock_source_audit.py'
      - 'tests/test_pinned_pypsa_usa_efs_clock_source_audit.py'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests for source implementation admission gate
        run: PYTHONPATH=src python -m pip install pytest && PYTHONPATH=src python -m pytest -q tests/test_pinned_pypsa_usa_efs_clock_source_audit.py
      - name: Retrieve exact PyPSA-USA pinned source files without executing upstream
        run: |
          mkdir -p inputs outputs
          git clone --filter=blob:none --no-checkout https://github.com/PyPSA/pypsa-usa.git /tmp/pypsa-usa
          git -C /tmp/pypsa-usa checkout 338af9912addbaf038c6098fe27e1e6ef099d8aa
          cp /tmp/pypsa-usa/workflow/scripts/build_demand.py inputs/pinned_build_demand.py
          cp /tmp/pypsa-usa/workflow/scripts/constants.py inputs/pinned_constants.py
      - name: Audit actual fixed offsets, Idaho, 8760 wrap and source provenance status
        run: |
          PYTHONPATH=src python -m energy_transition.pinned_pypsa_usa_efs_clock_source_audit \
            --build inputs/pinned_build_demand.py --constants inputs/pinned_constants.py \
            --out outputs/pinned_efs_clock_source_admission.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/pinned_efs_clock_source_admission.json').read_text())
          assert r['upstream_single_timezone_assigned_to_Idaho']=='US/Mountain'
          assert r['upstream_explicitly_warns_multi_timezone_states_unhandled']
          assert r['fixed_standard_timezone_offsets_to_utc_hours']['US/Mountain']==7
          assert r['fixed_standard_timezone_offsets_to_utc_hours']['US/Pacific']==8
          assert r['upstream_builds_nonleap_template_using_2018']
          assert not r['upstream_code_is_official_EFS_2020_publisher_clock_definition']
          assert not r['EFS_UTC_join_authorized']
          print('PINNED_SOURCE_EFS_TIME_IMPLEMENTATION_VERIFIED; authoritative source clock still blocked')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-pypsa-usa-efs-timezone-source-evidence
          path: outputs/pinned_efs_clock_source_admission.json
          if-no-files-found: error
