name: Pinned PyPSA-USA Western build preflight
'on':
  push:
    branches: [main]
    paths:
      - src/energy_transition/pypsa_usa_build_preflight.py
      - tests/test_pypsa_usa_build_preflight.py
      - .github/workflows/pypsa-usa-pinned-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight Project B dependencies
        run: python -m pip install -e '.[dev]'
      - name: Fetch exact upstream PyPSA-USA code commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/PyPSA/pypsa-usa.git /tmp/pypsa-usa
          git -C /tmp/pypsa-usa checkout 338af9912addbaf038c6098fe27e1e6ef099d8aa
      - name: Initialize upstream configuration files
        run: bash /tmp/pypsa-usa/init_pypsa_usa.sh
        working-directory: /tmp/pypsa-usa
      - name: Validate exact revision and Western ReEDS scenario
        run: |
          python -m energy_transition.pypsa_usa_build_preflight \
            --checkout /tmp/pypsa-usa \
            --report outputs/pinned_pypsa_usa_preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-pypsa-usa-preflight
          path: outputs/pinned_pypsa_usa_preflight.json
