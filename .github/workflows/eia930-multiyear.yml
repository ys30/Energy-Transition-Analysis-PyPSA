name: Western US multi-year EIA-930 PyPSA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia930-multiyear.yml'
      - 'src/energy_transition/eia930_west.py'
      - 'src/energy_transition/multiyear_report.py'
  schedule:
    - cron: '0 9 1 2 *'
permissions:
  contents: read
jobs:
  yearly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PyPSA solver and package
        run: python -m pip install -e '.[model,dev]'
      - name: Validate secret
        run: |
          if [ -z "$EIA_API_KEY" ]; then
            echo "::error::EIA_API_KEY repository secret is missing"
            exit 1
          fi
      - name: Download, audit and solve one observed year
        shell: bash
        run: |
          mkdir -p outputs/eia930_west
          set +e
          python -m energy_transition.eia930_west --years ${{ matrix.year }} --output outputs/eia930_west > outputs/eia930_west/run.log 2>&1
          result=$?
          cat outputs/eia930_west/run.log
          YEAR=${{ matrix.year }} EXIT_CODE="$result" python - <<'PY'
          import json, os
          from pathlib import Path
          log = Path("outputs/eia930_west/run.log").read_text()
          errors = [line.strip() for line in log.splitlines()
                    if line.startswith(("ValueError:", "TypeError:", "RuntimeError:", "HTTPError:"))]
          Path("outputs/eia930_west/year_run_status.json").write_text(
              json.dumps({"year": int(os.environ["YEAR"]),
                          "exit_code": int(os.environ["EXIT_CODE"]),
                          "last_error": errors[-1][:1200] if errors else "",
                          "status": "success" if int(os.environ["EXIT_CODE"]) == 0 else "failed"}, indent=2))
          PY
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia930-west-${{ matrix.year }}
          path: outputs/eia930_west/
          retention-days: 30
  aggregate:
    if: always()
    needs: yearly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eia930-west-*
          path: yearly_artifacts
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and combine annual artifacts
        run: PYTHONPATH=src python -m energy_transition.multiyear_report --artifacts yearly_artifacts --output multi_year_summary --allow-partial
      - uses: actions/upload-artifact@v4
        with:
          name: eia930-west-multi-year-summary
          path: multi_year_summary/
          retention-days: 90
