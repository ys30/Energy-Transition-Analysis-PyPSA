name: Paper S certified annual discharge Figure S17
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_discharge_envelope_figures.py'
      - 'tests/test_paper_s_discharge_envelope_figures.py'
      - '.github/workflows/paper-s-discharge-envelope-figures.yml'
permissions:
  contents: read
  actions: read
jobs:
  figure-s17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependencies and test exact original-source intervals
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_discharge_envelope_figures.py
      - name: Restore accepted original 24 cost-capped discharge LP solutions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source
          gh run download 42747095388 -R "${{ github.repository }}" \
            -n paper-s-eight-certified-cost-capped-discharge-intervals -D /tmp/source
          test -s /tmp/source/paper_s_eight_cost_capped_discharge_intervals.csv
      - name: Reconcile intervals and render Figure S17
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_discharge_envelope_figures \
            --source /tmp/source/paper_s_eight_cost_capped_discharge_intervals.csv \
            --out-dir outputs
          test -s outputs/Figure_S17_discharge_envelope_relative_width.svg
          test -s outputs/Figure_S17_discharge_envelope_relative_width.png
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-verified-figure-S17-discharge-envelope
          path: outputs/
          if-no-files-found: error
