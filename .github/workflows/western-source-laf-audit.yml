name: Audit available Western network LAF source attributes
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/efs_existing_network_laf_audit.py'
      - 'src/energy_transition/efs_source_bus_laf_extraction.py'
      - 'src/energy_transition/efs_missing_laf_bus_roles.py'
      - 'src/energy_transition/efs_laf_normalization_key_audit.py'
      - 'src/energy_transition/efs_four_state_laf_source_weight_diagnostic.py'
      - 'tests/test_efs_four_state_laf_source_weight_diagnostic.py'
      - 'src/energy_transition/efs_pinned_pd_laf_denominator_audit.py'
      - 'tests/test_efs_pinned_pd_laf_denominator_audit.py'
      - 'src/energy_transition/efs_null_laf_offshore_origin_audit.py'
      - 'tests/test_efs_null_laf_offshore_origin_audit.py'
      - 'src/energy_transition/efs_two_cross_denominator_bus_geography.py'
      - 'tests/test_efs_two_cross_denominator_bus_geography.py'
      - 'src/energy_transition/efs_four_state_denominator_candidate.py'
      - 'tests/test_efs_four_state_denominator_candidate.py'
      - '.github/workflows/western-source-laf-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyPSA network reader
        run: python -m pip install -e '.[model]' netcdf4
      - name: Recover previously built Western source network
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/western
          gh run download 41531397166 -R "${{ github.repository }}" \
            -n real-western-base-network-attempt -D /tmp/western
          test -s /tmp/western/real-western-base-network.nc
      - name: Audit whether original source bus LAFs exist
        run: |
          python -m energy_transition.efs_existing_network_laf_audit \
            --network /tmp/western/real-western-base-network.nc \
            --report outputs/western_existing_network_laf_evidence.json
      - name: Diagnose component roles of missing LAF buses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pypsa
          from energy_transition.efs_missing_laf_bus_roles import classify_missing_laf_buses
          network=pypsa.Network('/tmp/western/real-western-base-network.nc')
          report=classify_missing_laf_buses(network)
          out=Path('outputs/western_missing_laf_bus_roles.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2)+'\n')
          summary={k:v for k,v in report.items() if k!='classification_by_bus'}
          print(json.dumps(summary,indent=2))
          assert report['missing_laf_can_be_assumed_zero'] is False
          assert report['empirical_laf_admitted'] is False
          PY
      - name: Audit full-state LAF normalization versus ReEDS state assignment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pypsa
          from energy_transition.efs_laf_normalization_key_audit import audit_laf_key_semantics
          network=pypsa.Network('/tmp/western/real-western-base-network.nc')
          report=audit_laf_key_semantics(network.buses)
          out=Path('outputs/western_laf_normalization_key_audit.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items()
                if k not in ('observed_laf_by_reeds_state','state_reeds_state_mismatch_examples')},indent=2))
          print(json.dumps(report['state_reeds_state_mismatch_examples'],indent=2))
          print(json.dumps(report['cross_state_observed_laf_mass'],indent=2))
          print(json.dumps(report['observed_laf_by_native_state'],indent=2))
          print(json.dumps(report['target_reeds_state_laf_decomposition'],indent=2))
          assert report['historical_demand_admitted'] is False
          assert report['renormalization_performed'] is False
          PY
      - name: Diagnose four excluded states from source load weights
        run: |
          python -m energy_transition.efs_four_state_laf_source_weight_diagnostic \
            --network /tmp/western/real-western-base-network.nc \
            --out outputs/western_four_state_laf_source_weight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/western_four_state_laf_source_weight.json').read_text())
          assert r['source_states_audited']==['California','Nevada','Oregon','Washington']
          assert r['missing_laf_can_be_imputed'] is False
          assert r['all_four_states_empirically_admitted'] is False
          PY
      - name: Retrieve exact pinned source LAF generation algorithm
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/PyPSA/pypsa-usa/338af9912addbaf038c6098fe27e1e6ef099d8aa/workflow/scripts/build_base_network.py \
            -o /tmp/western/pinned_build_base_network.py
          test -s /tmp/western/pinned_build_base_network.py
      - name: Audit actual Pd-derived LAF denominators and source code
        run: |
          python -m energy_transition.efs_pinned_pd_laf_denominator_audit \
            --network /tmp/western/real-western-base-network.nc \
            --upstream-source /tmp/western/pinned_build_base_network.py \
            --out outputs/western_pinned_pd_laf_denominator.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/western_pinned_pd_laf_denominator.json').read_text())
          assert r['pinned_source_formula_verified']
          assert r['original_LAF_numerator']=='Pd'
          assert r['missing_LAF_imputed'] is False
          assert r['western_EFS_demand_admitted'] is False
          PY
      - name: Classify all null-LAF buses against upstream offshore insertion signature
        run: |
          python -m energy_transition.efs_null_laf_offshore_origin_audit \
            --network /tmp/western/real-western-base-network.nc \
            --upstream-source /tmp/western/pinned_build_base_network.py \
            --out outputs/western_null_laf_offshore_origin.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/western_null_laf_offshore_origin.json').read_text())
          assert r['upstream_LAF_assigned_before_offshore_addition'] is True
          assert r['null_laf_bus_count']==157, 'Pinned archived Western network changed; re-review source'
          assert r['all_null_laf_buses_match_pinned_offshore_insertion_signature'] is True
          assert r['null_laf_offshore_both_indicators']==r['null_laf_bus_count']
          assert r['missing_laf_values_zero_imputed'] is False
          assert r['four_state_EFS_load_admitted'] is False
          PY
      - name: Inventory two cross-denominator bus identities and geography
        run: |
          python -m energy_transition.efs_two_cross_denominator_bus_geography \
            --network /tmp/western/real-western-base-network.nc \
            --out outputs/western_two_cross_denominator_bus_geography.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/western_two_cross_denominator_bus_geography.json').read_text())
          assert r['target_bus_count']==2
          assert r['source_full_state_recovered'] is False
          assert r['empirical_EFS_admitted'] is False
          PY
      - name: Build four-state denominator-aligned candidate without source edits
        run: |
          python -m energy_transition.efs_four_state_denominator_candidate \
            --network /tmp/western/real-western-base-network.nc \
            --out outputs/western_four_state_denominator_candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/western_four_state_denominator_candidate.json').read_text())
          assert d['candidate_only'] is True
          assert d['offshore_auxiliaries_excluded_count']==157
          assert d['offshore_auxiliaries_LAF_modified'] is False
          assert len(d['source_state_weight_totals'])==4
          assert d['source_geography_independently_validated'] is False
          assert d['EFS_demand_admitted'] is False
          PY
      - name: Verify audit never equates field presence with empirically admitted loads
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("outputs/western_existing_network_laf_evidence.json").read_text())
          assert a["bus_count"]>0
          assert a["empirical_load_admitted"] is False
          assert a["candidate_weights_verified_source"] is False
          assert a["network_physical_calibration_verified"] is False
          print("Existing network LAF audit complete; empirical load admission remains blocked")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: western-existing-network-laf-evidence
          path: |
            outputs/western_existing_network_laf_evidence.json
            outputs/western_missing_laf_bus_roles.json
            outputs/western_laf_normalization_key_audit.json
            outputs/western_four_state_laf_source_weight.json
            outputs/western_pinned_pd_laf_denominator.json
            outputs/western_null_laf_offshore_origin.json
            outputs/western_two_cross_denominator_bus_geography.json
            outputs/western_four_state_denominator_candidate.json
          if-no-files-found: warn
