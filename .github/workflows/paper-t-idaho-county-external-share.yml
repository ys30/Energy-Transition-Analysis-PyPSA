name: Paper T Idaho county-level external share audit
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-t-idaho-county-external-share.yml'
      - 'src/energy_transition/paper_t_idaho_county_share_audit.py'
permissions:
  contents: read
jobs:
  county-share:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HDF and numeric stack
        run: python -m pip install "pandas>=2.0,<3" "tables>=3.9" "h5py>=3.10" "numpy>=1.26"
      - name: Run source-hashed, fail-closed Idaho seven-county shares
        run: python src/energy_transition/paper_t_idaho_county_share_audit.py --output results/paper_t/idaho_county_shares_2016_2023.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-t-idaho-2016-2023-county-share-evidence
          path: results/paper_t/idaho_county_shares_2016_2023.json
          retention-days: 90
