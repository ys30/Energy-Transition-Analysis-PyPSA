name: Four-season chronological storage sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/seasonal-storage-sensitivity.yml'
      - 'src/energy_transition/seasonal_storage_sensitivity.py'
      - 'tests/test_seasonal_storage_sensitivity.py'
jobs:
  seasonal:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]'
      - run: python -m pytest -q tests/test_seasonal_storage_sensitivity.py tests/test_storage_duration_sensitivity.py
      - uses: actions/download-artifact@v4
        with:
          name: eia930-west-2024
          run-id: 40935909190
          github-token: ${{ github.token }}
          path: inputs/eia930_2024
      - name: Solve four seasonal weeks with four battery durations each
        run: |
          python -m energy_transition.seasonal_storage_sensitivity \
            --hourly inputs/eia930_2024/eia930_demand_2024.csv \
            --output outputs/seasonal_storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seasonal-storage-sensitivity-2024
          path: outputs/seasonal_storage/
          retention-days: 60
