name: Observed wind solar and storage seasonal comparison
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/observed-renewable-storage.yml'
      - 'src/energy_transition/observed_renewable_storage.py'
      - 'src/energy_transition/chronological_storage_pilot.py'
      - 'tests/test_observed_renewable_storage.py'
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]'
      - run: python -m pytest -q tests/test_observed_renewable_storage.py tests/test_chronological_storage_pilot.py
      - uses: actions/download-artifact@v4
        with:
          name: eia930-west-2024
          run-id: 40935909190
          github-token: ${{ github.token }}
          path: inputs/demand
      - uses: actions/download-artifact@v4
        with:
          name: eia930-hourly-solar-wind-2024
          run-id: 41003777337
          github-token: ${{ github.token }}
          path: inputs/renewables
      - name: Independently solve seasonal observed-generation and illustrative-supply controls
        run: |
          python -m energy_transition.observed_renewable_storage \
            --demand inputs/demand/eia930_demand_2024.csv \
            --renewables inputs/renewables/seasonal_observed_renewables.csv \
            --output outputs/observed_renewable_storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observed-renewable-storage-comparison-2024
          path: outputs/observed_renewable_storage/
          retention-days: 60
