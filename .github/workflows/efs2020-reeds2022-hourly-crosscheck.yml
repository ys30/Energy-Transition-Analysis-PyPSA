name: Compare original EFS2020 to independent ReEDS2022 all 289080 hourly values
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/efs2020-reeds2022-hourly-crosscheck.yml'
      - 'src/energy_transition/efs2020_reeds2022_hourly_crosscheck.py'
      - 'tests/test_efs2020_reeds2022_hourly_crosscheck.py'
permissions:
  contents: read
  actions: read
jobs:
  cross-source-hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and HDF5 parsing runtime
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'h5py>=3.10' 'pytest>=8'
      - name: Test identical annual sums versus shifted or altered hourly values
        run: PYTHONPATH=src python -m pytest -q tests/test_efs2020_reeds2022_hourly_crosscheck.py
      - name: Retrieve original EFS2020 state-hour evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/efs2020 /tmp/reeds2022 outputs
          gh run download 41262154939 -R "${{ github.repository }}" \
            -n pypsa-usa-efs-source-evidence -D /tmp/efs2020
          test -s /tmp/efs2020/outputs/efs-core-west-2030-2040-2050-hourly.csv.gz
      - name: Download and checksum independent original official ReEDS2022 HDF5
        run: |
          curl -fLsS --retry 3 --connect-timeout 25 --max-time 300 \
            'https://zenodo.org/records/18461543/files/demand_EFS_REFERENCE.h5?download=1' \
            -o /tmp/reeds2022/demand_EFS_REFERENCE.h5
          echo '7b2055d43200744a16a8c4fed68b1a17  /tmp/reeds2022/demand_EFS_REFERENCE.h5' | md5sum --check
      - name: Compare all 33 state-year hourly values; inspect true 0 and +/-12 shifts
        run: |
          PYTHONPATH=src python -m energy_transition.efs2020_reeds2022_hourly_crosscheck \
            --efs-hourly /tmp/efs2020/outputs/efs-core-west-2030-2040-2050-hourly.csv.gz \
            --reeds-h5 /tmp/reeds2022/demand_EFS_REFERENCE.h5 \
            --out-csv outputs/efs2020_vs_reeds2022_hourly_33_state_year_comparison.csv \
            --out-json outputs/efs2020_vs_reeds2022_comparison_provenance.json
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          t=pd.read_csv("outputs/efs2020_vs_reeds2022_hourly_33_state_year_comparison.csv")
          m=json.loads(Path("outputs/efs2020_vs_reeds2022_comparison_provenance.json").read_text())
          assert len(t)==33
          assert t[["planning_year","state"]].drop_duplicates().shape[0]==33
          assert m["total_direct_hour_pairs_compared"]==289080
          assert m["publisher_reeds2022_md5_verified"] is True
          assert m["original_efs2020_source_time_convention_authoritatively_certified"] is False
          assert m["future_weather_year_resource_availability_join_approved"] is False
          print("ORIGINAL_TWO_SOURCE_FULL_HOUR_AUDIT_SUCCESS: numeric equality or mismatch recorded, without assuming an EFS UTC clock")
          print(f"MATCHED_FULL_8760_STATE_YEARS={m['state_year_pairs_direct_all_hour_match']}/33")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-efs2020-vs-reeds2022-33-state-year-hourly-equivalence
          path: |
            outputs/efs2020_vs_reeds2022_hourly_33_state_year_comparison.csv
            outputs/efs2020_vs_reeds2022_comparison_provenance.json
          if-no-files-found: error
