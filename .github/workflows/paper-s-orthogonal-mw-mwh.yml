name: Paper S independent MW MWh factorial archived-source audit
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/efs_cyclic_storage_lp.py'
      - 'src/energy_transition/paper_s_orthogonal_power_energy.py'
      - 'tests/test_paper_s_orthogonal_power_energy.py'
      - '.github/workflows/paper-s-orthogonal-mw-mwh.yml'
permissions:
  contents: read
  actions: read
jobs:
  orthogonal-seven-chronologies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate independent power and energy semantics
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_orthogonal_power_energy.py tests/test_efs_cyclic_storage_lp.py
      - name: Run seven fixed original-hour load shapes and reconcile historical LPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for group in 1 2 3 4 5 6 7; do
            mkdir -p "/tmp/group-${group}" "outputs/group-${group}"
            gh run download 42511072562 -R "${{ github.repository }}" \
              -n "paper-s-2030-source-shape-${group}-hourly" -D "/tmp/group-${group}"
            test -s "/tmp/group-${group}/representative_zone_hourly_lp.csv.gz"
            test -s "/tmp/group-${group}/representative_zone_mechanism_metrics.csv"
            /usr/bin/time -v env PYTHONPATH=src OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 \
              python -m energy_transition.paper_s_orthogonal_power_energy \
              --original-hourly "/tmp/group-${group}/representative_zone_hourly_lp.csv.gz" \
              --original-metrics "/tmp/group-${group}/representative_zone_mechanism_metrics.csv" \
              --out-dir "outputs/group-${group}"
            echo "ORIGINAL_SOURCE_ORTHOGONAL_GROUP_${group}_PASS"
          done
      - name: Verify 189 LPs and 252 controlled contrasts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          a=[];b=[]
          for group in range(1,8):
              folder=Path('outputs')/f'group-{group}'
              m=json.loads((folder/'mw_mwh_manifest.json').read_text())
              assert m['lp_cases']==27 and m['single_axis_contrasts']==36
              assert m['historical_baseline_comparisons_reproduced']==6
              f=pd.read_csv(folder/'mw_mwh_27_lp.csv')
              g=pd.read_csv(folder/'mw_mwh_36_one_axis_contrasts.csv')
              f.insert(0,'source_shape_group',group)
              g.insert(0,'source_shape_group',group)
              a.append(f);b.append(g)
          cases=pd.concat(a,ignore_index=True)
          contrasts=pd.concat(b,ignore_index=True)
          assert len(cases)==189 and len(contrasts)==252
          assert cases[['source_shape_group','state','reeds_zone']].drop_duplicates().shape[0]==7
          assert not cases.duplicated(['source_shape_group','synthetic_supply_shape',
                                      'battery_power_peak_ratio','battery_energy_peak_hours']).any()
          cases.to_csv('outputs/paper_s_189_orthogonal_mw_mwh_lp.csv',index=False)
          contrasts.to_csv('outputs/paper_s_252_orthogonal_single_axis_contrasts.csv',index=False)
          count=(contrasts.assign(positive=contrasts.added_discharge_mwh>1e-3)
                  .groupby(['axis','held_constant','from_level','to_level','synthetic_supply_shape'])
                  .positive.sum().reset_index(name='positive_groups_of_7'))
          count.to_csv('outputs/paper_s_orthogonal_positive_response_counts.csv',index=False)
          print(count.to_string(index=False))
          print('SEVEN_SOURCE_SHAPES_189_LP_252_CONTRASTS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-orthogonal-189-lp-252-contrasts
          path: |
            outputs/paper_s_189_orthogonal_mw_mwh_lp.csv
            outputs/paper_s_252_orthogonal_single_axis_contrasts.csv
            outputs/paper_s_orthogonal_positive_response_counts.csv
          if-no-files-found: error
