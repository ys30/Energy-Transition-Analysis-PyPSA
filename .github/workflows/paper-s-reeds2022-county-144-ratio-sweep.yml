name: Paper S ReEDS2022 county renewable ratio 144 LP sensitivity
'on':
  pull_request:
    paths:
      - 'src/energy_transition/reeds2022_county_renewable_ratio_sweep.py'
      - 'tests/test_reeds2022_county_renewable_ratio_sweep.py'
      - '.github/workflows/paper-s-reeds2022-county-144-ratio-sweep.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  solve-144-source-LPs:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solver and source audit dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11' 'h5py>=3.10' 'pytest>=8'
      - name: Test scenario contract and paired metrics
        run: PYTHONPATH=src python -m pytest -q tests/test_reeds2022_county_renewable_ratio_sweep.py
      - name: Retrieve unchanged MD5-authenticated state wind and PV source outputs
        run: |
          mkdir -p /tmp/reeds/wind /tmp/reeds/pv outputs
          gh run download 42962740548 --repo "${{ github.repository }}" \
            --name paper-s-reeds2022-original-2012-county-wind-hdf5-source-audit --dir /tmp/reeds/wind
          gh run download 42962740548 --repo "${{ github.repository }}" \
            --name paper-s-reeds2022-original-2012-county-pv-hdf5-source-audit --dir /tmp/reeds/pv
      - name: Retrieve canonical 0.9x baseline for numerical regression check
        run: |
          mkdir -p /tmp/reeds/baseline
          gh run download 42965036275 --repo "${{ github.repository }}" \
            --name paper-s-reeds2022-county-native-48-LP-real-source-hypothetical-capacity \
            --dir /tmp/reeds/baseline
      - name: Authenticate original 2022 demand
        run: |
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 900 \
            'https://zenodo.org/records/18461543/files/demand_EFS_REFERENCE.h5?download=1' \
            -o /tmp/reeds/demand_EFS_REFERENCE.h5
          echo '7b2055d43200744a16a8c4fed68b1a17  /tmp/reeds/demand_EFS_REFERENCE.h5' | md5sum --check
      - name: Solve 144 source-weather hypothetical MW LPs
        run: |
          PYTHONPATH=src python -m energy_transition.reeds2022_county_renewable_ratio_sweep \
            --demand-h5 /tmp/reeds/demand_EFS_REFERENCE.h5 \
            --wind-csv /tmp/reeds/wind/reeds2022_wind_2012_four_state_instantaneous_cf.csv \
            --pv-csv /tmp/reeds/pv/reeds2022_pv_2012_four_state_instantaneous_cf.csv \
            --out outputs
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,json
          a=pd.read_csv('outputs/paper_s_reeds2022_county_native_144_ratio_LP.csv')
          b=pd.read_csv('outputs/paper_s_reeds2022_county_native_72_ratio_paired.csv')
          m=json.loads(Path('outputs/paper_s_reeds2022_county_native_ratio_sweep_manifest.json').read_text())
          assert len(a)==144 and len(b)==72 and m['LP_count']==144
          assert set(a.renewable_peak_ratio.round(6))=={0.9,1.5,2.0}
          assert a.solver_status.eq('optimal').all()
          baseline=pd.read_csv('/tmp/reeds/baseline/paper_s_reeds2022_county_full_state_2012_weather_48_LP.csv')
          scope=['state','demand_model_year','hour_approximation','battery_duration_h']
          previous=baseline.set_index(scope)['objective_illustrative_variable_usd'].sort_index()
          current=a.loc[a.renewable_peak_ratio.round(6).eq(.9)].set_index(scope)['objective_illustrative_variable_usd'].sort_index()
          assert len(current)==len(previous)==48
          assert current.index.equals(previous.index)
          assert (current-previous).abs().max() <= 0.05, '0.9x cannot reproduce frozen source LP'
          assert not m['storage_capex_included'] and not m['real_network_or_reliability_estimate']
          print('REEDS2022_COUNTY_144_LP_AND_72_PAIRS_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-s-reeds2022-county-144-ratio-sweep-original-source-2012
          path: outputs/
          if-no-files-found: warn
