name: BPAT unlisted wind generator EIA930A cross schedule
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bpat-wind-cross-schedule.yml'
      - 'src/energy_transition/bpat_wind_cross_schedule.py'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' openpyxl
      - uses: actions/download-artifact@v4
        with:
          name: bpat-wind-generator-930a-2024
          run-id: 41090215668
          github-token: ${{ github.token }}
          path: inputs/generators
      - run: |
          python -m energy_transition.bpat_wind_cross_schedule \
            --generators inputs/generators/bpat_wind_generator_membership_2024.csv \
            --output outputs/cross_schedule
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpat-wind-cross-schedule-2024
          path: outputs/cross_schedule/
