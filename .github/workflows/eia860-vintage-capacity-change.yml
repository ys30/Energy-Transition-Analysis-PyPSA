name: EIA-860 official 2023-2024 capacity changes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia860-vintage-capacity-change.yml'
      - 'src/energy_transition/eia860_vintage_capacity_change.py'
permissions:
  contents: read
  actions: read
jobs:
  compare-official-vintages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - name: Retrieve verified 2023/2024 EIA-860 inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41349585538 -R "${{ github.repository }}" -n eia860-plant-ba-2023 -D /tmp/eia2023
          gh run download 41349585538 -R "${{ github.repository }}" -n eia860-plant-ba-2024 -D /tmp/eia2024
          test -s /tmp/eia2023/eia860_ba_fuel_geographic_inventory_2023.csv
          test -s /tmp/eia2024/eia860_ba_fuel_geographic_inventory_2024.csv
      - name: Compare actual BA-fuel nameplate vintages and reconcile totals
        run: |
          PYTHONPATH=src python -m energy_transition.eia860_vintage_capacity_change \
            --year-2023 /tmp/eia2023/eia860_ba_fuel_geographic_inventory_2023.csv \
            --year-2024 /tmp/eia2024/eia860_ba_fuel_geographic_inventory_2024.csv \
            --out outputs/eia860/eia860_ba_fuel_capacity_change_2023_2024.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-eia860-ba-fuel-capacity-change-2023-2024
          path: outputs/eia860/
