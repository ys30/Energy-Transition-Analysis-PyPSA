name: Project B five-minute engineering monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check latest CI and chronological EIA-930 pilot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GH_REPOSITORY"]
          url=f"https://api.github.com/repos/{repo}/actions/runs?per_page=100"
          req=urllib.request.Request(url,headers={
            "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
            "Accept":"application/vnd.github+json",
            "User-Agent":"project-b-engineering-monitor",
          })
          with urllib.request.urlopen(req,timeout=30) as response:
            runs=json.load(response)["workflow_runs"]
          targets=["CI","EIA-930 full-year hourly dispatch pilot",
                   "EIA-930 observed BA interchange balance audit"]
          failed=[]
          for target in targets:
            matches=[r for r in runs if r["name"]==target and r["event"]!="schedule"]
            if not matches:
              print(f"::warning::{target}: no recent runs")
              continue
            latest=matches[0]
            status=latest["status"]
            conclusion=latest["conclusion"]
            print(f"{target}: {status}/{conclusion}, {latest['html_url']}")
            if status=="completed" and conclusion not in ("success","neutral","skipped"):
              failed.append(f"{target}: {latest['html_url']} ({conclusion})")
          if failed:
            for detail in failed:
              print(f"::error::{detail}")
            raise SystemExit("Latest engineering run failed; investigate logs and fix before claiming completion")
          print("Monitoring pass only: it does not certify historical calibration or 100% engineering completion.")
          PY
