name: Paper S proposed main Figure 1 original-source provenance schematic
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_main_figure_1.py'
      - 'tests/test_paper_s_main_figure_1.py'
      - '.github/workflows/paper-s-main-figure-1.yml'
permissions:
  contents: read
jobs:
  provenance-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test archived source counts, model scope, and render
        run: |
          python -m pip install 'matplotlib>=3.7,<4' 'numpy>=1.24,<3' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_main_figure_1.py
      - name: Render evidence-locked source-provenance schematic
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_main_figure_1 --out-dir outputs
          test -s outputs/Paper_S_proposed_main_Figure_1_source_workflow.png
          test -s outputs/Paper_S_proposed_main_Figure_1_source_workflow.svg
          test -s outputs/Paper_S_Figure_1_source_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-proposed-main-figure-1-provenance-and-design
          path: outputs/
          if-no-files-found: error
