name: Paper S Figure S19 original-cost tolerance source certificate
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_window_tolerance_figures.py'
      - 'tests/test_paper_s_window_tolerance_figures.py'
      - '.github/workflows/paper-s-window-tolerance-figures.yml'
permissions:
  contents: read
  actions: read
jobs:
  figure-s19:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test original interval data identity and plotting
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_window_tolerance_figures.py
      - name: Restore previously certified six source-window envelopes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source
          gh run download 42848939530 -R "${{ github.repository }}" \
            -n paper-s-window-tolerance-six-certified-intervals -D /tmp/source
          test -s /tmp/source/paper_s_six_window_tolerance_envelopes.csv
      - name: Produce Figure S19 from six authentic tolerance envelopes
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_window_tolerance_figures \
            --source /tmp/source/paper_s_six_window_tolerance_envelopes.csv \
            --out-dir outputs
          test -s outputs/Figure_S19_window_discharge_cost_tolerance.png
          test -s outputs/Figure_S19_window_discharge_cost_tolerance.svg
          test -s outputs/Figure_S19_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-certified-Figure-S19-cost-tolerance
          path: outputs/
          if-no-files-found: error
