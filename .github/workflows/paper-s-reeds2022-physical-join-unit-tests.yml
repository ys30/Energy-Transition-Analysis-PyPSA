name: Paper S ReEDS2022 physical join gate unit tests
'on':
  pull_request:
    paths:
      - 'src/energy_transition/reeds2022_resource_join_gate.py'
      - 'src/energy_transition/reeds2022_county_state_resources.py'
      - 'src/energy_transition/reeds2022_county_original_extract.py'
      - 'src/energy_transition/reeds2022_hourly_energy_scenarios.py'
      - 'tests/test_reeds2022_resource_join_gate.py'
      - 'tests/test_reeds2022_county_state_resources.py'
      - 'tests/test_reeds2022_county_original_extract.py'
      - 'tests/test_reeds2022_hourly_energy_scenarios.py'
      - '.github/workflows/paper-s-reeds2022-physical-join-unit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'pytest>=8' 'h5py>=3.10'
      - name: Validate calendar, PV units, geographic-crossing diagnostics and rejection rules
        run: PYTHONPATH=src python -m pytest -q tests/test_reeds2022_resource_join_gate.py tests/test_reeds2022_county_state_resources.py tests/test_reeds2022_county_original_extract.py tests/test_reeds2022_hourly_energy_scenarios.py
