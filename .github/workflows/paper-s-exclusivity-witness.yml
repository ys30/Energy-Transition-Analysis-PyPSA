name: Paper S charge discharge exclusive feasibility witness
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_exclusive_feasibility_witness.py'
      - 'tests/test_paper_s_exclusive_feasibility_witness.py'
      - '.github/workflows/paper-s-exclusivity-witness.yml'
permissions:
  contents: read
  actions: read
jobs:
  exclusive-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and validate algebraic transformation and failure gates
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_exclusive_feasibility_witness.py
      - name: Restore six accepted 2030 full-year LP source-hour trajectories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/az /tmp/wy
          gh run download 42851448558 -R "${{ github.repository }}" \
            -n paper-s-full-hour-window-redistribution-source-group-1 -D /tmp/az
          gh run download 42851448558 -R "${{ github.repository }}" \
            -n paper-s-full-hour-window-redistribution-source-group-7 -D /tmp/wy
          test -s /tmp/az/paper_s_three_full_hour_window_dispatch_traces.csv.gz
          test -s /tmp/wy/paper_s_three_full_hour_window_dispatch_traces.csv.gz
      - name: Certify original-cost preserving exclusive feasible candidates and rigorous interval width lower bound
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_exclusive_feasibility_witness \
            --arizona-traces /tmp/az/paper_s_three_full_hour_window_dispatch_traces.csv.gz \
            --arizona-summary /tmp/az/paper_s_reconstructed_three_original_window_schedules.csv \
            --wyoming-traces /tmp/wy/paper_s_three_full_hour_window_dispatch_traces.csv.gz \
            --wyoming-summary /tmp/wy/paper_s_reconstructed_three_original_window_schedules.csv \
            --out-dir outputs
          test -s outputs/paper_s_exclusive_window_interval_feasible_bounds.csv
          test -s outputs/paper_s_six_algebraic_exclusive_repair_certificates.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-certified-exclusive-feasible-window-witness
          path: outputs/
          if-no-files-found: error
