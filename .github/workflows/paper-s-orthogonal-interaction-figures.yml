name: Paper S archive-derived MW MWh interaction Figure S13
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_orthogonal_interaction_figures.py'
      - 'tests/test_paper_s_orthogonal_interaction_figures.py'
      - '.github/workflows/paper-s-orthogonal-interaction-figures.yml'
permissions:
  contents: read
  actions: read
jobs:
  figure-s13:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test numerical source certificate and plotting
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_orthogonal_interaction_figures.py
      - name: Restore original 84 validated MW MWh interaction rectangles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source
          gh run download 42675999423 -R "${{ github.repository }}" \
            -n paper-s-84-mw-mwh-interaction-source-certificate -D /tmp/source
          test -s /tmp/source/paper_s_84_orthogonal_interactions.csv
      - name: Render Figure S13 and enforce exact factor coverage
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_orthogonal_interaction_figures \
            --interactions /tmp/source/paper_s_84_orthogonal_interactions.csv \
            --out-dir outputs
          test -s outputs/Figure_S13_orthogonal_MW_MWh_interaction_heatmap.png
          test -s outputs/Figure_S13_orthogonal_MW_MWh_interaction_heatmap.svg
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-certified-figure-S13-mw-mwh-interactions
          path: outputs/
          if-no-files-found: error
