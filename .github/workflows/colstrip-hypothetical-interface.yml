name: Colstrip hypothetical 500kV interface scenario
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/colstrip-hypothetical-interface.yml'
      - 'src/energy_transition/colstrip_hypothetical_interface.py'
permissions:
  contents: read
  actions: read
jobs:
  topology-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . && python -m pip install 'pypsa>=0.30,<1.0' netcdf4
      - name: Download immutable source-network artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/western
          gh run download 41531397166 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/western
          test -s /tmp/western/real-western-base-network.nc
      - name: Build scenario-only Colstrip interface
        run: |
          python -m energy_transition.colstrip_hypothetical_interface \
            --network /tmp/western/real-western-base-network.nc \
            --out outputs/SCENARIO_ONLY_colstrip_500_345.nc \
            --report outputs/SCENARIO_ONLY_colstrip_500_345.json
      - name: Independently reload exported scenario and verify topology invariants
        run: |
          python - <<'PY'
          import json, pypsa
          n=pypsa.Network("outputs/SCENARIO_ONLY_colstrip_500_345.nc")
          assert len(n.buses)==10158, len(n.buses)
          assert len(n.transformers)==2081, len(n.transformers)
          b="SCENARIO_ONLY_colstrip_500kV"
          t="SCENARIO_ONLY_colstrip_500_to_345"
          assert float(n.buses.loc[b,"v_nom"])==500.0
          assert n.transformers.loc[t,"bus0"]==b
          assert n.transformers.loc[t,"bus1"]=="2077254"
          assert float(n.transformers.loc[t,"s_nom"])==500.0
          assert float(n.transformers.loc[t,"x"])==0.1
          assert float(n.transformers.loc[t,"r"])==0.01
          assert len(n.generators.loc[n.generators.bus.astype(str).eq(b)])==0
          evidence={"roundtrip_pass":True,"scenario_only":True,
            "buses":len(n.buses),"transformers":len(n.transformers),
            "new_bus":b,"new_transformer":t,
            "generators_attached_to_new_bus":0,
            "empirical_dispatch_claim":False}
          with open("outputs/SCENARIO_ONLY_colstrip_roundtrip.json","w") as f:
              json.dump(evidence,f,indent=2)
          print(json.dumps(evidence,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-only-colstrip-interface
          path: outputs/
