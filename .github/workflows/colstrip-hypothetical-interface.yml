name: Colstrip hypothetical 500kV interface scenario
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/colstrip-hypothetical-interface.yml'
      - 'src/energy_transition/colstrip_hypothetical_interface.py'
permissions:
  contents: read
  actions: read
jobs:
  topology-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . && python -m pip install 'pypsa>=0.30,<1.0' netcdf4
      - name: Download immutable source-network artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/western
          gh run download 41531397166 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/western
          test -s /tmp/western/real-western-base-network.nc
      - name: Build scenario-only Colstrip interface
        run: |
          python -m energy_transition.colstrip_hypothetical_interface \
            --network /tmp/western/real-western-base-network.nc \
            --out outputs/SCENARIO_ONLY_colstrip_500_345.nc \
            --report outputs/SCENARIO_ONLY_colstrip_500_345.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-only-colstrip-interface
          path: outputs/
