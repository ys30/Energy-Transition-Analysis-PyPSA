name: EIA-930 full-year hourly dispatch pilot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia930-full-hour-pilot.yml'
      - 'src/energy_transition/eia930_full_hour_pilot.py'
jobs:
  hourly_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]'
      - name: Fetch observed 2024 CISO demand
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          test -n "$EIA_API_KEY"
          python - <<'PY'
          from pathlib import Path
          from energy_transition.eia930_west import fetch_eia_demand
          out=Path("outputs/hourly_dispatch_pilot")
          out.mkdir(parents=True,exist_ok=True)
          fetch_eia_demand(2024,["CISO"]).to_csv(out/"observed_demand_hourly.csv",index=False)
          PY
      - name: Solve 8784 chronological hours with assumed gas supply
        run: |
          python -m energy_transition.eia930_full_hour_pilot \
            --demand outputs/hourly_dispatch_pilot/observed_demand_hourly.csv \
            --year 2024 --bas CISO --output outputs/hourly_dispatch_pilot
      - name: Confirm dispatch is complete and finite
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from pathlib import Path
          out=Path("outputs/hourly_dispatch_pilot")
          result=pd.read_csv(out/"modeled_generation_hourly.csv")
          assert len(result)==8784
          observed=pd.read_csv(out/"observed_demand_hourly.csv")
          assert len(observed)==8784
          assert pd.to_datetime(result["period"],utc=True).is_unique
          assert set(pd.to_datetime(result["period"],utc=True))==set(pd.to_datetime(observed["period"],utc=True))
          assert result["respondent"].eq("CISO").all()
          assert np.isfinite(result["value"]).all()
          assert (result["value"]>=0).all()
          audit=__import__("json").loads((out/"unserved_load_audit.json").read_text())
          balance=__import__("json").loads((out/"hourly_balance_audit.json").read_text())
          assert balance["year"]==2024 and balance["hours_per_ba"]==8784
          assert np.isfinite(balance["max_absolute_residual_mw"])
          assert balance["max_absolute_residual_mw"]<=balance["tolerance_mw"]
          unmet=pd.read_csv(out/"unserved_load_hourly.csv")
          assert len(unmet)==8784
          assert np.isfinite(unmet["unserved_mw"]).all()
          assert (unmet["unserved_mw"]>=-1e-6).all()
          assert abs(float(unmet["unserved_mw"].sum())-float(audit["total_unserved_mwh"]))<1e-5
          assert audit["unserved_positive_hours"]==int((unmet["unserved_mw"]>1e-6).sum())
          # Verify BA-hour physical accounting rather than only row counts.
          demand=observed[["respondent","period","value"]].copy()
          gas=result[["respondent","period","value"]].rename(columns={"value":"gas_mw"})
          shed=unmet[["respondent","period","unserved_mw"]]
          for frame in (demand,gas,shed):
            frame["period"]=pd.to_datetime(frame["period"],utc=True)
            assert not frame.duplicated(["respondent","period"]).any()
          check=demand.merge(gas,on=["respondent","period"],validate="one_to_one").merge(
            shed,on=["respondent","period"],validate="one_to_one")
          assert len(check)==8784
          mismatch=(check["gas_mw"]+check["unserved_mw"]-check["value"]).abs()
          assert float(mismatch.max())<=1e-4, f"BA-hour energy balance failed: {mismatch.max()} MW"
          print("Verified 8784 model dispatch values and separate synthetic unserved-load audit")
          PY
      - name: Compare assumption-driven gas dispatch with EIA-930 observed net generation
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from energy_transition.eia930_generation_audit import fetch_net_generation
          out=Path("outputs/hourly_dispatch_pilot")
          fetch_net_generation(2024,["CISO"]).to_csv(
              out/"observed_net_generation_hourly.csv",index=False)
          PY
          python -m energy_transition.eia930_hourly_model_comparison \
            --observed outputs/hourly_dispatch_pilot/observed_net_generation_hourly.csv \
            --modeled outputs/hourly_dispatch_pilot/modeled_generation_hourly.csv \
            --year 2024 --bas CISO --output outputs/hourly_dispatch_pilot
      - name: Verify comparison remains descriptive rather than calibrated
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path("outputs/hourly_dispatch_pilot")
          row=pd.read_csv(out/"ba_hourly_error_summary.csv").iloc[0]
          assert row["expected_hours"]==8784
          assert row["paired_hours"]>0
          assert 0 < row["paired_coverage"] <= 1
          assert row["observed_hours"] >= row["paired_hours"]
          assert "observed_negative_hours" in row and "observed_zero_hours" in row
          assert 0 <= row["observed_negative_hours"] <= row["observed_hours"]
          assert 0 <= row["observed_zero_hours"] <= row["observed_hours"]
          assert row["observed_negative_hours"]+row["observed_zero_hours"]<=row["observed_hours"]
          assert row["modeled_hours"] == 8784
          assert pd.notna(row["mae_mw"]) and row["mae_mw"] >= 0
          assert pd.notna(row["rmse_mw"]) and row["rmse_mw"] >= row["mae_mw"] - 1e-8
          assert pd.notna(row["peak_absolute_error_mw"])
          assert row["peak_absolute_error_mw"] >= row["mae_mw"] - 1e-8
          assert not bool(row["validated_calibration"])
          print("Observed-vs-model comparison is descriptive, not validated calibration")
          PY
      - name: Record reproducible input and output checksums
        run: |
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          import pypsa,pandas,numpy
          out=Path("outputs/hourly_dispatch_pilot")
          files=sorted(p for p in out.iterdir() if p.is_file() and p.name!="execution_manifest.json")
          report={
            "commit_sha":os.environ["GITHUB_SHA"],
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "python_version":platform.python_version(),
            "pypsa_version":pypsa.__version__,
            "pandas_version":pandas.__version__,
            "numpy_version":numpy.__version__,
            "source":"EIA-930 official API at run time; upstream data may be revised",
            "sha256":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
            "interpretation":"Assumption-driven gas-only engineering pilot, not historical generation calibration",
          }
          (out/"execution_manifest.json").write_text(json.dumps(report,indent=2))
          assert "observed_demand_hourly.csv" in report["sha256"]
          assert "observed_net_generation_hourly.csv" in report["sha256"]
          assert "ba_hourly_error_summary.csv" in report["sha256"]
          print("Saved run provenance and output SHA-256 manifest")
          PY
      - name: Independently verify output integrity manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path("outputs/hourly_dispatch_pilot")
          manifest=json.loads((out/"execution_manifest.json").read_text())
          required={
            "observed_demand_hourly.csv",
            "observed_net_generation_hourly.csv",
            "modeled_generation_hourly.csv",
            "unserved_load_hourly.csv",
            "hourly_balance_audit.json",
            "unserved_load_audit.json",
            "hourly_pairs.csv",
            "ba_hourly_error_summary.csv",
            "hourly_network.nc",
          }
          assert required.issubset(manifest["sha256"]), required-set(manifest["sha256"])
          for name,digest in manifest["sha256"].items():
            p=out/name
            assert p.is_file(),f"Missing expected artifact: {name}"
            assert hashlib.sha256(p.read_bytes()).hexdigest()==digest, f"Checksum mismatch: {name}"
          assert manifest["commit_sha"] and manifest["workflow_run_id"]
          print("Independent manifest integrity gate passed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia930-full-year-ciso-assumption-driven-2024
          path: outputs/hourly_dispatch_pilot/
          retention-days: 30
