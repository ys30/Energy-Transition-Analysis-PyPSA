name: EIA-860 residual supply capacity reality screen
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/residual-supply-capacity.yml'
      - 'src/energy_transition/residual_supply_capacity_screen.py'
      - 'tests/test_residual_supply_capacity_screen.py'
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_residual_supply_capacity_screen.py
      - uses: actions/download-artifact@v4
        with:
          name: eia923-vs-pypsa-2024
          run-id: 40964541770
          github-token: ${{ github.token }}
          path: inputs/historical
      - name: Check assumed residual generation against EIA 860 BA fuel nameplate
        run: |
          python -m energy_transition.residual_supply_capacity_screen \
            --input inputs/historical/eia860_model_subset/ba_operating_nameplate_by_fuel_2024.csv \
            --output outputs/residual_supply_capacity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-supply-capacity-screen-2024
          path: outputs/residual_supply_capacity/
          retention-days: 60
