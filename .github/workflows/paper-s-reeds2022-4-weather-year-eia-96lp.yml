name: Paper S four authentic weather years EIA2025 county siting 96 LP
'on':
  pull_request:
    paths:
      - 'src/energy_transition/reeds2022_four_weather_year_siting_lp.py'
      - 'src/energy_transition/reeds2022_explicit_weather_year_alignment.py'
      - 'tests/test_reeds2022_four_weather_year_siting_lp.py'
      - 'tests/test_reeds2022_explicit_weather_year_alignment.py'
      - '.github/workflows/paper-s-reeds2022-4-weather-year-eia-96lp.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-weather-96-lp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source HDF5 and optimization packages
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11' 'h5py>=3.10' 'pytest>=8'
      - name: Validate explicit reference calendar alignment and 96 LP grouping
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_reeds2022_explicit_weather_year_alignment.py \
            tests/test_reeds2022_four_weather_year_siting_lp.py \
            tests/test_reeds2022_source_multiyear_calendar_audit.py
      - name: Re-download two publisher authentic 15-weather-year source county HDF5s
        run: |
          set -eu
          mkdir -p /tmp/reeds /tmp/reeds/wind /tmp/reeds/pv /tmp/reeds/eia /tmp/reeds/anchor outputs
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 30 --max-time 3600 \
            'https://zenodo.org/records/18422200/files/cf_wind-ons_reference_county.h5?download=1' \
            -o /tmp/reeds/wind.h5
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 30 --max-time 3600 \
            'https://zenodo.org/records/18407660/files/cf_upv_reference_county.h5?download=1' \
            -o /tmp/reeds/pv.h5
          echo '0670813d0a18b688d698ca24cf67fb92  /tmp/reeds/wind.h5' | md5sum --check
          echo 'aba834ea4c592023bca47de2ba79e7ec  /tmp/reeds/pv.h5' | md5sum --check
      - name: Fetch verified original source capacities and 2012 reference profiles
        run: |
          set -eu
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 240 \
            'https://zenodo.org/records/18422200/files/sc_wind-ons_reference_county.csv?download=1' -o /tmp/reeds/wind_sc.csv
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 240 \
            'https://zenodo.org/records/18407660/files/sc_upv_reference_county.csv?download=1' -o /tmp/reeds/pv_sc.csv
          echo '49ab4e41dc386453b5fd32e5810774d4  /tmp/reeds/wind_sc.csv' | md5sum --check
          echo 'e10b1a64f3a67d163e739b735938eb78  /tmp/reeds/pv_sc.csv' | md5sum --check
          for tech in wind pv; do
            for trial in 1 2 3; do
              gh run download 42962740548 --repo "${{ github.repository }}" \
                --name "paper-s-reeds2022-original-2012-county-${tech}-hdf5-source-audit" \
                --dir "/tmp/reeds/${tech}" && break
              if [ "$trial" -eq 3 ]; then exit 1; fi
              sleep 10
            done
          done
      - name: Fetch independently verified EIA county installed shares and frozen 2012 24 LPs
        run: |
          set -eu
          for trial in 1 2 3; do
            gh run download 43124063185 --repo "${{ github.repository }}" \
              --name paper-s-eia860-2025-observed-fleet-versus-reeds-county-potential-weight-comparison \
              --dir /tmp/reeds/eia && break
            if [ "$trial" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          for trial in 1 2 3; do
            gh run download 43159121663 --repo "${{ github.repository }}" \
              --name paper-s-reeds2022-eia2025-county-siting-24-LP-comparison \
              --dir /tmp/reeds/anchor && break
            if [ "$trial" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 \
            'https://zenodo.org/records/18461543/files/demand_EFS_REFERENCE.h5?download=1' \
            -o /tmp/reeds/demand.h5
          echo '7b2055d43200744a16a8c4fed68b1a17  /tmp/reeds/demand.h5' | md5sum --check
      - name: Solve 96 source-native LPs with documented nonleap Feb29 interpolation
        run: |
          PYTHONPATH=src python -m energy_transition.reeds2022_four_weather_year_siting_lp \
            --wind-h5 /tmp/reeds/wind.h5 --pv-h5 /tmp/reeds/pv.h5 \
            --wind-sc /tmp/reeds/wind_sc.csv --pv-sc /tmp/reeds/pv_sc.csv \
            --county-shares /tmp/reeds/eia/paper_s_eia860_2025_vs_reeds_county_spatial_weights.csv \
            --wind-ref /tmp/reeds/wind/reeds2022_wind_2012_four_state_instantaneous_cf.csv \
            --pv-ref /tmp/reeds/pv/reeds2022_pv_2012_four_state_instantaneous_cf.csv \
            --demand-h5 /tmp/reeds/demand.h5 \
            --reference-2012-24lp /tmp/reeds/anchor/paper_s_2030_EIA2025_county_weight_vs_source_potential_24_LP.csv \
            --out outputs
          python - <<'PY'
          from pathlib import Path
          import json,pandas as pd
          o=Path('outputs')
          a=pd.read_csv(o/'paper_s_2010_2013_weather_year_96_geography_duration_LPs.csv')
          b=pd.read_csv(o/'paper_s_2010_2013_weather_year_32_storage_triplets.csv')
          c=pd.read_csv(o/'paper_s_2010_2013_weather_year_16_siting_comparisons.csv')
          m=json.loads((o/'paper_s_2010_2013_weather_96LP_manifest.json').read_text())
          assert len(a)==96 and len(b)==32 and len(c)==16
          assert a.solver_status.eq('optimal').all() and a.max_equality_residual_mwh.max()<1e-5
          assert m['frozen_2012_24_LP_max_objective_delta_usd']<.1
          assert m['interannual_weather_is_a_future_climate_change_projection'] is False
          assert m['hourly_integrated_source_generation_certified'] is False
          assert a.weather_year.nunique()==4
          print('PAPER_S_96_AUTHENTIC_REEDS_WEATHER_HDF5_EIA_SITING_LP_AND_2012_ANCHOR_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-s-reeds-4-weather-year-eia2025-siting-96-LP-source-sensitivity
          path: outputs/
          if-no-files-found: warn
