name: Project B two-BA engineering acceptance
on:
  push:
    paths:
      - '.github/workflows/project-b-two-ba-acceptance.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - EIA-930 full-year hourly dispatch pilot
      - EIA-930 BPAT full-year hourly independent pilot
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - name: Verify same-revision BA runs and numerical artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,tempfile,urllib.request
          from pathlib import Path
          import pandas as pd

          repo=os.environ["GH_REPOSITORY"]
          def api(path):
              request=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept":"application/vnd.github+json",
                           "User-Agent":"project-b-acceptance"})
              with urllib.request.urlopen(request,timeout=45) as response:
                  return json.load(response)

          runs=[]
          for page in range(1,11):
              batch=api(f"actions/runs?per_page=100&page={page}")["workflow_runs"]
              runs.extend(batch)
              if len(batch)<100:
                  break
          else:
              raise SystemExit("More than 1000 workflow runs; paging incomplete")

          names={"CISO":"EIA-930 full-year hourly dispatch pilot",
                 "BPAT":"EIA-930 BPAT full-year hourly independent pilot"}
          by_ba={}
          for ba,workflow in names.items():
              successful=[r for r in runs if r["name"]==workflow
                          and r["status"]=="completed"
                          and r["conclusion"]=="success"]
              if not successful:
                  raise SystemExit(f"No successful {ba} workflow")
              by_ba[ba]={r["head_sha"]:r for r in reversed(successful)}

          shared=set(by_ba["CISO"])&set(by_ba["BPAT"])
          if not shared:
              raise SystemExit("No successful same-commit CISO/BPAT runs")
          sha=max(shared,key=lambda s:max(by_ba["CISO"][s]["created_at"],
                                           by_ba["BPAT"][s]["created_at"]))
          report={
              "common_commit_sha":sha,
              "acceptance_scope":"2024 independent CISO/BPAT gas-only hourly pilot engineering evidence",
              "limitations":"Not an interconnected, historically calibrated electric-grid model",
          }
          with tempfile.TemporaryDirectory() as temporary:
              for ba in names:
                  run=by_ba[ba][sha]
                  artifact_name=("eia930-full-year-ciso-assumption-driven-2024"
                                 if ba=="CISO" else "eia930-bpat-hourly-2024-assumption-driven")
                  out=Path(temporary)/ba
                  out.mkdir()
                  subprocess.run([
                      "gh","run","download",str(run["id"]),"--repo",repo,
                      "--name",artifact_name,"--dir",str(out)
                  ],check=True)
                  def find_unique(name):
                      matches=list(out.rglob(name))
                      if len(matches)!=1:
                          raise SystemExit(f"{ba}: expected one {name}, found {len(matches)}")
                      return matches[0]
                  manifest=json.loads(find_unique("execution_manifest.json").read_text())
                  required=["ba_hourly_error_summary.csv","hourly_balance_audit.json",
                            "modeled_generation_hourly.csv","observed_net_generation_hourly.csv"]
                  for name in required:
                      path=find_unique(name)
                      digest=manifest["sha256"].get(name)
                      if not digest or hashlib.sha256(path.read_bytes()).hexdigest()!=digest:
                          raise SystemExit(f"{ba}: bad or missing SHA-256 for {name}")
                  m=pd.read_csv(find_unique(required[0])).iloc[0]
                  balance=json.loads(find_unique(required[1]).read_text())
                  if (m["ba_code"]!=ba or int(m["expected_hours"])!=8784
                          or int(m["modeled_hours"])!=8784 or int(m["paired_hours"])<1):
                      raise SystemExit(f"{ba}: coverage/BA numerical gate failed")
                  if (not pd.notna(m["mae_mw"]) or not pd.notna(m["rmse_mw"])
                          or float(m["rmse_mw"])<float(m["mae_mw"])-1e-8):
                      raise SystemExit(f"{ba}: error metric gate failed")
                  if (balance["hours_per_ba"]!=8784
                          or balance["max_absolute_residual_mw"]>balance["tolerance_mw"]):
                      raise SystemExit(f"{ba}: hourly demand balance failed")
                  report[ba]={
                      "run_id":run["id"],"url":run["html_url"],
                      "paired_hours":int(m["paired_hours"]),
                      "paired_coverage":float(m["paired_coverage"]),
                      "mae_mw":float(m["mae_mw"]),
                      "rmse_mw":float(m["rmse_mw"]),
                      "max_hourly_balance_residual_mw":float(balance["max_absolute_residual_mw"]),
                      "validated_calibration":False,
                  }
          Path("two_ba_engineering_acceptance.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-b-two-ba-acceptance
          path: two_ba_engineering_acceptance.json
          retention-days: 90
