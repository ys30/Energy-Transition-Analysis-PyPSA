name: Project B two-BA engineering acceptance
on:
  push:
    paths:
      - '.github/workflows/project-b-two-ba-acceptance.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - EIA-930 full-year hourly dispatch pilot
      - EIA-930 BPAT full-year hourly independent pilot
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install pandas
      - name: Verify paired successful BA runs and actual numerical artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GH_REPOSITORY"]
          req=urllib.request.Request(
            f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
            headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                     "Accept":"application/vnd.github+json",
                     "User-Agent":"project-b-acceptance"})
          with urllib.request.urlopen(req,timeout=30) as f:
            runs=json.load(f)["workflow_runs"]
          # API listing is paginated. Never infer "latest" from an
          # incomplete first page when the repository has many workflows.
          page=2
          while len(runs)>=100 and len(runs)%100==0:
            next_req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept":"application/vnd.github+json",
                       "User-Agent":"project-b-acceptance"})
            with urllib.request.urlopen(next_req,timeout=30) as f:
              batch=json.load(f)["workflow_runs"]
            runs.extend(batch)
            if len(batch)<100:
              break
            page+=1
            if page>10:
              raise SystemExit("Workflow listing exceeded 1000 runs; refuse incomplete evidence")

          names={
            "CISO":"EIA-930 full-year hourly dispatch pilot",
            "BPAT":"EIA-930 BPAT full-year hourly independent pilot",
          }
          report={"acceptance_scope":"Verified workflows for independent gas-only 2024 BA pilots; not a calibrated multi-BA grid"}
          # Pair latest successful runs on the same revision, rather than
          # incorrectly rejecting an independent newer run on one BA.
          by_ba={}
          for ba,name in names.items():
            matches=[x for x in runs if x["name"]==name and x["event"]!="schedule"
                     and x["status"]=="completed" and x["conclusion"]=="success"]
            if not matches:
              raise SystemExit(f"No verified {ba} hourly run")
            by_ba[ba]={x["head_sha"]:x for x in reversed(matches)}
          common=set(by_ba["CISO"]) & set(by_ba["BPAT"])
          if not common:
            raise SystemExit("No same-revision successful CISO/BPAT pair")
          sha=max(common,key=lambda x:max(by_ba["CISO"][x]["created_at"],
                                         by_ba["BPAT"][x]["created_at"]))
          report["common_commit_sha"]=sha
          import io,zipfile,hashlib
          import pandas as pd
          for ba in names:
            selected=by_ba[ba][sha]
            report[ba]={"run_id":selected["id"],"commit_sha":sha,
                        "status":selected["status"],"conclusion":selected["conclusion"],
                        "run_url":selected["html_url"]}
            areq=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{selected['id']}/artifacts",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept":"application/vnd.github+json",
                       "User-Agent":"project-b-acceptance"})
            with urllib.request.urlopen(areq,timeout=45) as resp:
              artifacts=json.load(resp)["artifacts"]
            expected_name=("eia930-full-year-ciso-assumption-driven-2024"
                           if ba=="CISO" else "eia930-bpat-hourly-2024-assumption-driven")
            found=[a for a in artifacts if a["name"]==expected_name and not a["expired"]]
            if not found:
              raise SystemExit(f"{ba}: missing retained artifact")
            zreq=urllib.request.Request(found[0]["archive_download_url"],
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept":"application/vnd.github+json",
                       "User-Agent":"project-b-acceptance"})
            with urllib.request.urlopen(zreq,timeout=120) as resp:
              payload=resp.read()
            with zipfile.ZipFile(io.BytesIO(payload)) as z:
              names_in_zip={n.rsplit("/",1)[-1]:n for n in z.namelist()}
              required=["ba_hourly_error_summary.csv","hourly_balance_audit.json",
                        "execution_manifest.json"]
              if any(x not in names_in_zip for x in required):
                raise SystemExit(f"{ba}: incomplete numerical artifact")
              manifest=json.loads(z.read(names_in_zip["execution_manifest.json"]))
              for basename in required[:2]:
                expected_digest=manifest["sha256"][basename]
                actual=hashlib.sha256(z.read(names_in_zip[basename])).hexdigest()
                if actual!=expected_digest:
                  raise SystemExit(f"{ba}: checksum mismatch on {basename}")
              metrics=pd.read_csv(io.BytesIO(z.read(names_in_zip[required[0]]))).iloc[0]
              balance=json.loads(z.read(names_in_zip[required[1]]))
              if str(metrics["ba_code"])!=ba or int(metrics["expected_hours"])!=8784:
                raise SystemExit(f"{ba}: unexpected BA/year evidence")
              if int(metrics["modeled_hours"])!=8784 or int(metrics["paired_hours"])<1:
                raise SystemExit(f"{ba}: insufficient paired dispatch evidence")
              if balance["max_absolute_residual_mw"]>balance["tolerance_mw"]:
                raise SystemExit(f"{ba}: energy-balance tolerance exceeded")
              report[ba]["numerical_evidence"]={
                "paired_hours":int(metrics["paired_hours"]),
                "paired_coverage":float(metrics["paired_coverage"]),
                "mae_mw":float(metrics["mae_mw"]),
                "rmse_mw":float(metrics["rmse_mw"]),
                "max_hourly_balance_residual_mw":float(balance["max_absolute_residual_mw"]),
                "validated_calibration":False,
              }
          report["acceptance_limitations"]=[
            "Independent BA gas-only baseline, not interconnected or historically calibrated",
            "Observed EIA-930 NG difference measures assumed model mismatch",
            "Evidence is paired from the latest shared successful commit, not necessarily latest individual run",
          ]
          with open("two_ba_engineering_acceptance.json","w") as f:
            json.dump(report,f,indent=2)
          # Ensure the two independently passed pilots used identical source revision.
          ciso_sha=report["CISO"]["commit_sha"]
          bpat_sha=report["BPAT"]["commit_sha"]
          if ciso_sha!=bpat_sha:
            raise SystemExit(
              f"Different tested source revisions: CISO={ciso_sha}, BPAT={bpat_sha}")
          report["common_commit_sha"]=ciso_sha
          report["acceptance_limitations"]=[
            "Checks successful upstream workflow evidence, not numerical comparisons across BA",
            "Both models are independent gas-only baselines without physical interconnection",
            "Observed EIA-930 NG differences are descriptive, not calibrated predictions",
          ]
          with open("two_ba_engineering_acceptance.json","w") as f:
            json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-b-two-ba-acceptance
          path: two_ba_engineering_acceptance.json
          retention-days: 90
