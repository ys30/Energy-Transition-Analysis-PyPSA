name: Paper S daily transfer mechanism plus IPCO 2023 shape with falsification gates
'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/energy_transition/paper_s_daily_transfer_proxy_and_ipco_shape.py'
      - 'tests/test_paper_s_daily_proxy_and_ipco_shape.py'
      - '.github/workflows/paper-s-daily-mechanism-ipco-shape-2023.yml'
permissions:
  contents: read
  actions: read
jobs:
  source-backed-daily-and-IPCO:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific dependencies and source-independent input tests
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11' 'h5py>=3.10' 'pytest>=8'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_daily_proxy_and_ipco_shape.py
      - name: Source pin all original 15-weather-year county ReEDS HDF, original curves and 2023 EIA930
        run: |
          set -euo pipefail
          mkdir -p /tmp/paper-s/wind /tmp/paper-s/pv /tmp/paper-s/eia /tmp/paper-s/frozen /tmp/paper-s/observed outputs/daily outputs/ipco
          source_auth() {
            local rec="$1" name="$2" dest="$3" md5="$4" url attempt
            for attempt in 1 2 3 4; do
              for url in "https://zenodo.org/records/${rec}/files/${name}?download=1" \
                "https://zenodo.org/api/records/${rec}/files/${name}/content"; do
                rm -f "$dest"
                if curl -fLsS --retry 2 --retry-all-errors --retry-delay 15 \
                  --connect-timeout 30 --max-time 3600 "$url" -o "$dest" \
                  && echo "$md5  $dest" | md5sum --check; then return 0; fi
              done
              if [ "$attempt" -lt 4 ]; then sleep 45; fi
            done
            echo "::error::Publisher source failed pin $name"
            return 1
          }
          source_auth 18422200 cf_wind-ons_reference_county.h5 /tmp/paper-s/wind.h5 0670813d0a18b688d698ca24cf67fb92
          source_auth 18407660 cf_upv_reference_county.h5 /tmp/paper-s/pv.h5 aba834ea4c592023bca47de2ba79e7ec
          source_auth 18422200 sc_wind-ons_reference_county.csv /tmp/paper-s/wind_sc.csv 49ab4e41dc386453b5fd32e5810774d4
          source_auth 18407660 sc_upv_reference_county.csv /tmp/paper-s/pv_sc.csv e10b1a64f3a67d163e739b735938eb78
          source_auth 18461543 demand_EFS_REFERENCE.h5 /tmp/paper-s/demand.h5 7b2055d43200744a16a8c4fed68b1a17
          gh run download 42962740548 --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-reeds2022-original-2012-county-wind-hdf5-source-audit --dir /tmp/paper-s/wind
          gh run download 42962740548 --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-reeds2022-original-2012-county-pv-hdf5-source-audit --dir /tmp/paper-s/pv
          gh run download 43124063185 --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-eia860-2025-observed-fleet-versus-reeds-county-potential-weight-comparison --dir /tmp/paper-s/eia
          gh run download 44209543001 --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-nine-design-point-wind-share-penetration-2880-new-lp-results --dir /tmp/paper-s/frozen
          gh run download 44246001519 --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-2023-full-year-8760-hour-EIA930-BA-wind-solar-observation-coverage --dir /tmp/paper-s/observed
          test -s /tmp/paper-s/frozen/paper_s_design_grid_1080_duration_values.csv
          test -s /tmp/paper-s/observed/paper_s_eia930_2023_annual_BA_wind_solar_reported_MW.csv
      - name: Run all 15 weather years x four states x both weights same-day 4-to-8h proxy
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_daily_transfer_proxy_and_ipco_shape \
            --mode daily --wind-h5 /tmp/paper-s/wind.h5 --pv-h5 /tmp/paper-s/pv.h5 \
            --wind-sc /tmp/paper-s/wind_sc.csv --pv-sc /tmp/paper-s/pv_sc.csv \
            --county-shares /tmp/paper-s/eia/paper_s_eia860_2025_vs_reeds_county_spatial_weights.csv \
            --wind-ref /tmp/paper-s/wind/reeds2022_wind_2012_four_state_instantaneous_cf.csv \
            --pv-ref /tmp/paper-s/pv/reeds2022_pv_2012_four_state_instantaneous_cf.csv \
            --demand-h5 /tmp/paper-s/demand.h5 \
            --frozen-grid /tmp/paper-s/frozen/paper_s_design_grid_1080_duration_values.csv \
            --out outputs/daily
      - name: Original unmodified weather-2023 hourly Idaho source versus IPCO BA observed shape
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_daily_transfer_proxy_and_ipco_shape \
            --mode ipco --wind-h5 /tmp/paper-s/wind.h5 --pv-h5 /tmp/paper-s/pv.h5 \
            --wind-sc /tmp/paper-s/wind_sc.csv --pv-sc /tmp/paper-s/pv_sc.csv \
            --county-shares /tmp/paper-s/eia/paper_s_eia860_2025_vs_reeds_county_spatial_weights.csv \
            --observed /tmp/paper-s/observed/paper_s_eia930_2023_annual_BA_wind_solar_reported_MW.csv \
            --out outputs/ipco
      - name: Fail-closed coverage and no inflation of observational claims
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,pandas as pd
          root=Path('outputs')
          d=pd.read_csv(root/'daily/D1_daily_proxy_cases.csv')
          p=pd.read_csv(root/'daily/D3_daily_proxy_within_year_paired.csv')
          i=pd.read_csv(root/'ipco/I1_IPCO_metrics.csv')
          c=pd.read_csv(root/'ipco/I3_IPCO_UTC_shift_placebos.csv')
          assert len(d)==240 and len(p)==120
          chron=pd.read_csv(root/'daily/C1_chronological_policy_240_cases.csv')
          paired_chron=pd.read_csv(root/'daily/C4_chronological_policy_120_paired_differences.csv')
          day_chron=pd.read_csv(root/'daily/C2_chronological_policy_87600_days.csv.gz')
          summary_chron=pd.read_csv(root/'daily/C5_chronological_mechanism_8_group_summary.csv')
          assert len(chron)==240 and len(paired_chron)==120 and len(day_chron)==87600
          assert len(summary_chron)==8 and summary_chron.source_weather_years.eq(15).all()
          assert chron.annual_feasible_policy_4to8_delta_mwh.ge(-1e-5).all()
          assert day_chron.incremental_eight_minus_four_policy_delivered_mwh.ge(-1e-5).all()
          source_manifest=json.loads((root/'daily/D0_manifest.json').read_text())
          assert source_manifest['chronological_policy_hourly_power_soc_feasible']
          assert source_manifest['chronological_policy_is_NOT_global_optimum']
          assert source_manifest['chronological_policy_is_NOT_full_year_upper_bound']

          assert set(d.state)=={'AZ','CO','ID','WY'}
          assert set(i.fuel)=={'solar','wind'}
          assert set(i.shift_hours)=={0,-1,1,-6,6}
          assert set(i.variant)=={'reported_mw','adjusted_mw'}
          assert set(c.fuel)=={'solar','wind'}
          m=json.loads((root/'ipco/I0_manifest.json').read_text())
          assert m['2025_weighted_ID_state_not_equal_2023_IPCO_BA']
          assert m['no_claim_of_actual_2023_fleet_skill']
          print('PAPER_S_DAILY_AND_IPCO_SOURCE_SCOPE_GATES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-s-daily-transfer-proxy-and-ipco-2023-shape-source-gates
          path: outputs/
          if-no-files-found: warn
