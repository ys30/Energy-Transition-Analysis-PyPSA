name: Colstrip hypothetical interface parameter sensitivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/colstrip-hypothetical-sensitivity.yml'
      - 'src/energy_transition/colstrip_hypothetical_sensitivity.py'
      - 'src/energy_transition/colstrip_capacity_arithmetic_screen.py'
permissions:
  contents: read
  actions: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . && python -m pip install 'pypsa>=0.30,<1.0' netcdf4
      - name: Reuse verified original Western network
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/western
          gh run download 41531397166 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/western
          test -s /tmp/western/real-western-base-network.nc
      - name: Seven hypothetical capacity-impedance network roundtrips
        run: python -m energy_transition.colstrip_hypothetical_sensitivity --network /tmp/western/real-western-base-network.nc --out outputs
      - name: Screen hypothetical nameplate against transformer MVA rating (not OPF)
        run: python -m energy_transition.colstrip_capacity_arithmetic_screen --folder outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-only-colstrip-sensitivity
          path: outputs/
