name: EIA-923 actual BA fuel generation 2024
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia923-ba-generation.yml'
      - 'src/energy_transition/eia923_ba_generation.py'
      - 'src/energy_transition/eia923_qualification.py'
      - 'src/energy_transition/eia860_eia923_ba_screen.py'
      - 'src/energy_transition/eia923_ba_capacity_ratio_gate.py'
      - 'src/energy_transition/eia923_withheld_generation_coverage.py'
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Extract official EIA-923 2024 plant fuel and BA generation
        run: python -m energy_transition.eia923_ba_generation --year 2024 --bas CISO BPAT --output outputs/eia923_generation
      - name: Qualify reconciled annual generation and report withheld rows
        run: |
          python -m energy_transition.eia923_qualification --reconciliation outputs/eia923_generation/annual_monthly_reconciliation.csv --output outputs/eia923_generation
      - name: Retrieve verified 2024 EIA-860 BA operating capacity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41349585538 -R "${{ github.repository }}" -n eia860-plant-ba-2024 -D /tmp/eia860
          test -s /tmp/eia860/eia860_ba_fuel_geographic_inventory_2024.csv
      - name: Cross-check qualified EIA-923 BA generation against actual EIA-860 nameplate
        run: |
          python -m energy_transition.eia860_eia923_ba_screen \
            --eia860 /tmp/eia860/eia860_ba_fuel_geographic_inventory_2024.csv \
            --eia923 outputs/eia923_generation/generation_qualified_ba_fuel.csv \
            --out outputs/eia923_generation/eia860_eia923_ba_comparison_2024.csv
      - name: Audit partial generation-to-nameplate screen ratios without labeling as calibrated CF
        run: |
          python -m energy_transition.eia923_ba_capacity_ratio_gate \
            --input outputs/eia923_generation/eia860_eia923_ba_comparison_2024.csv \
            --out outputs/eia923_generation/eia923_ba_capacity_ratio_gate_2024.csv
      - name: Quantify actual EIA-923 withheld annual generation before calibration
        run: |
          python -m energy_transition.eia923_withheld_generation_coverage \
            --qualified outputs/eia923_generation/generation_qualified_ba_fuel.csv \
            --out outputs/eia923_generation/eia923_withheld_annual_coverage_2024.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia923-ba-fuel-generation-2024
          path: outputs/eia923_generation/
          retention-days: 30
