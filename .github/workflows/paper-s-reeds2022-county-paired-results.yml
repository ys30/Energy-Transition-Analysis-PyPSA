name: Paper S ReEDS2022 county-native LP exact paired results
'on':
  pull_request:
    paths:
      - 'src/energy_transition/reeds2022_county_full_state_paired_results.py'
      - '.github/workflows/paper-s-reeds2022-county-paired-results.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  paired-source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3'
      - name: Retrieve successful 48-scenario county-source LP artifact
        run: |
          mkdir -p /tmp/source outputs
          gh run download 42965036275 --repo "${{ github.repository }}" \
            --name paper-s-reeds2022-county-native-48-LP-real-source-hypothetical-capacity \
            --dir /tmp/source
      - name: Compute exact 24 storage cases and 12 physical-integration sensitivities
        run: |
          PYTHONPATH=src python -m energy_transition.reeds2022_county_full_state_paired_results \
            --source /tmp/source/paper_s_reeds2022_county_full_state_2012_weather_48_LP.csv \
            --out outputs
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-reeds2022-county-native-exact-24-paired-storage-results
          path: outputs/
          if-no-files-found: error
