name: Paper S recover verified all15 annual transport aggregation only
'on':
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/paper-s-recover-annual-all15-aggregate.yml'
permissions:
  contents: read
  actions: read
jobs:
  aggregate-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11' 'h5py>=3.10' 'matplotlib>=3.7,<4' 'pytest>=8'
      - uses: actions/download-artifact@v4
        with:
          pattern: annual-input-only-*
          path: /tmp/partitions
          run-id: 44849783992
          github-token: ${{ github.token }}
      - name: Retrieve unchanged full 3x3 LP values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/frozen outputs
          gh run download 44209543001 --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-nine-design-point-wind-share-penetration-2880-new-lp-results \
            --dir /tmp/frozen
      - name: Fail closed on 15-year population and recompute final annual correlations
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np,pandas as pd
          from energy_transition.paper_s_input_only_annual_optimal import summarize
          from energy_transition.reeds2022_all_weather_year_720lp import WEATHER_YEARS
          from energy_transition.paper_s_input_only_weekly_optimal import KEY
          files=sorted(Path('/tmp/partitions').glob('*/Y1_annual_input_only_case_results.csv'))
          assert len(files)==12, f"Expected 12 audited batch CSVs, got {len(files)}"
          rows=pd.concat([pd.read_csv(f) for f in files],ignore_index=True)
          assert len(rows)==120 and not rows[KEY].duplicated().any()
          assert set(rows.weather_year)==set(WEATHER_YEARS)
          assert set(rows.state)=={'AZ','CO','ID','WY'}
          assert rows.source_hours.eq(8760).all()
          assert np.isfinite(rows.select_dtypes(include='number').to_numpy()).all()
          assert rows.filter(like='balance_residual_mwh').max().max()<1e-5
          for duration in (4,8):
              assert (rows[f'daily_{duration}h_delivered_mwh']<=rows[f'weekly_{duration}h_delivered_mwh']+1e-3).all()
              assert (rows[f'weekly_{duration}h_delivered_mwh']<=rows[f'annual_{duration}h_delivered_mwh']+1e-3).all()
          lp=pd.read_csv('/tmp/frozen/paper_s_design_grid_1080_duration_values.csv')
          joined,pairs,summary=summarize(rows,lp)
          assert len(joined)==120 and len(pairs)==60 and len(summary)==4
          assert summary.n_matched_weather_years.eq(15).all()
          out=Path('outputs')
          joined.to_csv(out/'Y1_all15_annual_mechanism_cases.csv',index=False)
          pairs.to_csv(out/'Y2_all15_paired_mechanism.csv',index=False)
          summary.to_csv(out/'Y3_all15_four_state_mechanism.csv',index=False)
          (out/'Y0_verified_full_year_manifest.json').write_text(json.dumps({
              'status':'ALL15_SOURCE_ANNUAL_MECHANISM_ARTIFACT_CHECK_PASS',
              'cases':120,'matched_year_pairs':60,'source_weather_years':15,
              'source_year_8760_hours':True,
              'daily_weekly_annual_feasible_set_nesting':True,
              'avoided_cost_or_field_profit_claimed':False,
              'all_previous_LP_or_Paper_C2_modified':False,
          },indent=2)+'\n')
          print('PAPER_S_ALL15_8760H_ANNUAL_MECHANISM_VERIFIED')
          PY
      - name: Test complete-population figure gates before publication rendering
        run: PYTHONPATH=src python -m pytest -q tests/test_paper_s_annual_mechanism_figures.py
      - name: Render publication-grade figures from audited complete annual source results
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_annual_mechanism_figures \
            --pairs outputs/Y2_all15_paired_mechanism.csv \
            --summary outputs/Y3_all15_four_state_mechanism.csv --out outputs
          test -s outputs/paper_s_annual_input_only_mechanism_heatmap.pdf
          test -s outputs/paper_s_annual_input_only_vs_lp_scatter.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-s-annual-full-15year-120-source-mechanism
          path: outputs/
          if-no-files-found: error
