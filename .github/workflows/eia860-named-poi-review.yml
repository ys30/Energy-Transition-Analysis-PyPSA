name: Enrich EIA-860 long-distance POI review with official plant names
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eia860-named-poi-review.yml'
      - 'src/energy_transition/eia860_named_poi_review.py'
      - 'tests/test_eia860_named_poi_review.py'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source-identity and non-approval invariants
        run: |
          python -m pip install pandas numpy pytest
          PYTHONPATH=src python -m pytest tests/test_eia860_named_poi_review.py -q
      - name: Restore original EIA source coordinates and CI-verified POI queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/eia-source /tmp/poi-triage
          gh run download 41772568847 -R "${{ github.repository }}" \
            -n eia860-2024-generator-level-bus-candidate-staging -D /tmp/eia-source
          gh run download 41773439738 -R "${{ github.repository }}" \
            -n eia860-2024-generator-plant-poi-review-triage -D /tmp/poi-triage
          CANDIDATES=$(find /tmp/eia-source -type f -name official_geographic_plant_bus_candidates.csv -print -quit)
          PLANTS=$(find /tmp/poi-triage -type f -name all_operating_plant_poi_triage.csv -print -quit)
          test -n "$CANDIDATES" && test -s "$CANDIDATES"
          test -n "$PLANTS" && test -s "$PLANTS"
          echo "EIA_CANDIDATES=$CANDIDATES" >> "$GITHUB_ENV"
          echo "EIA_TRIAGE=$PLANTS" >> "$GITHUB_ENV"
      - name: Enrich distant plants with exact official names and both source coordinates
        run: |
          PYTHONPATH=src python -m energy_transition.eia860_named_poi_review \
            --plants "$EIA_TRIAGE" \
            --candidates "$EIA_CANDIDATES" \
            --out-dir outputs/official_named_poi_review
      - name: Verify full 63-plant conservation and no physical connection claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/official_named_poi_review/official_plant_poi_source_enrichment.json').read_text())
          assert r['distant_plant_rows']==63
          assert r['candidate_bus_count']==15
          assert abs(r['historic_distant_nameplate_mw']-5831.9)<1e-5
          assert r['highest_nameplate_candidate_bus']=='2053003'
          assert r['highest_nameplate_bus_plant_count']==21
          assert abs(r['highest_nameplate_bus_historic_mw']-2847.6)<1e-5
          assert r['official_coordinate_and_candidate_key_join_verified']
          assert r['electrical_POI_documents_verified']==0
          assert r['approved_generator_bus_connections']==0
          assert r['future_2030_2050_empirical_generator_mapping_admitted'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia860-2024-official-named-high-risk-plant-points
          path: outputs/official_named_poi_review/
          if-no-files-found: warn
