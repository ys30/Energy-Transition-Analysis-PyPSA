name: EIA-923 data normalization and validation tests
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Official EIA-923 / EIA-860 inventory year'
        required: true
        type: choice
        options:
          - '2024'
          - '2023'
      official_xlsx_url:
        description: 'Optional official eia.gov EIA-923 ZIP URL (defaults to EIA annual archive)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/eia923-validate.yml'
      - 'pyproject.toml'
      - 'src/energy_transition/eia923_normalize.py'
      - 'src/energy_transition/eia923_validation.py'
      - 'src/energy_transition/eia860_supported_subset.py'
      - 'src/energy_transition/eia923_download.py'
      - 'tests/test_eia923_download.py'
      - 'tests/test_eia923_normalize.py'
      - 'tests/test_eia923_validation.py'
      - 'src/energy_transition/eia860_capacity.py'
      - 'src/energy_transition/eia860_plant_ba.py'
      - 'src/energy_transition/eia930_west.py'
      - 'tests/test_eia860_capacity.py'
      - 'tests/test_eia930_west.py'
      - 'tests/test_eia930_representative_solver_guards.py'
      - 'tests/test_eia930_capacity_scenario.py'
      - 'tests/test_eia860_supported_subset.py'
      - 'tests/test_eia860_plant_ba.py'
concurrency:
  group: eia923-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  validate-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: EIA-923 normalization and validation regression tests
        run: python -m pytest -q tests/test_eia923_download.py tests/test_eia923_normalize.py tests/test_eia923_validation.py tests/test_eia930_capacity_scenario.py tests/test_eia930_west.py tests/test_eia930_representative_solver_guards.py tests/test_eia860_capacity.py tests/test_eia860_supported_subset.py tests/test_eia860_plant_ba.py
  # The official annual EIA-923 workbook and matching solved model metrics
  # are required for empirical validation. The workflow intentionally does
  # not label unit tests as an observed-data validation.
  official-download:
    needs: validate-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Download official EIA-923 workbook with SHA256 audit
        env:
          OFFICIAL_URL: ${{ inputs.official_xlsx_url }}
          YEAR: ${{ inputs.year || '2024' }}
        run: |
          if [ -z "$OFFICIAL_URL" ]; then
            OFFICIAL_URL="https://www.eia.gov/electricity/data/eia923/archive/xls/f923_${YEAR}.zip"
          fi
          python -m energy_transition.eia923_download \
            --url "$OFFICIAL_URL" --year "$YEAR" \
            --output "outputs/eia923/eia923_${YEAR}.xlsx"
      - name: Normalize official EIA-923 workbook
        env:
          YEAR: ${{ inputs.year || '2024' }}
        run: |
          python -m energy_transition.eia923_normalize \
            --xlsx "outputs/eia923/eia923_${YEAR}.xlsx" \
            --year "$YEAR" --allow-incomplete --output outputs/eia923
      - name: Summarize normalized official EIA-923 coverage audit
        env:
          YEAR: ${{ inputs.year || '2024' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          year = os.environ["YEAR"]
          source = Path(f"outputs/eia923/eia923_source_{year}.json")
          audit = json.loads(source.read_text())
          keys = (
              "observations", "included_net_generation_mwh",
              "included_abs_generation_mwh", "excluded_monthly_cells",
              "excluded_source_rows", "excluded_valid_numeric_cells",
              "excluded_valid_numeric_net_generation_mwh",
              "excluded_valid_numeric_abs_generation_mwh",
              "unmapped_fuel_cells", "unmapped_fuel_net_generation_mwh",
              "unmapped_fuel_abs_generation_mwh", "coverage_caveat",
          )
          lines = ["## Official EIA-923 normalization audit", ""]
          lines.extend(f"- **{k}**: {audit.get(k, 'not recorded')}" for k in keys)
          report = chr(10).join(lines) + chr(10)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(report)
          PY
      - name: Gate EIA-923 usable generation share for downstream interpretation
        env:
          YEAR: ${{ inputs.year || '2024' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          year = os.environ["YEAR"]
          audit = json.loads(Path(f"outputs/eia923/eia923_source_{year}.json").read_text())
          import math
          included = float(audit["included_abs_generation_mwh"])
          lost = float(audit["excluded_valid_numeric_abs_generation_mwh"])
          unknown = float(audit["unmapped_fuel_abs_generation_mwh"])
          if not all(math.isfinite(x) and x >= 0 for x in (included, lost, unknown)):
              raise ValueError("Invalid EIA-923 normalization coverage totals")
          print(f"Included abs MWh: {included:,.1f}")
          print(f"Excluded valid monthly absolute MWh: {lost:,.1f}")
          print(f"Unmapped-fuel abs MWh (may overlap exclusions): {unknown:,.1f}")
          print("These diagnostics are not a certified completeness fraction.")
          if included <= 0:
              raise ValueError("No included generation to support empirical comparison")
          if lost > 0.05 * included:
              print("::warning::Excluded valid generation exceeds 5% of included generation; review incomplete-record policy.")
          if unknown > 0.05 * included:
              print("::warning::Unmapped fuel generation exceeds 5% of included generation; review fuel harmonization.")
          PY
      - name: Show EIA-923 schema diagnostics if normalization failed
        if: failure()
        run: |
          if ls outputs/eia923/eia923_schema_diagnostic_*.json >/dev/null 2>&1; then
            python - <<'PY'
          import glob, json
          for name in glob.glob("outputs/eia923/eia923_schema_diagnostic_*.json"):
              data = json.load(open(name))
              print("Sheets:", data["workbook_sheets"])
              for sheet, inspected in data["inspected_headers"].items():
                  print("Sheet:", sheet)
                  for entry in inspected:
                      print("Row:", entry["header_row_zero_based"], "columns:", entry["first_columns"])
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia923-official-${{ inputs.year || '2024' }}
          path: outputs/eia923/
          retention-days: 30
  observed-versus-model:
    needs: official-download
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      YEAR: ${{ inputs.year || '2024' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[model,dev]'
      - uses: actions/download-artifact@v4
        with:
          name: eia923-official-${{ inputs.year || '2024' }}
          path: outputs/eia923
      - name: Check EIA API secret
        run: |
          if [ -z "$EIA_API_KEY" ]; then
            echo "::error::EIA_API_KEY secret required for observed EIA-930 demand"
            exit 1
          fi
      - name: Record empirical validation environment
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import json, os, platform
          from pathlib import Path
          packages = ("python", "pypsa", "pandas", "numpy", "scipy", "highspy")
          versions = {"python": platform.python_version()}
          for package in packages:
              if package == "python":
                  continue
              try:
                  versions[package] = md.version(package)
              except md.PackageNotFoundError:
                  versions[package] = "not installed"
          out = Path("outputs/eia923_validation")
          out.mkdir(parents=True, exist_ok=True)
          (out / "environment.json").write_text(json.dumps({
              "versions": versions,
              "commit": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
          }, indent=2) + chr(10))
          print(json.dumps(versions, indent=2))
          PY
      - name: Download and audit same-year EIA-860 operating generators
        run: |
          python -m energy_transition.eia860_capacity --year "$YEAR" --output outputs/eia860
          python -m energy_transition.eia860_plant_ba \
            --year "$YEAR" \
            --generators "outputs/eia860/western_state_generators_${YEAR}.csv" \
            --output outputs/eia860
      - name: Audit EIA-860 storage and unsupported technologies outside limited PyPSA model
        run: |
          python -m energy_transition.eia860_supported_subset \
            --capacity "outputs/eia860/ba_operating_nameplate_by_fuel_${YEAR}.csv" \
            --bas CISO BPAT --output outputs/eia860_model_subset
      - name: Solve PyPSA with observed demand and explicitly limited EIA-860 carriers
        run: |
          python -m energy_transition.eia930_west \
            --years "$YEAR" \
            --bas CISO BPAT \
            --eia860-capacity "outputs/eia860_model_subset/ba_operating_nameplate_by_fuel_${YEAR}.csv" \
            --output outputs/eia930_west
      - name: Audit annual demand and renewable temporal coverage
        env:
          YEAR: ${{ inputs.year || '2024' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          year = int(os.environ["YEAR"])
          root = Path("outputs/eia930_west") / str(year)
          manifests = sorted(root.rglob("*coverage*.json"))
          print(f"Coverage manifests found: {len(manifests)}")
          for manifest in manifests:
              data = json.loads(manifest.read_text())
              print(f"{manifest}: {json.dumps(data, sort_keys=True)[:2500]}")
          if not manifests:
              print("::warning::No separate annual hourly coverage manifest found; annual dispatch comparison alone does not certify 8784-hour input completeness.")
          PY
      - name: Record model and input artifact provenance
        env:
          YEAR: ${{ inputs.year || '2024' }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          year = os.environ["YEAR"]
          files = {
              "eia923_normalized": Path(f"outputs/eia923/eia923_normalized_{year}.csv"),
              "eia860_crosswalk": Path(f"outputs/eia860/plant_ba_crosswalk_{year}.csv"),
              "eia860_supported_capacity": Path(f"outputs/eia860_model_subset/ba_operating_nameplate_by_fuel_{year}.csv"),
              "pypsa_metrics": Path(f"outputs/eia930_west/{year}/metrics.json"),
          }
          checksums = {}
          for name, path in files.items():
              if not path.is_file():
                  raise FileNotFoundError(f"Missing required empirical validation artifact: {path}")
              checksums[name] = {"path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          manifest = {
              "analysis_year": int(year),
              "commit": os.environ.get("GITHUB_SHA", subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "inputs": checksums,
              "interpretation": "Checksums establish provenance, not empirical completeness or model validity.",
          }
          out = Path("outputs/eia923_validation")
          out.mkdir(parents=True, exist_ok=True)
          (out / f"input_provenance_{year}.json").write_text(json.dumps(manifest, indent=2) + chr(10))
          PY
      - name: Verify annual model metrics match requested analysis year
        env:
          YEAR: ${{ inputs.year || '2024' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          year = int(os.environ["YEAR"])
          metrics_path = Path(f"outputs/eia930_west/{year}/metrics.json")
          metrics = json.loads(metrics_path.read_text())
          if "analysis_year" not in metrics:
              raise ValueError("Model metrics missing required analysis_year")
          if int(metrics["analysis_year"]) != year:
              raise ValueError(
                  f"Model analysis_year={metrics['analysis_year']} does not match {year}"
              )
          if "year" in metrics and int(metrics["year"]) != year:
              raise ValueError(f"Model metrics year={metrics['year']} does not match {year}")
          dispatch = metrics.get("dispatch_mwh_by_carrier")
          if not isinstance(dispatch, dict) or not dispatch:
              raise ValueError("Annual model metrics missing dispatch_mwh_by_carrier")
          print(f"Requested analysis year: {year}; model carrier count: {len(dispatch)}")
          import calendar
          import math
          expected = 8784 if calendar.isleap(year) else 8760
          representation = metrics.get("temporal_representation")
          if representation == "288_weighted_month_hour_snapshots_not_chronological_hourly":
              if int(metrics.get("snapshot_count", -1)) != 288:
                  raise ValueError("Representative-month-hour model must have 288 snapshots")
              represented_hours = float(metrics.get("represented_hours", float("nan")))
              if not math.isfinite(represented_hours) or abs(represented_hours - expected) > 1e-6:
                  raise ValueError("Representative model weights do not cover annual calendar hours")
              if metrics.get("representative_hour_weight_sum_valid") is not True:
                  raise ValueError("Representative-hour weight-integrity indicator missing or false")
              print(f"Verified 288 representative snapshots weighted to {expected} hours; NOT chronological hourly validation.")
          else:
              raise ValueError(
                  f"Unexpected or missing temporal_representation={representation!r}; "
                  "this validation workflow requires explicit 288 weighted month-hour snapshots"
              )
          PY
      - name: Compare observed EIA-923 generation against PyPSA dispatch
        run: |
          python -m energy_transition.eia923_validation \
            --eia923 "outputs/eia923/eia923_normalized_${YEAR}.csv" \
            --crosswalk "outputs/eia860/plant_ba_crosswalk_${YEAR}.csv" \
            --metrics "outputs/eia930_west/${YEAR}/metrics.json" \
            --year "$YEAR" \
            --bas CISO BPAT \
            --output outputs/eia923_validation
      - name: Summarize observed versus modeled annual generation
        env:
          YEAR: ${{ inputs.year || '2024' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          year = os.environ["YEAR"]
          p = Path(f"outputs/eia923_validation/eia923_validation_manifest_{year}.json")
          audit = json.loads(p.read_text())
          keys = (
              "bas", "comparison_carriers",
              "selected_ba_mapped_plant_count_by_ba",
              "selected_ba_mapped_generation_net_mwh_by_ba",
              "selected_ba_mapped_generation_abs_mwh_by_ba",
              "selected_ba_observed_generation_by_ba_and_fuel_net_mwh",
              "negative_net_generation_rows_selected_ba",
              "negative_net_generation_rows_unmapped_national",
              "selected_ba_observed_net_generation_all_fuels_mwh",
              "selected_ba_observed_net_generation_comparable_fuels_mwh",
              "selected_ba_observed_generation_comparable_fraction_abs",
              "national_plant_id_match_fraction_abs_not_ba_coverage",
              "unmapped_national_generation_abs_mwh",
              "selected_ba_completeness",
              "observed_only_fuels_excluded_from_comparison_mwh",
              "interpretation",
          )
          lines = ["## EIA-923 versus PyPSA annual comparison audit", ""]
          lines.extend(f"- **{key}**: {audit.get(key, 'not recorded')}" for key in keys)
          import csv
          comparison = Path(f"outputs/eia923_validation/eia923_vs_pypsa_{year}.csv")
          with comparison.open(newline="") as f:
              records = list(csv.DictReader(f))
          if not records:
              raise ValueError("No observed-versus-modeled comparison records")
          lines.extend(["", "### Comparable annual generation by carrier", "",
                        "| Carrier | Observed MWh | Modeled MWh | Difference MWh | Relative error |",
                        "|---|---:|---:|---:|---:|"])
          import math
          for record in records:
              carrier = record["carrier"]
              observed = float(record["observed_eia923_net_generation_mwh"])
              modeled = float(record["modeled_pypsa_dispatch_mwh"])
              difference = float(record["model_minus_observed_mwh"])
              error = record["relative_error_if_nonzero"]
              if not all(math.isfinite(v) for v in (observed, modeled, difference)):
                  raise ValueError(f"Nonfinite annual comparison value for carrier {carrier}")
              if error:
                  numeric_error = float(error)
                  if not math.isfinite(numeric_error):
                      raise ValueError(f"Nonfinite annual relative error for carrier {carrier}")
                  error_text = f"{100 * numeric_error:+.1f}%"
              else:
                  error_text = "n/a"
              lines.append(f"| {carrier} | {observed:,.0f} | {modeled:,.0f} | {difference:+,.0f} | {error_text} |")
          lines.extend(["", "### Evidence qualification", "",
                        f"- **Selected-BA completeness:** {audit.get('selected_ba_completeness', 'unverified')}",
                        f"- **Observed comparable-fuel absolute MWh fraction:** {audit.get('selected_ba_observed_generation_comparable_fraction_abs', 'not recorded')}",
                        f"- **Unmapped national plant count:** {audit.get('unmapped_national_plant_count', 'not recorded')}",
                        f"- **Unmapped national absolute generation MWh:** {audit.get('unmapped_national_generation_abs_mwh', 'not recorded')}",
                        "- These quantities do not prove that all selected-BA plants were captured."])
          lines.extend(["", "### Selected BA source coverage (mapped plants only)", "",
                        "| BA | Mapped plants | Net generation MWh | Absolute generation MWh |",
                        "|---|---:|---:|---:|"])
          counts = audit.get("selected_ba_mapped_plant_count_by_ba", {})
          net = audit.get("selected_ba_mapped_generation_net_mwh_by_ba", {})
          absolute = audit.get("selected_ba_mapped_generation_abs_mwh_by_ba", {})
          for ba in audit["bas"]:
              if ba not in counts or ba not in net or ba not in absolute:
                  raise ValueError(f"Missing source coverage for requested BA {ba}")
              lines.append(f"| {ba} | {int(counts[ba]):,} | {float(net[ba]):,.0f} | {float(absolute[ba]):,.0f} |")
          lines.extend(["", "### Observed EIA-923 generation by BA and fuel", "",
                        "| BA | Fuel | Net generation MWh |",
                        "|---|---|---:|"])
          breakdown = audit.get("selected_ba_observed_generation_by_ba_and_fuel_net_mwh", {})
          for ba in audit["bas"]:
              if ba not in breakdown:
                  raise ValueError(f"Missing BA-by-fuel observed generation for {ba}")
              for fuel, mwh in sorted(breakdown[ba].items()):
                  lines.append(f"| {ba} | {fuel} | {float(mwh):,.0f} |")
          lines.extend(["", "### Validation boundaries", "",
                        "- Model dispatch uses 288 calendar-weighted month-hour snapshots, not chronological hourly dispatch.",
                        "- Annual modeled-versus-observed deviations are diagnostics, not calibrated forecast errors.",
                        "- Mapped EIA-923 plants do not establish complete balancing-authority coverage.",
                        "- Missing renewable observations and their gap-fill scenarios must be assessed separately.",
                        "- A passing workflow establishes execution reproducibility, not independent empirical calibration.",
                        "", "Comparison is diagnostic only; plant-to-BA completeness is not certified."])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(chr(10).join(lines) + chr(10))
          print(chr(10).join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia923-vs-pypsa-${{ inputs.year || '2024' }}
          path: |
            outputs/eia923_validation/
            outputs/eia860/
            outputs/eia860_model_subset/
            outputs/eia930_west/
          retention-days: 30
