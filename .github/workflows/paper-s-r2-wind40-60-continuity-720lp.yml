name: Paper S R2 wind 40 and 60 percent continuity 720 new LP
'on':
  pull_request:
    paths:
      - 'src/energy_transition/paper_s_R2_wind40_60_continuity_720lp.py'
      - '.github/workflows/paper-s-r2-wind40-60-continuity-720lp.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  continuity-audit-new-lp:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen scientific LP dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11' 'h5py>=3.10'
      - name: Retrieve original 2012-county wind/PV source files with publisher MD5 pins
        run: |
          set -euo pipefail
          mkdir -p /tmp/paper-s/wind /tmp/paper-s/pv /tmp/paper-s/eia outputs
          download_zenodo_verified() {
            local record="$1" filename="$2" destination="$3" expected="$4" attempt url
            for attempt in 1 2 3 4; do
              for url in \
                "https://zenodo.org/records/${record}/files/${filename}?download=1" \
                "https://zenodo.org/api/records/${record}/files/${filename}/content"; do
                rm -f "$destination"
                if curl -fL --show-error --silent --retry 2 --retry-all-errors \
                  --retry-delay 15 --connect-timeout 30 --max-time 3600 \
                  "$url" -o "$destination"; then
                  if echo "$expected  $destination" | md5sum --check; then return 0; fi
                fi
              done
              if [ "$attempt" -lt 4 ]; then sleep 45; fi
            done
            echo "::error::Original publisher source unavailable or mismatch: $filename"
            return 1
          }
          download_zenodo_verified 18422200 cf_wind-ons_reference_county.h5 \
            /tmp/paper-s/wind.h5 0670813d0a18b688d698ca24cf67fb92
          download_zenodo_verified 18407660 cf_upv_reference_county.h5 \
            /tmp/paper-s/pv.h5 aba834ea4c592023bca47de2ba79e7ec
          download_zenodo_verified 18422200 sc_wind-ons_reference_county.csv \
            /tmp/paper-s/wind_sc.csv 49ab4e41dc386453b5fd32e5810774d4
          download_zenodo_verified 18407660 sc_upv_reference_county.csv \
            /tmp/paper-s/pv_sc.csv e10b1a64f3a67d163e739b735938eb78
      - name: Retrieve previously authenticated reference-hour and county-weight sources
        run: |
          set -euo pipefail
          gh run download 42962740548 --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-reeds2022-original-2012-county-wind-hdf5-source-audit \
            --dir /tmp/paper-s/wind
          gh run download 42962740548 --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-reeds2022-original-2012-county-pv-hdf5-source-audit \
            --dir /tmp/paper-s/pv
          gh run download 43124063185 --repo "${GITHUB_REPOSITORY}" \
            --name paper-s-eia860-2025-observed-fleet-versus-reeds-county-potential-weight-comparison \
            --dir /tmp/paper-s/eia
          test -s /tmp/paper-s/eia/paper_s_eia860_2025_vs_reeds_county_spatial_weights.csv
          for attempt in 1 2 3 4; do
            if curl -fL --show-error --silent --retry 3 --retry-all-errors \
              --retry-delay 20 --connect-timeout 30 --max-time 900 \
              'https://zenodo.org/records/18461543/files/demand_EFS_REFERENCE.h5?download=1' \
              -o /tmp/paper-s/demand.h5 \
              && echo '7b2055d43200744a16a8c4fed68b1a17  /tmp/paper-s/demand.h5' | md5sum --check; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep 45
          done
      - name: Execute 720 truly new LPs at ratio2 shares 40% and 60%
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_R2_wind40_60_continuity_720lp \
            --wind-h5 /tmp/paper-s/wind.h5 --pv-h5 /tmp/paper-s/pv.h5 \
            --wind-sc /tmp/paper-s/wind_sc.csv --pv-sc /tmp/paper-s/pv_sc.csv \
            --county-shares /tmp/paper-s/eia/paper_s_eia860_2025_vs_reeds_county_spatial_weights.csv \
            --wind-ref /tmp/paper-s/wind/reeds2022_wind_2012_four_state_instantaneous_cf.csv \
            --pv-ref /tmp/paper-s/pv/reeds2022_pv_2012_four_state_instantaneous_cf.csv \
            --demand-h5 /tmp/paper-s/demand.h5 --out outputs
      - name: Validate complete continuity grid and exact input accounting
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,pandas as pd
          p=Path('outputs')
          m=json.loads((p/'paper_s_R2_wind40_60_manifest.json').read_text())
          x=pd.read_csv(p/'paper_s_R2_wind40_60_720_NEW_lp.csv')
          a=pd.read_csv(p/'paper_s_R2_wind40_60_240_input_sha256.csv')
          s=pd.read_csv(p/'paper_s_R2_wind40_60_8_cell_summary.csv')
          assert len(x)==720 and len(a)==240 and len(s)==8
          assert set(x.wind_share_ac)=={.4,.6}
          assert x.renewable_peak_ratio.eq(2.).all()
          assert x.solver_status.eq('optimal').all()
          assert x.max_equality_residual_mwh.max()<1e-5
          assert (a.groupby(['weather_year','state','county_weight_scheme'])
                    .demand_sha256.nunique()==1).all()
          assert (a.groupby(['weather_year','state','county_weight_scheme'])
                    .wind_input_sha256.nunique()==1).all()
          assert (a.groupby(['weather_year','state','county_weight_scheme'])
                    .pv_input_sha256.nunique()==1).all()
          assert not m['original_3x3_LP_changed']
          print("PAPER_S_R2_40_60_SOURCE_AND_720_NEW_LP_VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-s-R2-wind40-60-continuity-720-new-LP
          path: outputs/
          if-no-files-found: warn
