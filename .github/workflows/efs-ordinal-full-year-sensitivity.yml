name: EFS full-year ordinal-only supply sensitivity (illustrative)
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/efs-ordinal-full-year-sensitivity.yml'
      - 'src/energy_transition/efs_ordinal_full_year_supply_sensitivity.py'
      - 'tests/test_efs_ordinal_full_year_supply_sensitivity.py'
permissions:
  contents: read
  actions: read
jobs:
  full-year-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal numerical dependencies
        run: python -m pip install numpy pandas pytest
      - name: Check ordinal-only supply accounting and negative tests
        run: PYTHONPATH=src python -m pytest tests/test_efs_ordinal_full_year_supply_sensitivity.py -q
      - name: Retrieve previously verified EFS seven-state hourly zonal demand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/efs
          gh run download 41281576025 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/efs
          test -s /tmp/efs/efs-real-laf-zonal-pilot.csv.gz
      - name: Compute 2030 2040 and 2050 8760-hour local-ordinal-only supply scenarios
        run: |
          PYTHONPATH=src python -m energy_transition.efs_ordinal_full_year_supply_sensitivity \
            --zonal /tmp/efs/efs-real-laf-zonal-pilot.csv.gz \
            --out-csv outputs/efs_ordinal_supply_full_year_scenarios.csv \
            --out-json outputs/efs_ordinal_supply_full_year_metadata.json
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          df=pd.read_csv('outputs/efs_ordinal_supply_full_year_scenarios.csv')
          m=json.loads(Path('outputs/efs_ordinal_supply_full_year_metadata.json').read_text())
          assert len(df)==9
          assert set(df.planning_year)=={2030,2040,2050}
          assert set(df.renewable_nameplate_to_local_zone_peak_ratio)=={0.3,0.6,0.9}
          assert set(df.source_ordinal_hours_per_zone)=={8760}
          assert ((df.real_efs_pilot_demand_mwh-df.illustrative_renewable_dispatch_mwh-df.illustrative_firm_dispatch_mwh).abs()<0.01).all()
          assert m['physical_western_opf_admitted'] is False
          assert m['utc_weather_alignment_verified'] is False
          for row in df.sort_values(['planning_year','renewable_nameplate_to_local_zone_peak_ratio']).itertuples(index=False):
              print(f'SCENARIO_RESULT year={row.planning_year} renewable_peak_ratio={row.renewable_nameplate_to_local_zone_peak_ratio:.1f} '
                    f'zones={row.zonal_systems} demand_TWh={row.real_efs_pilot_demand_mwh/1e6:.6f} '
                    f'renewable_share={row.illustrative_renewable_energy_share:.6f} '
                    f'curtailed_GWh={row.illustrative_renewable_curtailment_mwh/1000:.6f} '
                    f'variable_cost_billion_usd={row.illustrative_variable_cost_usd/1e9:.6f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efs-seven-state-8760h-illustrative-ordinal-supply-screen
          path: |
            outputs/efs_ordinal_supply_full_year_scenarios.csv
            outputs/efs_ordinal_supply_full_year_metadata.json
          if-no-files-found: warn
