name: Paper S integrated source-verified Word manuscript review build
'on':
  pull_request:
    paths:
      - 'scripts/build_paper_s_review_docx.py'
      - 'scripts/polish_paper_s_review_docx.py'
      - '.github/workflows/paper-s-integrated-manuscript-docx.yml'
      - 'docs/PAPER_S_INTEGRATED_ENGLISH_MANUSCRIPT_V1_2026-11-12.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  generate-source-audited-word-manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stable Word manuscript builder and image inspection
        run: python -m pip install 'python-docx>=1.1,<2' 'Pillow>=10,<13' 'matplotlib>=3.7,<4'
      - name: Retrieve only verified original four-state weather×siting figure artifact
        run: |
          set -eu
          mkdir -p figures outputs
          gh run download 43288856607 --repo "${{ github.repository }}" \
            --name paper-s-96lp-cross-weather-year-county-siting-publication-figures \
            --dir figures
          test -s figures/paper_s_96lp_weather_x_county_siting_main_figure.png
          test -s figures/paper_s_96lp_weather_x_siting_difference_heatmap.png
      - name: Generate self-contained Word manuscript from audited source narrative and figures
        run: |
          python scripts/build_paper_s_review_docx.py \
            --source docs/PAPER_S_INTEGRATED_ENGLISH_MANUSCRIPT_V1_2026-11-12.md \
            --figure-dir figures \
            --out outputs/Paper_S_Integrated_Review_Manuscript_2026-11-13.docx
          python scripts/polish_paper_s_review_docx.py \
            --input outputs/Paper_S_Integrated_Review_Manuscript_2026-11-13.docx \
            --out outputs/Paper_S_Integrated_Review_Manuscript_2026-11-13.docx
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          p=Path('outputs/Paper_S_Integrated_Review_Manuscript_2026-11-13.docx')
          assert p.stat().st_size>150000
          d=Document(p)
          joined='\n'.join(x.text for x in d.paragraphs)
          assert len(d.inline_shapes)==5 and len(d.tables)==1
          for phrase in ('192 LP','10.955','9.868','11.900','10.876',
                         '15 of 16','References and original data sources','Reviewer-facing scope note',
                         'not robust','source-audited'):
              assert phrase.lower() in joined.lower(),phrase
          assert not any('Manuscript completion items' in x.text for x in d.paragraphs)
          assert '\\frac' not in joined
          assert joined.index('Verified manuscript figures')<joined.index('References and original data sources')
          assert 'Table 1. Four historical ReEDS weather years' in joined
          print('PAPER_S_FULL_REVIEW_DOCX_EQUATIONS_TABLE_FIGURES_QA_ACCEPTED',p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-2026-11-13-source-audited-integrated-review-manuscript-docx
          path: outputs/Paper_S_Integrated_Review_Manuscript_2026-11-13.docx
          if-no-files-found: error
