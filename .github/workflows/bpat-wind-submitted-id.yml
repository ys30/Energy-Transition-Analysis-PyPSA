name: BPAT wind EIA930A alternative generator ID audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bpat-wind-submitted-id.yml'
      - 'src/energy_transition/bpat_wind_submitted_id_audit.py'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' openpyxl
      - uses: actions/download-artifact@v4
        with:
          name: bpat-wind-cross-schedule-2024
          run-id: 41090860630
          github-token: ${{ github.token }}
          path: inputs/cross
      - run: |
          python -m energy_transition.bpat_wind_submitted_id_audit \
            --unlisted inputs/cross/bpat_unlisted_wind_generator_cross_schedule.csv \
            --output outputs/submitted_ids
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpat-wind-submitted-id-2024
          path: outputs/submitted_ids/
