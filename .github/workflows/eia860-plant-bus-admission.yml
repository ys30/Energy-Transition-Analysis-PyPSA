name: EIA860 plant-to-bus evidence admission (candidate-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eia860-plant-bus-admission.yml'
      - 'src/energy_transition/eia860_plant_bus_evidence_gate.py'
      - 'src/energy_transition/eia860_plant_bus_candidates.py'
      - 'src/energy_transition/eia860_plant_coordinates.py'
      - 'src/energy_transition/eia860_plant_bus_distance_qc.py'
      - 'src/energy_transition/eia860_operating_plant_bus_screen.py'
      - 'src/energy_transition/eia860_operating_bus_review_priority.py'
      - 'src/energy_transition/eia860_poi_document_review_queue.py'
      - 'src/energy_transition/eia860_facility_lead_network_audit.py'
      - 'src/energy_transition/eia860_facility_voltage_bus_candidates.py'
      - 'src/energy_transition/eia860_source_bus_identity_trace.py'
      - 'src/energy_transition/eia860_source_substation_group_audit.py'
      - 'docs/eia860_official_facility_document_leads_2024.csv'
      - 'docs/western_source_network_provenance.json'
permissions:
  contents: read
  actions: read
jobs:
  evidence-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geographic and network audit tools
        run: |
          python -m pip install -e '.[dev]' openpyxl xlrd
          python -m pip install 'pypsa>=0.30,<1.0'
      - name: Enforce synthetic-network source lineage before real-generator comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/western_source_network_provenance.json').read_text())
          assert data['upstream_commit']=='338af9912addbaf038c6098fe27e1e6ef099d8aa'
          assert 'USATestSystem.zip' in data['source_archive']
          assert 'synthetic' in data['source_network_family'].lower()
          assert data['utility_authenticated_electrical_facility_identities'] is False
          assert data['eia860_electrical_interconnection_approved'] is False
          assert data['empirical_western_opf_ready'] is False
          print('Topology provenance: ',data['source_network_family'])
          print('Synthetic bus/sub_id IDs are not utility-certified physical POI identifiers')
          PY
      - name: Retrieve previously validated Western network artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/western
          gh run download 41531397166 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/western
          test -s /tmp/western/real-western-base-network.nc
      - name: Extract official EIA860 2024 plant coordinates
        run: |
          python -m energy_transition.eia860_plant_coordinates --year 2024 --out-dir outputs/eia860_plant_bus
      - name: Produce geographic candidates against original real Western buses
        run: |
          python -m energy_transition.eia860_plant_bus_candidates \
            --plants outputs/eia860_plant_bus/official_eia860_plant_coordinates_2024.csv \
            --network /tmp/western/real-western-base-network.nc \
            --out outputs/eia860_plant_bus/eia860_2024_geographic_bus_candidates.csv
      - name: Audit geographic candidate distance bands and exceptional plants
        run: |
          python -m energy_transition.eia860_plant_bus_distance_qc \
            --candidates outputs/eia860_plant_bus/eia860_2024_geographic_bus_candidates.csv \
            --out-dir outputs/eia860_plant_bus \
            --year 2024
      - name: Cross-check candidate and coordinate coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/eia860_plant_bus')
          coordinates=json.loads((root/'official_eia860_plant_coordinates_2024.json').read_text())
          candidate=json.loads((root/'eia860_2024_geographic_bus_candidates.json').read_text())
          distance=json.loads((root/'eia860_plant_bus_distance_qc_2024.json').read_text())
          assert coordinates['valid_geographic_coordinates']==candidate['candidate_pairs']
          assert candidate['candidate_pairs']==distance['candidate_plants']
          assert distance['electrical_connections_verified']==0
          assert distance['plant_bus_assignment_approved'] is False
          assert candidate['more_than_50km']==distance['over_50km_count']
          print('Verified source-to-candidate-to-distance inventory conservation:',distance['candidate_plants'])
          PY
      - name: Download validated 2024 EIA860 generator-to-BA inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/eia860-generators
          gh run download 41349585538 -R "${{ github.repository }}" -n eia860-plant-ba-2024 -D /tmp/eia860-generators
          test -s /tmp/eia860-generators/generator_ba_audit_2024.csv
      - name: Separate operating BA-matched plant candidates from all-status geographic plant candidates
        run: |
          python -m energy_transition.eia860_operating_plant_bus_screen \
            --candidates outputs/eia860_plant_bus/eia860_2024_geographic_bus_candidates.csv \
            --generators /tmp/eia860-generators/generator_ba_audit_2024.csv \
            --out outputs/eia860_plant_bus/eia860_2024_op_plant_candidate_screen.csv
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/eia860_plant_bus')
          d=json.loads((root/'eia860_2024_op_plant_candidate_screen.json').read_text())
          assert d['candidate_plants_all_statuses']>0
          assert d['qualified_operating_generator_rows_on_candidate_plants']>0
          assert d['approved_electrical_connections']==0
          assert d['full_western_opf_ready'] is False
          PY
      - name: Rank operating plant candidate evidence reviews by capacity and distance
        run: |
          python -m energy_transition.eia860_operating_bus_review_priority \
            --screen outputs/eia860_plant_bus/eia860_2024_op_plant_candidate_screen.csv \
            --out outputs/eia860_plant_bus/eia860_2024_op_plant_bus_review_priority.csv
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/eia860_plant_bus')
          screening=json.loads((root/'eia860_2024_op_plant_candidate_screen.json').read_text())
          priority=json.loads((root/'eia860_2024_op_plant_bus_review_priority.json').read_text())
          assert screening['candidate_plants_with_qualified_op_generator']==priority['screened_operating_plants']
          assert screening['qualified_operating_generator_rows_on_candidate_plants']==priority['screened_operating_generators']
          assert abs(screening['qualified_operating_nameplate_mw_on_candidate_plants']-priority['screened_operating_nameplate_mw'])<0.001
          assert screening['candidate_op_plants_over_50km']==priority['operating_plants_over_50km']
          assert priority['electrical_connections_verified']==0
          print('Verified operating nameplate, plant and >50km review conservation')
          PY
      - name: Export top 20 operating plants needing independent point-of-interconnection evidence
        run: |
          python -m energy_transition.eia860_poi_document_review_queue \
            --screen outputs/eia860_plant_bus/eia860_2024_op_plant_candidate_screen.csv \
            --out-dir outputs/eia860_plant_bus \
            --top-n 20
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('outputs/eia860_plant_bus')
          initial=json.loads((r/'eia860_2024_op_plant_candidate_screen.json').read_text())
          priority=json.loads((r/'operating_plant_poi_review_summary.json').read_text())
          assert priority['source_operating_plants']==initial['candidate_plants_with_qualified_op_generator']
          assert priority['source_operating_generator_count']==initial['qualified_operating_generator_rows_on_candidate_plants']
          assert abs(priority['source_operating_nameplate_mw']-initial['qualified_operating_nameplate_mw_on_candidate_plants'])<0.001
          assert priority['long_distance_plants']==initial['candidate_op_plants_over_50km']
          assert priority['source_capacity_reconciles_with_ba_state_groups']
          assert priority['electrical_connections_verified']==0
          import pandas as pd
          names=pd.read_csv(r/'top_operating_plant_poi_review.csv',dtype={'plant_id':'string'})
          print('Top 10 operating plants to investigate (NOT verified POI):')
          print(names[['plant_id','plant_name','ba_code','state','operating_nameplate_mw','distance_km']].head(10).to_string(index=False))
          PY
      - name: Screen independently documented Grand Coulee and Palo Verde facility voltages against original grid topology
        run: |
          python -m energy_transition.eia860_facility_lead_network_audit \
            --leads docs/eia860_official_facility_document_leads_2024.csv \
            --candidates outputs/eia860_plant_bus/eia860_2024_geographic_bus_candidates.csv \
            --network /tmp/western/real-western-base-network.nc \
            --out outputs/eia860_plant_bus/official_facility_lead_network_screen_2024.csv
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/eia860_plant_bus/official_facility_lead_network_screen_2024.json').read_text())
          assert d['facility_leads']==2
          assert d['generator_injections_approved']==0
          assert d['independently_verified_source_facility_to_original_bus']==0
          PY
      - name: Search original Western network for same-state voltage-compatible facility bus alternatives
        run: |
          python -m energy_transition.eia860_facility_voltage_bus_candidates \
            --leads docs/eia860_official_facility_document_leads_2024.csv \
            --candidates outputs/eia860_plant_bus/eia860_2024_geographic_bus_candidates.csv \
            --network /tmp/western/real-western-base-network.nc \
            --radius-km 75 \
            --max-per-plant 10 \
            --out outputs/eia860_plant_bus/official_facility_alternate_bus_candidates_2024.csv
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/eia860_plant_bus/official_facility_alternate_bus_candidates_2024.json').read_text())
          assert r['facility_leads']==2
          assert r['generator_injections_approved']==0
          assert r['independently_verified_electrical_connections']==0
          for plant in r['plant_summaries']:
              print(f"Plant {plant['plant_id']} {plant['plant_name']}: {plant['same_state_voltage_compatible_candidates_within_radius']} voltage-compatible candidate buses within {r['radius_km']}km; nearest {plant['nearest_compatible_distance_km']}km (NOT approved)")
              print(f"  All local original bus voltages: {plant['geographic_bus_voltage_counts_within_radius']}; closest same-state voltage match at {plant['nearest_compatible_distance_anywhere_same_state_km']}km")
          import pandas as pd
          rows=pd.read_csv('outputs/eia860_plant_bus/official_facility_alternate_bus_candidates_2024.csv')
          print('Top voltage-compatible geographic candidates, NOT actual facility POIs:')
          print(rows[['plant_id','candidate_bus_id','candidate_bus_voltage_kv','distance_km','connected_lines','connected_transformers']].to_string(index=False))
          PY
      - name: Reconcile nearest candidate voltage screen against alternate-bus search
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path('outputs/eia860_plant_bus')
          nearest=pd.read_csv(root/'official_facility_lead_network_screen_2024.csv',dtype={'plant_id':'string','geographic_candidate_bus':'string'})
          alternates=pd.read_csv(root/'official_facility_alternate_bus_candidates_2024.csv',dtype={'plant_id':'string','candidate_bus_id':'string'})
          for plant in nearest.itertuples(index=False):
              compatible=alternates.loc[(alternates.plant_id==plant.plant_id)&(alternates.candidate_bus_id==plant.geographic_candidate_bus)]
              claimed=bool(plant.candidate_voltage_in_documented_facility_set)
              if not compatible.empty and not claimed:
                  raise ValueError(f'Contradictory nominal voltage screening for plant {plant.plant_id} and bus {plant.geographic_candidate_bus}; inspect source conversion')
              if claimed and compatible.empty:
                  raise ValueError(f'Nearest voltage compatible bus {plant.geographic_candidate_bus} missing from alternate candidate output for plant {plant.plant_id}')
              print(f'Plant {plant.plant_id}: geographic nearest bus {plant.geographic_candidate_bus} v_nom={plant.candidate_bus_v_nom_kv}, compatible={claimed}, source-consistent=True')
          PY
      - name: Trace Palo Verde original substation IDs and first-hop branch endpoints
        run: |
          python -m energy_transition.eia860_source_bus_identity_trace \
            --network /tmp/western/real-western-base-network.nc \
            --candidates outputs/eia860_plant_bus/official_facility_alternate_bus_candidates_2024.csv \
            --plant-id 6008 \
            --out outputs/eia860_plant_bus/palo_verde_original_bus_source_trace.csv
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/eia860_plant_bus/palo_verde_original_bus_source_trace.json').read_text())
          assert x['source_bus_records']>0
          assert x['generator_injection_approved'] is False
          assert x['facility_to_original_bus_identity_verified'] is False
          print('Original-bus source records traced:',x['source_bus_records'])
          PY
      - name: Group Palo Verde original candidate buses by upstream substation identity
        run: |
          python -m energy_transition.eia860_source_substation_group_audit \
            --buses outputs/eia860_plant_bus/palo_verde_original_bus_source_trace.csv \
            --edges outputs/eia860_plant_bus/palo_verde_original_bus_source_trace_edges.csv \
            --out-dir outputs/eia860_plant_bus
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/eia860_plant_bus')
          trace=json.loads((p/'palo_verde_original_bus_source_trace.json').read_text())
          grouped=json.loads((p/'palo_verde_source_substation_groups.json').read_text())
          assert grouped['candidate_bus_count']==trace['source_bus_records']
          assert grouped['total_incident_records']==trace['source_line_and_transformer_incidents']
          assert grouped['generator_injections_approved']==0
          assert not grouped['independently_verified_palo_verde_substation_identity']
          PY
      - name: Create explicitly empty reviewed electrical evidence inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          out = Path('outputs/eia860_plant_bus/reviewed_electrical_bus_evidence.csv')
          pd.DataFrame(columns=[
              'plant_id','verified_bus_id','evidence_source','reviewer',
              'evidence_status','electrical_connection_verified'
          ]).to_csv(out,index=False)
          PY
      - name: Fail closed without independent electrical connection evidence
        run: |
          python -m energy_transition.eia860_plant_bus_evidence_gate \
            --candidates outputs/eia860_plant_bus/eia860_2024_geographic_bus_candidates.csv \
            --evidence outputs/eia860_plant_bus/reviewed_electrical_bus_evidence.csv \
            --network /tmp/western/real-western-base-network.nc \
            --out outputs/eia860_plant_bus/eia860_2024_bus_evidence_admission.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('outputs/eia860_plant_bus/eia860_2024_bus_evidence_admission.json').read_text())
          assert report['candidate_plants'] > 0
          assert report['independently_reviewed_electrical_bus_evidence_records'] == 0
          assert report['full_western_opf_ready'] is False
          print('Verified: real geographic candidates were NOT admitted as electrical connections.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia860-2024-geographic-bus-admission-screen
          path: outputs/eia860_plant_bus/
          retention-days: 30
