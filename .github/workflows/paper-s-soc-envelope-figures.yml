name: Paper S archive-derived SOC envelope Figure S16
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_soc_envelope_figures.py'
      - 'tests/test_paper_s_soc_envelope_figures.py'
      - '.github/workflows/paper-s-soc-envelope-figures.yml'
permissions:
  contents: read
  actions: read
jobs:
  figure-s16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test constrained occupancy interval certificate and drawing
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_soc_envelope_figures.py
      - name: Restore accepted eight original-cost-capped occupancy intervals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/accepted
          gh run download 42716052153 -R "${{ github.repository }}" \
            -n paper-s-eight-explicit-cost-cap-soc-envelope-comparisons -D /tmp/accepted
          test -s /tmp/accepted/paper_s_24_original_cost_certified_schedules.csv
      - name: Render source-certified Figure S16
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_soc_envelope_figures \
            --summary /tmp/accepted/paper_s_24_original_cost_certified_schedules.csv \
            --out-dir outputs
          test -s outputs/Figure_S16_SOC_occupancy_cost_cap_envelopes.png
          test -s outputs/Figure_S16_SOC_occupancy_cost_cap_envelopes.svg
          test -s outputs/paper_s_eight_SOC_occupancy_intervals.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-certified-figure-S16-soc-occupancy-envelopes
          path: outputs/
          if-no-files-found: error
