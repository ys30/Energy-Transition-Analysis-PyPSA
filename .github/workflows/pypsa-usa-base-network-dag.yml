name: PyPSA-USA western base-network upstream DAG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pypsa-usa-base-network-dag.yml
permissions:
  contents: read
jobs:
  upstream-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout upstream PyPSA-USA
        run: git clone --depth=1 https://github.com/PyPSA/pypsa-usa.git /tmp/pypsa-usa
      - name: Record immutable upstream revision and default topology
        run: |
          cd /tmp/pypsa-usa
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/upstream_pypsa_usa_sha.txt"
          grep -nE 'interconnect:|transmission_network:|topological_boundaries:' workflow/repo_data/config/config.default.yaml
      - name: Install upstream environment runner
        run: python -m pip install uv
      - name: Inspect upstream base-network build DAG (no full data download)
        working-directory: /tmp/pypsa-usa
        run: |
          bash init_pypsa_usa.sh
          cd workflow
          uv run snakemake --dry-run -j1 \
            --configfile config/config.default.yaml \
            --until build_base_network > "$GITHUB_WORKSPACE/upstream_base_network_dag.txt" 2>&1 || {
              tail -120 "$GITHUB_WORKSPACE/upstream_base_network_dag.txt"
              exit 1
            }
          tail -100 "$GITHUB_WORKSPACE/upstream_base_network_dag.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pypsa-usa-western-base-network-upstream-dag
          path: |
            upstream_pypsa_usa_sha.txt
            upstream_base_network_dag.txt
          if-no-files-found: warn
