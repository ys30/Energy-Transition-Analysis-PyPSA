name: Verified two-load AC-path constrained EFS pilot
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/real-two-load-ac-path-efs.yml
      - src/energy_transition/real_two_load_ac_path_dispatch.py
      - src/energy_transition/real_two_load_ac_path_acceptance.py
permissions:
  contents: read
  actions: read
jobs:
  two-load-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyPSA and HiGHS
        run: python -m pip install 'pypsa==0.31.2' 'highspy>=1.7,<2'
      - name: Download verified EFS networks from successful base-network run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41390831322 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/networks
          for year in 2030 2040 2050; do
            test -s "/tmp/networks/efs-real-${year}-local-hour-load-only.nc"
          done
      - name: Solve actual 4-bus 3-line 2-EFS-load sample in three years
        run: |
          set -euo pipefail
          for year in 2030 2040 2050; do
            PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.real_two_load_ac_path_dispatch \
              --network "/tmp/networks/efs-real-${year}-local-hour-load-only.nc" \
              --out "outputs/two-load-ac-path-${year}-24h.json"
          done
      - name: Solve extended 168-hour dual-load sensitivity for each year
        run: |
          set -euo pipefail
          for year in 2030 2040 2050; do
            PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.real_two_load_ac_path_dispatch \
              --network "/tmp/networks/efs-real-${year}-local-hour-load-only.nc" \
              --hours 168 \
              --out "outputs/two-load-ac-path-${year}-168h.json"
          done
      - name: Independently accept three-year dual-load nodal and provenance results
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m energy_transition.real_two_load_ac_path_acceptance \
            --input-dir outputs \
            --out outputs/two-load-three-year-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-two-load-ac-path-2030-2050
          path: outputs/*.json
