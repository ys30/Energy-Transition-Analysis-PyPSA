name: Western full OPF readiness evidence audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/western-full-opf-readiness.yml'
      - 'src/energy_transition/western_full_opf_readiness_audit.py'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . && python -m pip install 'pypsa>=0.30,<1.0' netcdf4
      - name: Reuse successful Western network
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/western
          gh run download 41531397166 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/western
          test -s /tmp/western/real-western-base-network.nc
      - name: Audit full-network OPF inputs
        run: python -m energy_transition.western_full_opf_readiness_audit --network /tmp/western/real-western-base-network.nc --out outputs/western-opf-readiness.json
      - name: Obtain three previously validated EFS load-bearing networks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/efs
          gh run download 41390831322 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/efs
          for year in 2030 2040 2050; do
            test -s "/tmp/efs/efs-real-${year}-local-hour-load-only.nc"
          done
      - name: Audit all three load-bearing networks without claiming generation readiness
        run: |
          set -euo pipefail
          for year in 2030 2040 2050; do
            python -m energy_transition.western_full_opf_readiness_audit \
              --network "/tmp/efs/efs-real-${year}-local-hour-load-only.nc" \
              --out "outputs/western-opf-readiness-efs-${year}.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: western-opf-readiness-audit
          path: outputs/
