name: Paper T Idaho original-source reference marginal figure
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-t-idaho-reference-marginals.yml'
      - 'src/energy_transition/paper_t_idaho_reference_marginals.py'
      - 'tests/test_paper_t_idaho_reference_marginals.py'
permissions:
  contents: read
  actions: read
jobs:
  source-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'matplotlib>=3.7' 'pytest>=8'
      - name: Test marginal figure
        run: PYTHONPATH=src python -m pytest -q tests/test_paper_t_idaho_reference_marginals.py
      - name: Recover archived Idaho original-source metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/real-fig
          gh run download 42125517759 -R "${{ github.repository }}" -n efs-idaho-source-residual-month-hour-2030-2050 -D /tmp/real-fig
          test -s /tmp/real-fig/source_month_hour_residual_groups.csv
      - name: Produce source-derived reference marginal SVG and PNG
        run: |
          PYTHONPATH=src python -m energy_transition.paper_t_idaho_reference_marginals \
            --grouped /tmp/real-fig/source_month_hour_residual_groups.csv \
            --out outputs/paper_t_idaho_reference_marginals
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/paper_t_idaho_reference_marginals')
          a=json.loads((p/'manifest.json').read_text())
          assert a['archived_group_rows']==324 and not a['figure_is_joint_heatmap']
          assert len(list(p.glob('*.svg')))==1 and len(list(p.glob('*.png')))==1
          print('PAPER_T_SOURCE_MARGINAL_FIGURE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-t-idaho-reference-month-hour-marginal-figure
          path: outputs/paper_t_idaho_reference_marginals/
          if-no-files-found: error
