name: Idaho two-offset nonwrapping falsification
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/efs-idaho-two-offset-falsification.yml'
      - 'src/energy_transition/efs_idaho_two_offset_falsification.py'
      - 'tests/test_efs_idaho_two_offset_falsification.py'
permissions:
  contents: read
  actions: read
jobs:
  idaho-two-offset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'h5py>=3.10' 'pytest>=8'
      - name: Test nonwrapping bidirectional 2030 frozen weight
        run: PYTHONPATH=src python -m pytest -q tests/test_efs_idaho_two_offset_falsification.py
      - name: Fetch original publisher-source EFS 2020 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/efs2020 /tmp/reeds2022 outputs
          gh run download 41262154939 -R "${{ github.repository }}" -n pypsa-usa-efs-source-evidence -D /tmp/efs2020
          test -s /tmp/efs2020/outputs/efs-core-west-2030-2040-2050-hourly.csv.gz
      - name: Fetch verified independent ReEDS 2022 reference
        run: |
          curl -fLsS --retry 3 --connect-timeout 25 --max-time 300 'https://zenodo.org/records/18461543/files/demand_EFS_REFERENCE.h5?download=1' -o /tmp/reeds2022/demand_EFS_REFERENCE.h5
          echo '7b2055d43200744a16a8c4fed68b1a17  /tmp/reeds2022/demand_EFS_REFERENCE.h5' | md5sum --check
      - name: Fit only on 2030 first half and score original sources without wrap
        run: |
          PYTHONPATH=src python -m energy_transition.efs_idaho_two_offset_falsification \
            --efs-hourly /tmp/efs2020/outputs/efs-core-west-2030-2040-2050-hourly.csv.gz \
            --reeds-h5 /tmp/reeds2022/demand_EFS_REFERENCE.h5 \
            --out-csv outputs/idaho_two_offset_crossyear_falsification.csv \
            --out-json outputs/idaho_two_offset_provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: idaho-two-offset-nonwrap-frozen-crossyear
          path: outputs/
          if-no-files-found: error
