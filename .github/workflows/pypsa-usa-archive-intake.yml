name: PyPSA-USA verified public archive intake
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/energy_transition/pypsa_usa_archive_download.py
      - src/energy_transition/wecc_ads_archive_inventory.py
      - .github/workflows/pypsa-usa-archive-intake.yml
      - src/energy_transition/pypsa_usa_bundle_role.py
      - tests/test_pypsa_usa_bundle_role.py
permissions:
  contents: read
jobs:
  archive-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Download official data archive and verify publisher checksum
        run: |
          python -m energy_transition.pypsa_usa_archive_download \
            --archive /tmp/pypsa_usa_data.zip \
            --report outputs/pypsa_usa_archive_receipt.json
      - name: Inventory verified archive
        run: |
          python -m energy_transition.wecc_ads_archive_inventory \
            --archive /tmp/pypsa_usa_data.zip \
            --output outputs/pypsa_usa_archive_inventory.json \
            --max-member-bytes 20000000000
      - name: Report actual archive member names and candidate types
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          data=json.loads(Path("outputs/pypsa_usa_archive_inventory.json").read_text())
          files=data["files"]
          print("TOTAL_MEMBERS:",len(files))
          print("CANDIDATE_COUNT:",data.get("candidate_count",0))
          print("EXTENSIONS:",dict(Counter(x["extension"] for x in files)))
          for member in sorted(files,key=lambda x:x["size_bytes"],reverse=True)[:35]:
              print("MEMBER:",member["name"],"SIZE:",member["size_bytes"],"TYPE:",member["candidate_type"])
          PY
      - name: Classify auxiliary versus electrical network contents
        run: |
          python -m pytest -q tests/test_pypsa_usa_bundle_role.py
          python -m energy_transition.pypsa_usa_bundle_role \
            --inventory outputs/pypsa_usa_archive_inventory.json \
            --output outputs/pypsa_usa_bundle_role.json
      - uses: actions/upload-artifact@v4
        with:
          name: pypsa-usa-verified-archive-receipt-and-inventory
          path: |
            outputs/pypsa_usa_archive_receipt.json
            outputs/pypsa_usa_archive_inventory.json
            outputs/pypsa_usa_bundle_role.json
