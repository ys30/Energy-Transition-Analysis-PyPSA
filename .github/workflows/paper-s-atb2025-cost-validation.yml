name: Paper S ATB 2025 extension cost algebra and provenance validation
'on':
  pull_request:
    paths:
      - 'src/energy_transition/paper_s_atb_2030_storage_extension_cost.py'
      - 'tests/test_paper_s_atb_2030_storage_extension_cost.py'
      - '.github/workflows/paper-s-atb2025-cost-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cost-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'pytest>=8'
      - name: Test cost increment and reject unverified ATB records
        run: PYTHONPATH=src python -m pytest -q tests/test_paper_s_atb_2030_storage_extension_cost.py
