name: BPAT wind empirical reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/energy_transition/bpat_wind_reconciliation.py
      - tests/test_bpat_wind_reconciliation.py
      - src/energy_transition/eia930_bpat_wind_download.py
      - .github/workflows/bpat-wind-empirical.yml
      - src/energy_transition/eia923_normalize.py
      - src/energy_transition/eia860_plant_ba.py
permissions:
  contents: read
jobs:
  validate-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Run plant-to-BA and annual-hourly reconciliation tests
        run: python -m pytest -q tests/test_bpat_wind_reconciliation.py
  official-wind-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Require EIA API key
        run: |
          if [ -z "$EIA_API_KEY" ]; then
            echo "::error::EIA_API_KEY is required for official BPAT wind data"
            exit 1
          fi
      - name: Download observed BPAT wind and audit coverage
        run: python -m energy_transition.eia930_bpat_wind_download --year 2024 --output outputs/bpat_wind_source
      - name: Publish source completeness
        if: success()
        run: |
          cat outputs/bpat_wind_source/coverage.json
          echo '### Official EIA-930 BPAT wind source coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/bpat_wind_source/coverage.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia930-bpat-wnd-official-2024
          path: outputs/bpat_wind_source/
          retention-days: 90
  official-plant-reconciliation:
    needs: [official-wind-source]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: eia930-bpat-wnd-official-2024
          path: outputs/bpat_wind_source
      - name: Obtain and normalize official EIA-923 plant-month generation
        run: |
          python -m energy_transition.eia923_download --url https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip --year 2024 --output outputs/eia923/eia923_2024.xlsx
          python -m energy_transition.eia923_normalize --xlsx outputs/eia923/eia923_2024.xlsx --year 2024 --allow-incomplete --output outputs/eia923
      - name: Obtain matching official EIA-860 plant-to-BA crosswalk
        run: |
          python -m energy_transition.eia860_capacity --year 2024 --output outputs/eia860
          python -m energy_transition.eia860_plant_ba --year 2024 --generators outputs/eia860/western_state_generators_2024.csv --output outputs/eia860
      - name: Record official input coverage and prevent partial EIA-923 totals from being treated as complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path("outputs/bpat_wind_source/coverage.json").read_text())
          e=json.loads(Path("outputs/eia923/eia923_source_2024.json").read_text())
          print("BPAT WND hourly coverage:",json.dumps(w,indent=2))
          print("EIA-923 source normalization coverage:",json.dumps(e,indent=2))
          if not w["complete"]:
              raise ValueError("Incomplete official EIA-930 BPAT wind year; cannot compare annual totals")
          if e["excluded_valid_numeric_cells"] or e["unmapped_fuel_cells"]:
              print("::warning::EIA-923 has excluded or unmapped source cells; downstream annual wind comparison is conditional on source completeness.")
          PY
      - name: Reconcile only if official BPAT wind hourly coverage is complete
        run: |
          python -m energy_transition.bpat_wind_reconciliation --plant-month outputs/eia923/eia923_normalized_2024.csv --plant-ba outputs/eia860/plant_ba_crosswalk_2024.csv --hourly outputs/bpat_wind_source/eia930_bpat_wnd_hourly.csv --year 2024 --output outputs/bpat_wind_reconciliation
          cat outputs/bpat_wind_reconciliation/reconciliation.json
      - name: Audit whether excluded EIA-923 wind records intersect BPAT plants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("outputs")
          cross=pd.read_csv(root/"eia860/plant_ba_crosswalk_2024.csv",dtype={"plant_id":"string"})
          bpat=set(cross.loc[cross.ba_code.eq("BPAT"),"plant_id"].str.replace(r"\\.0$","",regex=True))
          exc=pd.read_csv(root/"eia923/eia923_excluded_monthly_cells_2024.csv",dtype={"plant_id":"string"})
          numeric=pd.read_csv(root/"eia923/eia923_excluded_numeric_cells_2024.csv",dtype={"plant_id":"string"})
          for frame in (exc,numeric):
              frame["plant_id"]=frame.plant_id.str.strip().str.replace(r"\\.0$","",regex=True)
          # Fuel code WND identifies wind; never count unrelated excluded fuels.
          exc_wind=exc.loc[exc.fuel_code.astype("string").str.upper().eq("WND") & exc.plant_id.isin(bpat)]
          num_wind=numeric.loc[numeric.fuel_code.astype("string").str.upper().eq("WND") & numeric.plant_id.isin(bpat)]
          result={
            "year":2024,"scope":"BPAT EIA-860 mapped plants, EIA-923 WND fuel only",
            "excluded_wind_monthly_cells":len(exc_wind),
            "affected_bpat_wind_plant_ids":sorted(set(exc_wind.plant_id.dropna()) | set(num_wind.plant_id.dropna())),
            "excluded_valid_numeric_wind_cells":len(num_wind),
            "excluded_valid_numeric_wind_mwh":float(num_wind.net_generation_mwh.sum()),
            "caveat":"Missing EIA-923 source values remain unknown; this is not an imputation or explanation of EIA-930 discrepancy."
          }
          out=root/"bpat_wind_reconciliation"
          out.mkdir(parents=True,exist_ok=True)
          (out/"excluded_source_wind_audit.json").write_text(json.dumps(result,indent=2)+"\\n")
          print(json.dumps(result,indent=2))
          PY
      - name: Publish BPAT-only excluded source audit alongside annual totals
        if: success()
        run: |
          echo '### BPAT-specific excluded EIA-923 wind source records' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/bpat_wind_reconciliation/excluded_source_wind_audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("outputs/bpat_wind_reconciliation/excluded_source_wind_audit.json").read_text())
          if a["excluded_wind_monthly_cells"] or a["excluded_valid_numeric_wind_cells"]:
              print("::warning::BPAT-mapped wind plants intersect excluded EIA-923 source rows; inspect audit before treating the annual total as complete.")
          else:
              print("No excluded EIA-923 WND source rows intersect the 2024 BPAT EIA-860 plant crosswalk.")
          PY
      - name: Summarize measured discrepancy without asserting its cause
        if: success()
        run: |
          echo '### BPAT 2024 wind: EIA-923 versus EIA-930' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/bpat_wind_reconciliation/reconciliation.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpat-wind-plant-reconciliation-2024
          path: |
            outputs/bpat_wind_reconciliation/
            outputs/eia923/eia923_source_2024.json
            outputs/eia923/eia923_excluded_monthly_cells_2024.csv
            outputs/eia923/eia923_unmapped_fuel_cells_2024.csv
            outputs/eia923/eia923_excluded_numeric_cells_2024.csv
            outputs/eia860/plant_ba_crosswalk_2024.csv
            outputs/eia860/plant_ba_raw_audit_2024.csv
            outputs/eia860/ba_crosswalk_manifest_2024.json
          retention-days: 90
