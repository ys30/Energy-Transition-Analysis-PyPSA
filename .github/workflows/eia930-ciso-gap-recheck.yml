name: Recheck official CISO EIA-930 NG 24-hour gap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/energy_transition/eia930_ciso_gap_recheck.py
      - src/energy_transition/eia930_generation_audit.py
      - .github/workflows/eia930-ciso-gap-recheck.yml
permissions:
  contents: read
jobs:
  source-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Query official EIA-930 NG and write UTC gap audit
        run: python -m energy_transition.eia930_ciso_gap_recheck --output outputs/ciso_ng_gap_recheck.json
      - name: Show gap evidence in run summary
        if: success()
        run: |
          python - <<'PY'
          import json, os
          data=json.load(open("outputs/ciso_ng_gap_recheck.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## CISO official NG source recheck\n\n")
              for k in ("expected_hours","returned_timestamp_hours","returned_nonnull_hours","returned_null_hours","missing_timestamp_hours"):
                  f.write(f"- {k}: {data[k]}\n")
              f.write("\nThis audit does not establish a DST cause.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ciso-eia930-ng-gap-recheck
          path: outputs/ciso_ng_gap_recheck.json
          if-no-files-found: warn
          retention-days: 90
