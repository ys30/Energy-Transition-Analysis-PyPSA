name: Official EIA renewable gap refetch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia930-gap-refetch.yml'
      - 'src/energy_transition/eia930_renewable_gap_refetch.py'
jobs:
  refetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: eia930-hourly-solar-wind-2024
          run-id: 41003777337
          github-token: ${{ github.token }}
          path: inputs/renewables
      - name: Request official EIA records for exact missing BA fuel windows
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          test -n "$EIA_API_KEY"
          python -m energy_transition.eia930_renewable_gap_refetch \
            --input inputs/renewables/renewable_hourly_observed.csv \
            --output outputs/gap_refetch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-eia-renewable-gap-refetch-2024
          path: outputs/gap_refetch/
