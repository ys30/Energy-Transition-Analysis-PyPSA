name: Compare original ReEDS county-majority source bus remap to raw pinned polygons
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/efs-reeds-county-majority-source-audit.yml'
      - 'src/energy_transition/efs_reeds_county_majority_source_audit.py'
      - 'tests/test_efs_reeds_county_majority_source_audit.py'
permissions:
  contents: read
  actions: read
jobs:
  source-county:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source PyPSA and GIS dependencies
        run: python -m pip install -e '.[model]' netcdf4 geopandas shapely pyogrio pytest
      - name: Test original raw-zone versus final county-majority label separation
        run: PYTHONPATH=src python -m pytest tests/test_efs_reeds_county_majority_source_audit.py -q
      - name: Retrieve source archival network and same-commit ReEDS polygons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/county-reeds/source /tmp/county-reeds/raw
          gh run download 41281576025 -R "${{ github.repository }}" \
            -n real-western-base-network-attempt -D /tmp/county-reeds/source
          NET=$(find /tmp/county-reeds/source -name real-western-base-network.nc -type f -print -quit)
          test -n "$NET" && test -s "$NET"
          echo "ORIGINAL_NETWORK=$NET" >> "$GITHUB_ENV"
          for ext in shp shx dbf prj cpg; do
            curl --fail --retry 3 --silent --show-error --location \
              "https://raw.githubusercontent.com/PyPSA/pypsa-usa/338af9912addbaf038c6098fe27e1e6ef099d8aa/workflow/repo_data/geospatial/Reeds_Shapes/rb_and_ba_areas.${ext}" \
              -o "/tmp/county-reeds/raw/rb_and_ba_areas.${ext}"
            test -s "/tmp/county-reeds/raw/rb_and_ba_areas.${ext}"
          done
      - name: Quantify source Montana and Arizona county bus label and raw zone mode
        run: |
          PYTHONPATH=src python -m energy_transition.efs_reeds_county_majority_source_audit \
            --base "$ORIGINAL_NETWORK" \
            --raw-reeds /tmp/county-reeds/raw/rb_and_ba_areas.shp \
            --out outputs/efs_2030_reeds_county_majority_source_review.json
      - name: Verify original source record scope and interpretation constraints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/efs_2030_reeds_county_majority_source_review.json').read_text())
          assert len(r['reviewed_source_load_cases'])==2
          assert [x['original_firstbus_id'] for x in r['reviewed_source_load_cases']]==['2040000','2077004']
          assert not r['historical_premajority_bus_labels_recovered']
          assert not r['historical_posttrimmed_zone_geometry_recovered']
          assert not r['original_load_relocation_approved']
          assert not r['physically_validated_western_OPF']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efs-original-county-majority-reeds-zone-source-comparison
          path: outputs/efs_2030_reeds_county_majority_source_review.json
          if-no-files-found: warn
