name: Paper S common AC 2030 108 LP efficiency and firm-cost sensitivity
'on':
  pull_request:
    paths:
      - 'src/energy_transition/reeds2022_ac_cost_efficiency_2030.py'
      - 'tests/test_reeds2022_ac_cost_efficiency_2030.py'
      - '.github/workflows/paper-s-reeds2022-ac-cost-eta-2030.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-source-108-efficiency-cost-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HiGHS source-data and test dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11' 'h5py>=3.10' 'pytest>=8'
      - name: Guard 108-scenario matrix and 36 source-matched annuity comparisons
        run: PYTHONPATH=src python -m pytest -q tests/test_reeds2022_ac_cost_efficiency_2030.py
      - name: Retrieve certified source four-state wind/PV 2012 weather
        run: |
          mkdir -p /tmp/reeds/wind /tmp/reeds/pv outputs
          for tech in wind pv; do
            for attempt in 1 2 3; do
              gh run download 42962740548 --repo "${{ github.repository }}" \
                --name "paper-s-reeds2022-original-2012-county-${tech}-hdf5-source-audit" \
                --dir "/tmp/reeds/${tech}" && break
              if [ "${attempt}" -eq 3 ]; then exit 1; fi
              sleep 8
            done
          done
      - name: Download and hash-check original ReEDS demand HDF5
        run: |
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 900 \
            'https://zenodo.org/records/18461543/files/demand_EFS_REFERENCE.h5?download=1' \
            -o /tmp/reeds/demand_EFS_REFERENCE.h5
          echo '7b2055d43200744a16a8c4fed68b1a17  /tmp/reeds/demand_EFS_REFERENCE.h5' | md5sum --check
      - name: Solve 108 HiGHS LP and test 36 incremental 4h to 8h thresholds
        run: |
          PYTHONPATH=src python -m energy_transition.reeds2022_ac_cost_efficiency_2030 \
            --demand-h5 /tmp/reeds/demand_EFS_REFERENCE.h5 \
            --wind-csv /tmp/reeds/wind/reeds2022_wind_2012_four_state_instantaneous_cf.csv \
            --pv-csv /tmp/reeds/pv/reeds2022_pv_2012_four_state_instantaneous_cf.csv \
            --out outputs
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,json
          p=Path('outputs')
          a=pd.read_csv(p/'paper_s_reeds2022_2030_common_ac_108_efficiency_firm_cost_lp.csv')
          b=pd.read_csv(p/'paper_s_reeds2022_2030_common_ac_36_efficiency_firm_cost_4_to_8h.csv')
          m=json.loads((p/'paper_s_reeds2022_2030_common_ac_108_cost_eta_manifest.json').read_text())
          assert len(a)==108 and len(b)==36
          assert a.solver_status.eq('optimal').all()
          assert a.max_equality_residual_mwh.max()<1e-5
          assert m['common_AC_capacity_bases'] and not m['battery_capex_in_optimization']
          assert not m['actual_fleet_and_market_cost_calibration']
          print('SOURCE_COMMON_AC_108_LP_36_COST_ETA_PAIRED_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-s-reeds2022-2030-ac-108-cost-eta-lp-and-36-storage-hurdles
          path: outputs/
          if-no-files-found: warn
