name: 2025-2040 capacity planning sensitivities
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/planning-sensitivity.yml'
      - 'src/energy_transition/planning_sensitivity.py'
      - 'src/energy_transition/solar_availability.py'
      - 'src/energy_transition/wind_availability.py'
      - 'src/energy_transition/carbon_scenario_comparison.py'
jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]' openpyxl xlrd
      - name: Solve four planning years under documented demand scenarios
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          test -n "$EIA_API_KEY"
          python -m energy_transition.planning_sensitivity --output outputs/planning_sensitivity
      - name: Verify carbon cap and compare model abatement costs
        run: |
          python -m energy_transition.carbon_scenario_comparison --summary outputs/planning_sensitivity/scenario_summary.csv --output outputs/planning_sensitivity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pypsa-planning-sensitivity
          path: outputs/planning_sensitivity/
          retention-days: 30
