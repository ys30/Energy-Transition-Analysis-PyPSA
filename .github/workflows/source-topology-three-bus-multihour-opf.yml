name: Synthetic Western source-topology three-bus multi-hour OPF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-topology-three-bus-multihour-opf.yml'
      - 'src/energy_transition/source_topology_three_bus_multihour_opf.py'
      - 'tests/test_source_topology_three_bus_multihour_opf.py'
      - 'docs/western_source_network_provenance.json'
permissions:
  contents: read
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solver and dependencies
        run: |
          python -m pip install -e '.[model,dev]'
          python -m pip install 'pypsa>=0.30,<1.0' highspy netcdf4
      - name: Require documented synthetic source provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('docs/western_source_network_provenance.json').read_text())
          assert 'synthetic' in m['source_network_family'].lower()
          assert m['empirical_western_opf_ready'] is False
          assert m['utility_authenticated_electrical_facility_identities'] is False
          PY
      - name: Download pinned Western synthetic source network
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/western
          gh run download 41531397166 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/western
          test -s /tmp/western/real-western-base-network.nc
      - name: Solve three-bus three-hour synthetic-source line capacity sweep
        run: |
          python -m energy_transition.source_topology_three_bus_multihour_opf \
            --network /tmp/western/real-western-base-network.nc \
            --anchor 2040841 \
            --out outputs/synthetic_source_three_bus_multihour_opf.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/synthetic_source_three_bus_multihour_opf.json').read_text())
          assert r['synthetic_multinode_multiperiod_opf_executed'] is True
          assert r['real_western_opf_executed'] is False
          assert r['snapshots']==3
          assert len(r['selected_source_line_ids'])==2
          assert len(r['snapshot_results'])==9
          assert r['physical_facility_mapping_verified'] is False
          print('Validated three-node hourly synthetic OPF against analytic dispatch and constraints.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: western-source-topology-three-bus-multihour-opf
          path: outputs/synthetic_source_three_bus_multihour_opf.json
          retention-days: 60
