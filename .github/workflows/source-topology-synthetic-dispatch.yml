name: Synthetic Western source-topology two-bus OPF verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-topology-synthetic-dispatch.yml'
      - 'src/energy_transition/source_topology_synthetic_dispatch.py'
      - 'tests/test_source_topology_synthetic_dispatch.py'
      - 'docs/western_source_network_provenance.json'
permissions:
  contents: read
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyPSA and HiGHS
        run: |
          python -m pip install -e '.[model,dev]'
          python -m pip install 'pypsa>=0.30,<1.0' highspy netcdf4
      - name: Require pinned synthetic topology provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('docs/western_source_network_provenance.json').read_text())
          assert 'synthetic' in m['source_network_family'].lower()
          assert m['utility_authenticated_electrical_facility_identities'] is False
          assert m['empirical_western_opf_ready'] is False
          PY
      - name: Download previously validated synthetic Western source network
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/western
          gh run download 41531397166 -R "${{ github.repository }}" -n real-western-base-network-attempt -D /tmp/western
          test -s /tmp/western/real-western-base-network.nc
      - name: Solve synthetic source-topology two-bus OPF capacity sweep
        run: |
          python -m energy_transition.source_topology_synthetic_dispatch \
            --network /tmp/western/real-western-base-network.nc \
            --anchor 2040841 \
            --out outputs/synthetic_source_topology_dispatch.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/synthetic_source_topology_dispatch.json').read_text())
          assert r['synthetic_two_bus_opf_executed'] is True
          assert r['real_western_opf_executed'] is False
          assert r['source_facility_identity_verified'] is False
          assert len(r['capacity_sweep'])==3
          print('Verified analytic synthetic capacity sweep; not physical Palo Verde dispatch.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: western-source-topology-synthetic-two-bus-opf
          path: outputs/synthetic_source_topology_dispatch.json
          retention-days: 60
