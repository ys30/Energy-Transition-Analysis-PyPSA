name: Paper S authenticated EIA930 2023 full-year BA wind solar coverage
'on':
  pull_request:
    paths:
      - 'src/energy_transition/paper_s_eia930_2023_full_year_BA_coverage.py'
      - 'tests/test_paper_s_eia930_2023_full_year_BA_coverage.py'
      - '.github/workflows/paper-s-eia930-2023-full-year-ba-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-full-year-source-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test source calendar safeguards
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'pytest>=8'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_eia930_2023_full_year_BA_coverage.py
      - name: Download both publisher-mirrored EIA930 2023 halves with independent MD5 pins
        run: |
          set -euo pipefail
          mkdir -p inputs outputs
          fetch_verified() {
            local filename="$1" expected="$2" attempt
            for attempt in 1 2 3 4; do
              rm -f "inputs/$filename"
              if curl -fL --show-error --silent --retry 2 --retry-all-errors \
                --retry-delay 12 --connect-timeout 30 --max-time 1200 \
                "https://zenodo.org/records/22856870/files/$filename?download=1" \
                -o "inputs/$filename"; then
                if echo "$expected  inputs/$filename" | md5sum --check; then return 0; fi
              fi
              if [ "$attempt" -eq 4 ]; then echo "::error::H1/H2 EIA930 publisher mirror unavailable/mismatched";return 1;fi
              sleep 30
            done
          }
          fetch_verified eia930-2023half1.zip 1b4acef4e1ec596cf92e7658f9be64c7
          fetch_verified eia930-2023half2.zip 1de4e47693426671123bb08ec0d33995
      - name: Extract actual 2023 annual BA wind/solar records without imputation
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_eia930_2023_full_year_BA_coverage \
            --archive-h1 inputs/eia930-2023half1.zip \
            --archive-h2 inputs/eia930-2023half2.zip --out outputs
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          o=Path('outputs')
          m=json.loads((o/'paper_s_eia930_2023_annual_BA_coverage_manifest.json').read_text())
          a=pd.read_csv(o/'paper_s_eia930_2023_annual_8_BA_fuel_coverage.csv')
          b=pd.read_csv(o/'paper_s_eia930_2023_annual_96_month_BA_fuel_coverage.csv')
          assert len(a)==8 and len(b)==96
          assert m['expected_hours_per_BA_fuel']==8760
          assert (a.source_timestamp_count+a.missing_source_hour_ending_count).eq(8760).all()
          assert (a.non_null_reported_MW_count+a.null_reported_MW_on_present_hour).eq(a.source_timestamp_count).all()
          assert m['BA_equals_state'] is False
          assert m['model_skill_validated'] is False
          print('PAPER_S_EIA930_2023_8760H_SOURCE_COVERAGE_ONLY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-s-2023-full-year-8760-hour-EIA930-BA-wind-solar-observation-coverage
          path: outputs/
          if-no-files-found: warn
