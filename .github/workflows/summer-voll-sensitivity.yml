name: Summer battery shortage-penalty sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/summer-voll-sensitivity.yml'
      - 'src/energy_transition/summer_voll_sensitivity.py'
      - 'src/energy_transition/chronological_storage_pilot.py'
      - 'tests/test_summer_voll_sensitivity.py'
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]'
      - run: python -m pytest -q tests/test_summer_voll_sensitivity.py
      - uses: actions/download-artifact@v4
        with:
          name: eia930-west-2024
          run-id: 40935909190
          github-token: ${{ github.token }}
          path: inputs/eia930_2024
      - name: Independently optimize each summer shortage penalty scenario
        run: |
          python -m energy_transition.summer_voll_sensitivity \
            --hourly inputs/eia930_2024/eia930_demand_2024.csv \
            --output outputs/summer_voll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summer-voll-storage-sensitivity-2024
          path: outputs/summer_voll/
          retention-days: 60
