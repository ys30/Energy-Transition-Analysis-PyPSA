name: Paper S archived SOC near-optimal Figure S15
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/energy_transition/paper_s_soc_tiebreak_figures.py'
      - 'tests/test_paper_s_soc_tiebreak_figures.py'
      - '.github/workflows/paper-s-soc-tiebreak-figures.yml'
permissions:
  contents: read
  actions: read
jobs:
  source-certified-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Figure S15 source coverage and plot
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4' 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_paper_s_soc_tiebreak_figures.py
      - name: Retrieve 32 original-cost revalued schedule choices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source
          gh run download 42704492819 -R "${{ github.repository }}" \
            -n paper-s-32-near-optimal-schedule-comparisons -D /tmp/source
          test -s /tmp/source/paper_s_32_original_cost_rescored_schedule_perturbations.csv
      - name: Verify and render publication Figure S15
        run: |
          PYTHONPATH=src python -m energy_transition.paper_s_soc_tiebreak_figures \
            --source /tmp/source/paper_s_32_original_cost_rescored_schedule_perturbations.csv \
            --out-dir outputs
          test -s outputs/Figure_S15_SOC_schedule_sensitivity.png
          test -s outputs/Figure_S15_SOC_schedule_sensitivity.svg
      - uses: actions/upload-artifact@v4
        with:
          name: paper-s-certified-near-optimal-figure-S15
          path: outputs/
          if-no-files-found: error
